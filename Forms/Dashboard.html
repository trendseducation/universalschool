<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>🏫 Universal English Medium School Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ===== HIDE SCROLLBAR GLOBALLY BUT KEEP SCROLLING ENABLED ===== */
        ::-webkit-scrollbar {
            width: 0px;
            height: 0px;
            background: transparent;
            display: none;
        }
        
        * {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        
        body {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        body::-webkit-scrollbar {
            display: none;
        }
        
        .sidebar, .main-content, .embed-view, .view-container, iframe, .nav-menu {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        
        .sidebar::-webkit-scrollbar,
        .main-content::-webkit-scrollbar,
        .embed-view::-webkit-scrollbar,
        .view-container::-webkit-scrollbar,
        iframe::-webkit-scrollbar {
            display: none;
            width: 0;
        }

        /* ======================== CSS VARIABLES ======================== */
        :root {
            /* Light Mode */
            --bg-primary: #f4f7fc;
            --bg-sidebar: #ffffff;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #5b6e8c;
            --accent-primary: #2563eb;
            --accent-secondary: #7c3aed;
            --accent-glow: rgba(37, 99, 235, 0.15);
            --accent-hover: #1d4ed8;
            --border-light: #e2e8f0;
            --card-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.08);
            --card-border: 1px solid rgba(0, 0, 0, 0.05);
            --transition: 0.25s ease;
            --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-accent: linear-gradient(135deg, #2563eb, #7c3aed);
            --danger: #ef4444;
            --danger-light: rgba(239, 68, 68, 0.1);
        }

        /* Dark Mode */
        [data-theme="dark"] {
            --bg-primary: #0a0f1c;
            --bg-sidebar: #111827;
            --bg-card: #1e293b;
            --text-main: #f1f5f9;
            --text-muted: #9ca3af;
            --accent-primary: #3b82f6;
            --accent-secondary: #8b5cf6;
            --accent-glow: rgba(59, 130, 246, 0.2);
            --accent-hover: #60a5fa;
            --border-light: #1f2a3e;
            --card-shadow: 0 20px 30px -12px rgba(0, 0, 0, 0.5);
            --card-border: 1px solid rgba(255, 255, 255, 0.05);
            --gradient-primary: linear-gradient(135deg, #1e1e2e 0%, #2d1b4e 100%);
            --gradient-accent: linear-gradient(135deg, #3b82f6, #8b5cf6);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            transition: background var(--transition), color var(--transition);
        }

        /* ----- DESKTOP LAYOUT ----- */
        .app-dashboard {
            display: flex;
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        /* Sidebar: 25% width */
        .sidebar {
            width: 25%;
            max-width: 320px;
            min-width: 260px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1.8rem 1.5rem;
            transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1), background var(--transition);
            z-index: 100;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        
        .sidebar::-webkit-scrollbar {
            display: none;
            width: 0;
        }

        /* Main content 75% */
        .main-content {
            flex: 1;
            width: 75%;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        /* Content viewport */
        #contentViewport {
            flex: 1;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        
        #contentViewport::-webkit-scrollbar {
            display: none;
            width: 0;
        }
        
        .view-container {
            width: 100%;
            height: 100%;
            border: none;
            background: var(--bg-primary);
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        
        .view-container::-webkit-scrollbar {
            display: none;
        }
        
        iframe {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        
        iframe::-webkit-scrollbar {
            display: none;
        }

        .embed-view {
            padding: 2rem 2rem;
            overflow-y: auto;
            height: 100%;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        
        .embed-view::-webkit-scrollbar {
            display: none;
        }

        /* ----- DATETIME CARD ----- */
        .datetime-premium {
            background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-sidebar) 100%);
            border-radius: 28px;
            padding: 1rem 1.2rem;
            margin-bottom: 2rem;
            box-shadow: var(--card-shadow);
            border: var(--card-border);
            transition: transform 0.2s, box-shadow 0.2s;
            backdrop-filter: blur(2px);
        }

        .datetime-premium:hover {
            transform: translateY(-2px);
            box-shadow: 0 24px 38px -12px rgba(0, 0, 0, 0.15);
        }

        .time-greeting {
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--accent-primary);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .time-greeting i {
            font-size: 0.7rem;
        }

        .clock-large {
            font-size: 2rem;
            font-weight: 700;
            font-family: 'Inter', monospace;
            letter-spacing: -0.5px;
            color: var(--text-main);
            line-height: 1.2;
            display: flex;
            align-items: baseline;
            gap: 8px;
            flex-wrap: wrap;
        }

        .clock-large span {
            background: var(--accent-glow);
            padding: 0.1rem 0.2rem;
            border-radius: 12px;
        }

        .date-elegant {
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            border-top: 1px dashed var(--border-light);
            padding-top: 10px;
            flex-wrap: wrap;
        }

        .date-elegant i {
            color: var(--accent-primary);
            font-size: 0.9rem;
        }

        .day-badge {
            background: var(--gradient-accent);
            color: white;
            padding: 2px 10px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        /* Brand header */
        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.35rem;
            font-weight: 700;
            background: var(--gradient-accent);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 1.8rem;
        }

        .brand-logo i {
            background: none;
            color: var(--accent-primary);
            font-size: 1.7rem;
        }

        /* Navigation */
        .nav-menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            flex: 1;
            overflow-y: visible;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.85rem 1rem;
            border-radius: 16px;
            font-weight: 500;
            font-size: 0.9rem;
            background: transparent;
            border: none;
            width: 100%;
            text-align: left;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-item i {
            width: 24px;
            font-size: 1.2rem;
        }

        .nav-item:hover {
            background: var(--bg-primary);
            color: var(--accent-primary);
            transform: translateX(4px);
        }

        .nav-item.active {
            background: var(--gradient-accent);
            color: white;
            box-shadow: 0 6px 12px -6px rgba(37, 99, 235, 0.3);
        }

        /* Settings row */
        .settings-row {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 1.5rem;
            border: var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 550px;
            box-shadow: var(--card-shadow);
        }

        .switch-label strong {
            font-size: 1rem;
        }

        .switch {
            position: relative;
            width: 52px;
            height: 28px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background-color: #cbd5e1;
            transition: 0.2s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.2s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent-primary);
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        /* Mobile header */
        .mobile-header {
            display: none;
            background: var(--bg-sidebar);
            backdrop-filter: blur(8px);
            padding: 1rem 1.2rem;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-light);
            position: sticky;
            top: 0;
            z-index: 15;
        }

        .mobile-title-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .mobile-title-area i {
            font-size: 1.4rem;
            color: var(--accent-primary);
        }

        .mobile-title-area span {
            font-weight: 700;
            font-size: 1.25rem;
            letter-spacing: -0.3px;
        }

        .mobile-clock-compact {
            background: var(--bg-card);
            padding: 6px 12px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
            border: 1px solid var(--border-light);
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        .menu-toggle-btn {
            background: transparent;
            border: none;
            font-size: 1.5rem;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        /* Sidebar overlay */
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 98;
            opacity: 0;
            transition: opacity 0.3s;
        }

        /* ===== LOGOUT BUTTON ===== */
        .logout-btn {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.85rem 1rem;
            border-radius: 16px;
            font-weight: 500;
            font-size: 0.9rem;
            background: transparent;
            border: none;
            width: 100%;
            text-align: left;
            color: var(--danger);
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 1rem;
            border-top: 1px solid var(--border-light);
            padding-top: 1.2rem;
        }

        .logout-btn i {
            width: 24px;
            font-size: 1.2rem;
            color: var(--danger);
        }

        .logout-btn:hover {
            background: var(--danger-light);
            transform: translateX(4px);
        }

        /* Responsive */
        @media (max-width: 992px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                bottom: 0;
                width: 280px;
                transform: translateX(-100%);
                transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
                z-index: 200;
                box-shadow: 5px 0 25px rgba(0,0,0,0.2);
                border-right: none;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .sidebar-overlay.active {
                display: block;
                opacity: 1;
            }

            .main-content {
                width: 100%;
                flex: 1;
                height: 100%;
            }

            .mobile-header {
                display: flex;
            }
        }

        /* Welcome banner */
        .welcome-banner {
            background: var(--gradient-accent);
            border-radius: 24px;
            padding: 2rem;
            color: white;
            margin-bottom: 2rem;
            position: relative;
            overflow: hidden;
        }

        .welcome-banner::before {
            content: '🏫';
            position: absolute;
            right: -20px;
            bottom: -20px;
            font-size: 8rem;
            opacity: 0.1;
        }

        .welcome-banner h2 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .welcome-banner p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        /* Dashboard cards */
        .dashboard-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }
        
        .stat-card {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 1.5rem;
            border: var(--card-border);
            box-shadow: var(--card-shadow);
            transition: transform 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-4px);
        }

        .stat-card .icon {
            font-size: 2rem;
            color: var(--accent-primary);
            margin-bottom: 0.5rem;
        }

        .stat-card h3 {
            font-size: 2rem;
            font-weight: 700;
            margin: 0.5rem 0 0.25rem;
        }

        .stat-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Activity list */
        .activity-list {
            margin-top: 1rem;
        }

        .activity-item {
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .activity-item:last-child {
            border-bottom: none;
        }

        .activity-item i {
            color: var(--accent-primary);
            width: 20px;
        }

        footer, .footer {
            display: none;
        }
    </style>
</head>

    <script>
        // ================================================================
        // ⭐ ENHANCED SESSION MANAGEMENT (WITH REMEMBER ME)
        // ================================================================

        const SESSION_KEYS = {
            USER: 'Universal_user',
            USER_DATA: 'Universal_user_data',
            USER_TYPE: 'Universal_user_type',
            REMEMBER_ME: 'Universal_remember_me',
            SESSION_EXPIRY: 'Universal_session_expiry'
        };

        // ================================================================
        // SESSION MANAGEMENT FUNCTIONS
        // ================================================================

        function getSessionData(key) {
            // Check localStorage first (Remember Me)
            const localData = localStorage.getItem(key);
            if (localData) {
                try {
                    const parsed = JSON.parse(localData);
                    if (parsed.value && parsed.expiry && Date.now() < parsed.expiry) {
                        return parsed.value;
                    }
                    if (parsed.value !== undefined) return parsed.value;
                    return parsed;
                } catch (e) {
                    return localData;
                }
            }
            
            // Check sessionStorage
            const sessionData = sessionStorage.getItem(key);
            if (sessionData) {
                try {
                    return JSON.parse(sessionData);
                } catch (e) {
                    return sessionData;
                }
            }
            
            return null;
        }

        function isRememberMeActive() {
            const rememberMeData = localStorage.getItem(SESSION_KEYS.REMEMBER_ME);
            if (rememberMeData) {
                try {
                    const parsed = JSON.parse(rememberMeData);
                    return parsed.value === true && Date.now() < parsed.expiry;
                } catch(e) {
                    return false;
                }
            }
            return false;
        }

        function syncSessionFromRememberMe() {
            if (isRememberMeActive()) {
                const userData = getSessionData(SESSION_KEYS.USER_DATA);
                const userType = getSessionData(SESSION_KEYS.USER_TYPE);
                const user = getSessionData(SESSION_KEYS.USER);
                
                if (user && userData) {
                    sessionStorage.setItem(SESSION_KEYS.USER, JSON.stringify(user));
                    sessionStorage.setItem(SESSION_KEYS.USER_DATA, JSON.stringify(userData));
                    if (userType) {
                        sessionStorage.setItem(SESSION_KEYS.USER_TYPE, JSON.stringify(userType));
                    }
                    console.log('🔄 Synced admin session from Remember Me to sessionStorage');
                    return true;
                }
            }
            return false;
        }

        function getCurrentUser() {
            // Try to sync from Remember Me first
            syncSessionFromRememberMe();
            
            let user = getSessionData(SESSION_KEYS.USER);
            let userData = getSessionData(SESSION_KEYS.USER_DATA);
            let userType = getSessionData(SESSION_KEYS.USER_TYPE);
            
            // Fallback to direct access
            if (!user) {
                user = sessionStorage.getItem(SESSION_KEYS.USER) || localStorage.getItem(SESSION_KEYS.USER);
                if (user) {
                    try { user = JSON.parse(user); } catch(e) {}
                }
            }
            
            if (!userData) {
                userData = sessionStorage.getItem(SESSION_KEYS.USER_DATA) || localStorage.getItem(SESSION_KEYS.USER_DATA);
                if (userData) {
                    try { userData = JSON.parse(userData); } catch(e) {}
                }
            }
            
            if (!userType) {
                userType = sessionStorage.getItem(SESSION_KEYS.USER_TYPE) || localStorage.getItem(SESSION_KEYS.USER_TYPE);
                if (userType) {
                    try { userType = JSON.parse(userType); } catch(e) {}
                }
            }
            
            if (!user || !userData) {
                return null;
            }

            try {
                if (typeof userData === 'string') {
                    userData = JSON.parse(userData);
                }
                
                const firstName = userData['First Name'] || userData['User Name'] || '';
                const lastName = userData['Last Name'] || '';
                const fullName = `${firstName} ${lastName}`.trim() || (userData['User Name'] || 'Admin');
                const email = userData['Email Id'] || user;
                
                return {
                    username: user,
                    email: email,
                    data: userData,
                    type: userType || 'admin',
                    fullName: fullName
                };
            } catch (e) {
                console.error('Error parsing user data:', e);
                return null;
            }
        }

        // ================================================================
        // ⭐ ADMIN AUTHENTICATION CHECK (ENHANCED)
        // ================================================================

        function checkAdminAuth() {
            // Try to sync from Remember Me first
            syncSessionFromRememberMe();
            
            const user = getCurrentUser();
            
            // Check if user exists and is admin
            if (!user || user.type !== 'admin') {
                console.warn('⚠️ Admin authentication failed, redirecting to login');
                // Try to redirect to myaccount.html from various possible paths
                const redirectPath = '../Study Material/My Account/myaccount.html';
                window.location.href = redirectPath;
                return false;
            }
            
            console.log(`✅ Admin authenticated: ${user.fullName} (${user.email})`);
            
            // Check if Remember Me is active
            const isRememberMe = isRememberMeActive();
            console.log(`📌 Session source: ${isRememberMe ? 'Remember Me (10 days)' : 'Session'}`);
            
            // Store user globally for use in other functions
            window._currentAdmin = user;
            
            return true;
        }

        // ================================================================
        // THEME MANAGEMENT - Unified with myaccount.html
        // ================================================================
        const THEME_KEY = 'user-theme-preference';

        function getStoredTheme() {
            return localStorage.getItem(THEME_KEY) || 'dark';
        }

        function applyThemeToDocument(theme) {
            document.body.setAttribute('data-theme', theme);
            localStorage.setItem(THEME_KEY, theme);
            
            // Notify other tabs
            try {
                localStorage.setItem('theme-change-trigger', Date.now().toString());
            } catch(e) {}
            
            // Notify iframes
            document.querySelectorAll('iframe').forEach(iframe => {
                try {
                    iframe.contentWindow.postMessage({
                        type: 'themeChange',
                        theme: theme
                    }, '*');
                } catch(e) { /* Cross-origin iframe */ }
            });
            
            // Notify parent window (if in iframe)
            try {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({
                        type: 'themeChange',
                        theme: theme
                    }, '*');
                }
            } catch(e) {}
        }

        function toggleTheme() {
            const current = document.body.getAttribute('data-theme') || 'dark';
            const newTheme = current === 'dark' ? 'light' : 'dark';
            applyThemeToDocument(newTheme);
            
            // Update toggle checkbox if it exists
            const toggle = document.getElementById('globalThemeToggle');
            if (toggle) toggle.checked = newTheme === 'dark';
        }

        function initTheme() {
            const stored = localStorage.getItem(THEME_KEY);
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = stored || (systemPrefersDark ? 'dark' : 'light');
            applyThemeToDocument(theme);
        }

        // ================================================================
        // LISTEN FOR THEME CHANGES FROM OTHER TABS/IFRAMES
        // ================================================================
        window.addEventListener('storage', function(e) {
            if (e.key === THEME_KEY && e.newValue) {
                document.body.setAttribute('data-theme', e.newValue);
            }
            if (e.key === 'theme-change-trigger') {
                const currentTheme = localStorage.getItem(THEME_KEY);
                if (currentTheme) {
                    document.body.setAttribute('data-theme', currentTheme);
                }
            }
        });

        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'themeChange') {
                const newTheme = event.data.theme;
                if (newTheme && newTheme !== document.body.getAttribute('data-theme')) {
                    applyThemeToDocument(newTheme);
                    const toggle = document.getElementById('globalThemeToggle');
                    if (toggle) toggle.checked = newTheme === 'dark';
                }
            }
        });

        // ================================================================
        // REAL-TIME CLOCK
        // ================================================================
        function updateDateTimePremium() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const seconds = now.getSeconds().toString().padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            const timeString12hr = `${hours.toString()}:${minutes}:${seconds} ${ampm}`;
            
            const optionsDate = { weekday: 'short', year: 'numeric', month: 'long', day: 'numeric' };
            const fullDateStr = now.toLocaleDateString(undefined, optionsDate);
            const dayName = now.toLocaleDateString(undefined, { weekday: 'long' });
            
            const clockDisplayElem = document.getElementById('dynamicClockDisplay');
            const dateTextElem = document.getElementById('dateText');
            const dayBadgeElem = document.getElementById('dayBadge');
            if (clockDisplayElem) clockDisplayElem.innerHTML = `<span>${timeString12hr}</span>`;
            if (dateTextElem) dateTextElem.textContent = fullDateStr;
            if (dayBadgeElem) dayBadgeElem.textContent = dayName;
            
            const mobileTimeSpan = document.getElementById('mobileTimeHeader');
            if (mobileTimeSpan) {
                const mobileTime = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                mobileTimeSpan.textContent = mobileTime;
            }
        }

        // ================================================================
        // VIEW LOADER
        // ================================================================
        const VIEWS_CONFIG = {
            'dashboard': { 
                type: 'html', 
                content: `
                <div class="embed-view">
                    <div style="background: var(--bg-card); border-radius: 32px; padding: 2rem; border: var(--card-border); box-shadow: var(--card-shadow);">
                        <div class="welcome-banner">
                            <h2>Welcome to Universal English Medium School</h2>
                            <p>Manage your school operations efficiently with our comprehensive management system.</p>
                        </div>
                        
                        <div class="dashboard-cards">
                            <div class="stat-card">
                                <div class="icon"><i class="fa-solid fa-user-graduate"></i></div>
                                <h3>156</h3>
                                <p>Total Students</p>
                            </div>
                            <div class="stat-card">
                                <div class="icon"><i class="fa-solid fa-chalkboard-user"></i></div>
                                <h3>24</h3>
                                <p>Teachers</p>
                            </div>
                            <div class="stat-card">
                                <div class="icon"><i class="fa-solid fa-coins"></i></div>
                                <h3>₹2.4L</h3>
                                <p>Fees Collected</p>
                            </div>
                            <div class="stat-card">
                                <div class="icon"><i class="fa-solid fa-clipboard-check"></i></div>
                                <h3>92%</h3>
                                <p>Attendance Rate</p>
                            </div>
                        </div>

                        <div style="margin-top: 2rem; background: var(--bg-primary); border-radius: 24px; padding: 1.5rem;">
                            <h4><i class="fa-regular fa-bell"></i> Recent Activity</h4>
                            <div class="activity-list">
                                <div class="activity-item">
                                    <i class="fa-solid fa-user-plus"></i>
                                    <span>New admission: Aarav Sharma (Class 5-A)</span>
                                </div>
                                <div class="activity-item">
                                    <i class="fa-solid fa-coins"></i>
                                    <span>Fee payment received: ₹15,000 from 12 students</span>
                                </div>
                                <div class="activity-item">
                                    <i class="fa-solid fa-clipboard-check"></i>
                                    <span>Attendance marked for today: 89% present</span>
                                </div>
                                <div class="activity-item">
                                    <i class="fa-solid fa-user-plus"></i>
                                    <span>New teacher joined: Ms. Priya Patel (Mathematics)</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`
            },
            'admission': { type: 'iframe', src: 'Admission/Admdashboard.html' },
            'fees': { type: 'iframe', src: 'Fees/feesDashboard.html' },
            'teacher-staff': { type: 'iframe', src: 'Teachers Staff/Staffdashboard.html' },
            'attendance': { type: 'iframe', src: 'Attendance/AttenDashboard.html' },
            'exam': { type: 'iframe', src: 'Examination/ExamDashboard.html' },
            'analytical': { type: 'iframe', src: 'Report/Analysis.html' },
            'settings': { 
                type: 'html', 
                content: `
                <div class="embed-view">
                    <div style="max-width: 700px;">
                        <h2 style="margin-top:0;"><i class="fa-solid fa-sliders-h"></i> Preferences & Configuration</h2>
                        <p style="color: var(--text-muted); margin-bottom: 2rem;">Manage your application settings and preferences.</p>
                        
                        <div class="settings-row">
                            <div class="switch-label">
                                <strong>Dark Mode Interface</strong>
                                <span style="font-size: 0.75rem; color: var(--text-muted); display: block;">Toggle between light & dark themes</span>
                            </div>
                            <label class="switch">
                                <input type="checkbox" id="globalThemeToggle" ${document.body.getAttribute('data-theme') === 'dark' ? 'checked' : ''}>
                                <span class="slider"></span>
                            </label>
                        </div>

                        <div style="margin-top: 2rem; background: var(--bg-card); border-radius: 24px; padding: 1.5rem; border: var(--card-border);">
                            <h4><i class="fa-solid fa-circle-info"></i> System Information</h4>
                            <p style="margin-top: 0.5rem;">Version 2.0 • Universal English Medium School Management System</p>
                            <p style="margin-top: 0.5rem;">© 2026 Universal English Medium School. All rights reserved.</p>
                        </div>
                    </div>
                </div>`
            }
        };

        function loadView(viewKey) {
            if (!VIEWS_CONFIG[viewKey]) return;
            
            const config = VIEWS_CONFIG[viewKey];
            const viewport = document.getElementById('contentViewport');
            
            // Update active nav
            document.querySelectorAll('.nav-item').forEach(btn => {
                btn.classList.remove('active');
                if (btn.getAttribute('data-view') === viewKey) {
                    btn.classList.add('active');
                }
            });
            
            // Render content
            if (config.type === 'iframe') {
                viewport.innerHTML = `<iframe class="view-container" src="${config.src}" title="Universal English Medium School Module"></iframe>`;
                // Apply theme to iframe when loaded
                const iframeElem = viewport.querySelector('iframe');
                if (iframeElem) {
                    iframeElem.addEventListener('load', function() {
                        try {
                            const theme = document.body.getAttribute('data-theme') || 'dark';
                            this.contentWindow.postMessage({
                                type: 'themeChange',
                                theme: theme
                            }, '*');
                        } catch(e) { /* Cross-origin */ }
                    });
                }
            } else {
                viewport.innerHTML = config.content;
                
                // Handle theme toggle in settings
                if (viewKey === 'settings') {
                    const themeToggle = document.getElementById('globalThemeToggle');
                    if (themeToggle) {
                        themeToggle.addEventListener('change', (e) => {
                            const theme = e.target.checked ? 'dark' : 'light';
                            applyThemeToDocument(theme);
                            // Update toggle in any iframes
                            document.querySelectorAll('iframe').forEach(iframe => {
                                try {
                                    iframe.contentWindow.postMessage({
                                        type: 'themeChange',
                                        theme: theme
                                    }, '*');
                                } catch(e) {}
                            });
                        });
                    }
                }
            }
            
            // Close mobile sidebar
            if (window.innerWidth <= 992) {
                closeMobileSidebar();
            }
        }

        // ================================================================
        // MOBILE SIDEBAR
        // ================================================================
        function openMobileSidebar() {
            document.getElementById('sidebar').classList.add('open');
            document.getElementById('sidebarOverlay').classList.add('active');
        }

        function closeMobileSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('active');
        }

        // ================================================================
        // SWIPE GESTURES
        // ================================================================
        function initSwipeGestures() {
            let touchStart = 0;
            const container = document.getElementById('appRoot');
            if (!container) return;
            
            container.addEventListener('touchstart', (e) => {
                touchStart = e.changedTouches[0].screenX;
            }, { passive: true });
            
            container.addEventListener('touchend', (e) => {
                const touchEnd = e.changedTouches[0].screenX;
                const diff = touchEnd - touchStart;
                const isMobile = window.innerWidth <= 992;
                if (!isMobile) return;
                if (diff > 70 && touchStart < 45) {
                    openMobileSidebar();
                } else if (diff < -70 && document.getElementById('sidebar').classList.contains('open')) {
                    closeMobileSidebar();
                }
            });
        }

        // ================================================================
        // ⭐ LOGOUT (CLEARS REMEMBER ME TOO)
        // ================================================================
        function logout() {
            // Clear all session data (both localStorage and sessionStorage)
            Object.values(SESSION_KEYS).forEach(key => {
                localStorage.removeItem(key);
                sessionStorage.removeItem(key);
            });
            
            // Redirect to myaccount.html
            window.location.href = '../Study Material/My Account/myaccount.html';
        }

        // ================================================================
        // NAVIGATION
        // ================================================================
        function bindNavEvents() {
            const navBtns = document.querySelectorAll('.nav-item');
            navBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    const view = this.getAttribute('data-view');
                    if (view) loadView(view);
                });
            });
        }

        // ================================================================
        // ⭐ INITIALIZE APP (ENHANCED)
        // ================================================================
        function initializeApp() {
            // 1. ⭐ Check admin authentication with Remember Me support
            const isAuthorized = checkAdminAuth();
            if (!isAuthorized) return; // Redirect happens inside checkAdminAuth
            
            // 2. Initialize theme
            initTheme();
            
            // 3. Bind navigation events
            bindNavEvents();
            
            // 4. Load default view
            loadView('dashboard');
            
            // 5. Start clock
            updateDateTimePremium();
            setInterval(updateDateTimePremium, 1000);
            
            // 6. Mobile menu
            document.getElementById('menuOpenBtn').addEventListener('click', openMobileSidebar);
            document.getElementById('sidebarOverlay').addEventListener('click', closeMobileSidebar);
            
            // 7. ⭐ Logout button
            document.getElementById('logoutBtn').addEventListener('click', logout);
            
            // 8. Responsive cleanup
            window.addEventListener('resize', () => {
                if (window.innerWidth > 992) closeMobileSidebar();
            });
            
            // 9. Swipe gestures
            initSwipeGestures();
            
            // 10. Listen for theme changes from parent
            window.addEventListener('message', function(event) {
                if (event.data && event.data.type === 'themeChange') {
                    const newTheme = event.data.theme;
                    if (newTheme) {
                        applyThemeToDocument(newTheme);
                        const toggle = document.getElementById('globalThemeToggle');
                        if (toggle) toggle.checked = newTheme === 'dark';
                    }
                }
            });
            
            console.log('✅ Dashboard initialized with Remember Me support');
            console.log(`👤 Admin: ${window._currentAdmin?.fullName}`);
            console.log(`🔐 Remember Me: ${isRememberMeActive() ? 'Active (10 days)' : 'Inactive'}`);
        }

        // ================================================================
        // START
        // ================================================================
        document.addEventListener('DOMContentLoaded', initializeApp);
    </script>
</body>
