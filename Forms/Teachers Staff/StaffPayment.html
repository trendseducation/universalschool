<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>💰 Staff Payment Portal | Smart Dashboard</title>

    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- ⭐ loginadmin.js - Handles authentication -->
    <script src="../../Script/loginadmin.js" data-auto-init="true"></script>

    <style>
        /* ================================================================
           CSS VARIABLES - Light & Dark Mode
           ================================================================ */
        :root {
            --bg-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --bg-secondary: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.98);
            --text-main: #1e293b;
            --text-secondary: #64748b;
            --text-light: #94a3b8;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1);

            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --primary-light: #60a5fa;
            --secondary: #f59e0b;
            --secondary-dark: #d97706;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #fbbf24;
            --info: #06b6d4;

            --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-secondary: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --gradient-success: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --gradient-warning: linear-gradient(135deg, #fa709a 0%, #fee140 100%);

            --table-header-bg: #f8fafc;
            --table-row-hover: #f1f5f9;
            --table-border: #e2e8f0;

            --transition-fast: 150ms ease;
            --transition-normal: 300ms ease;
            --transition-slow: 500ms ease;

            --admin-gold: #f59e0b;
            --admin-badge-bg: rgba(245, 158, 11, 0.15);
        }

        [data-theme="dark"] {
            --bg-primary: linear-gradient(135deg, #1e1e2e 0%, #2d1b4e 100%);
            --bg-secondary: #1e1e2e;
            --card-bg: rgba(30, 30, 46, 0.98);
            --text-main: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-light: #64748b;
            --border-color: #334155;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.3);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.4);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.4);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.4);

            --table-header-bg: #1e293b;
            --table-row-hover: #334155;
            --table-border: #334155;

            --admin-badge-bg: rgba(245, 158, 11, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            padding: 20px 16px;
            color: var(--text-main);
            transition: background var(--transition-normal), color var(--transition-normal);
            position: relative;
        }

        /* ================================================================
           LOADING OVERLAY (Admin Auth)
           ================================================================ */
        #authLoading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-secondary);
            z-index: 9999;
            flex-direction: column;
            gap: 1.5rem;
            transition: background var(--transition-normal);
        }
        #authLoading.hidden { display: none !important; }
        #authLoading .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--border-color);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        #authLoading p {
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.9rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ================================================================
           MAIN CONTENT
           ================================================================ */
        #mainContent { display: none; }
        #mainContent.visible {
            display: block;
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            animation: fadeIn 0.5s ease-out;
        }

        .page {
            display: none;
            animation: fadeSlide 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .page.active-page { display: block; }
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .soft-card {
            background: var(--card-bg);
            border-radius: 2rem;
            box-shadow: var(--shadow-xl);
            overflow: hidden;
            backdrop-filter: blur(10px);
            transition: transform var(--transition-normal), box-shadow var(--transition-normal);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 24px;
        }
        .soft-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-xl);
        }

        /* ================================================================
           HEADERS
           ================================================================ */
        .card-header {
            padding: 1.5rem 2rem;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 100%);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: nowrap;
            gap: 14px;
        }
        [data-theme="dark"] .card-header {
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.02) 100%);
        }
        .card-header h2 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.02em;
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-header .btn { flex-shrink: 0; }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* Admin badge + My Account */
        .admin-badge {
            display: none;
            align-items: center;
            gap: 6px;
            background: var(--admin-badge-bg);
            color: var(--admin-gold);
            padding: 5px 12px;
            border-radius: 30px;
            font-size: 0.68rem;
            font-weight: 700;
            border: 1px solid var(--admin-gold);
            white-space: nowrap;
        }
        .admin-badge.visible { display: inline-flex; }
        .admin-badge i { font-size: 0.68rem; }
        .admin-badge .session-pill {
            font-size: 0.52rem;
            padding: 1px 6px;
            border-radius: 20px;
            background: rgba(255,255,255,0.15);
            margin-left: 2px;
        }
        .btn-my-account {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(59, 130, 246, 0.1);
            color: var(--primary);
            padding: 5px 11px;
            border-radius: 30px;
            font-size: 0.65rem;
            font-weight: 700;
            text-decoration: none;
            border: 1px solid var(--border-color);
            transition: all var(--transition-fast);
            white-space: nowrap;
        }
        .btn-my-account:hover {
            background: var(--primary);
            color: #fff;
            transform: translateY(-1px);
        }

        /* ================================================================
           SEARCH
           ================================================================ */
        .search-section {
            padding: 1.5rem 2rem;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }
        .search-wrapper { width: 100%; }
        .search-wrapper input {
            width: 100%;
            padding: 14px 20px;
            border: 2px solid var(--border-color);
            border-radius: 60px;
            background: var(--bg-secondary);
            color: var(--text-main);
            font-size: 0.95rem;
            font-family: inherit;
            transition: all var(--transition-fast);
            box-shadow: var(--shadow-sm);
        }
        .search-wrapper input::placeholder { color: var(--text-light); }
        .search-wrapper input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
            transform: translateY(-1px);
        }

        /* ================================================================
           BUTTONS
           ================================================================ */
        .btn {
            border: none;
            padding: 10px 24px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }
        .btn::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 0; height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        .btn:active::before { width: 300px; height: 300px; }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: var(--shadow-sm);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            filter: brightness(1.05);
        }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }
        .btn-outline:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
        }
        .btn-danger {
            background: linear-gradient(135deg, var(--danger), #dc2626);
            color: white;
        }
        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        .btn-success {
            background: linear-gradient(135deg, var(--success), #059669);
            color: white;
        }
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        .btn-sm { padding: 6px 16px; font-size: 0.75rem; }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* ================================================================
           TABLE
           ================================================================ */
        .table-wrapper {
            overflow-x: auto;
            overflow-y: visible;
            scrollbar-width: thin;
            padding: 0;
        }
        .table-wrapper::-webkit-scrollbar { height: 6px; background: transparent; }
        .table-wrapper::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }
        .data-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 0.875rem;
        }
        .data-table th {
            text-align: left;
            padding: 16px 20px;
            background: var(--table-header-bg);
            color: var(--primary);
            font-weight: 800;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            border-bottom: 3px solid var(--primary);
        }
        .data-table th:first-child { border-top-left-radius: 12px; }
        .data-table th:last-child { border-top-right-radius: 12px; }
        .data-table td {
            padding: 16px 20px;
            border-bottom: 1px solid var(--table-border);
            color: var(--text-main);
            transition: background var(--transition-fast);
            font-size: 0.9rem;
        }
        .data-table tr:hover td { background: var(--table-row-hover); }

        .view-action-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .view-action-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
            filter: brightness(1.05);
        }

        /* ================================================================
           DETAILS GRID
           ================================================================ */
        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
            padding: 2rem;
        }
        @media (max-width: 640px) {
            .details-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.75rem;
                padding: 1rem;
            }
        }
        .detail-card {
            background: linear-gradient(135deg, var(--card-bg), rgba(255,255,255,0.05));
            border-radius: 1.2rem;
            padding: 1rem 1.2rem;
            transition: all var(--transition-fast);
            border: 1px solid var(--border-color);
            cursor: pointer;
        }
        .detail-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary);
        }
        .detail-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--secondary);
            font-weight: 700;
        }
        .detail-value {
            font-weight: 700;
            font-size: 0.95rem;
            margin-top: 6px;
            color: var(--text-main);
            word-break: break-word;
        }
        .detail-card.fullwidth { grid-column: 1 / -1; }

        /* ================================================================
           ACTION ROW
           ================================================================ */
        .action-row {
            padding: 1rem 2rem 2rem;
            display: flex;
            gap: 14px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        /* ================================================================
           MODALS
           ================================================================ */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            visibility: hidden;
            opacity: 0;
            transition: all var(--transition-normal);
        }
        .modal-overlay.active {
            display: flex;
            visibility: visible;
            opacity: 1;
        }
        .modal-box {
            background: var(--card-bg);
            width: 92%;
            max-width: 500px;
            max-height: 85vh;
            border-radius: 2rem;
            overflow-y: auto;
            box-shadow: var(--shadow-xl);
            animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .modal-box-large { max-width: 700px; }
        @keyframes modalPop {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            padding: 1.2rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
            color: white;
        }
        .modal-header h3 { font-size: 1.3rem; font-weight: 700; }
        .close-modal {
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            color: white;
            transition: transform var(--transition-fast);
            line-height: 1;
        }
        .close-modal:hover { transform: rotate(90deg); }
        .modal-body {
            padding: 1.5rem;
            overflow-y: auto;
            max-height: calc(85vh - 70px);
        }

        /* ================================================================
           FORM
           ================================================================ */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.2rem;
        }
        .field { display: flex; flex-direction: column; gap: 6px; }
        .field label {
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--secondary);
        }
        .field input,
        .field select,
        .field textarea {
            padding: 12px 16px;
            border-radius: 16px;
            border: 2px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-main);
            font-size: 0.9rem;
            transition: all var(--transition-fast);
            font-family: inherit;
            width: 100%;
        }
        .field input:focus,
        .field select:focus,
        .field textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }
        .field input:disabled {
            background: var(--text-light);
            cursor: not-allowed;
            opacity: 0.6;
        }
        .field input[readonly] {
            background: var(--table-header-bg);
            cursor: default;
        }
        .fullwidth { grid-column: 1 / -1; }

        /* Spinner */
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        /* Status Message */
        .status-message {
            padding: 12px 20px;
            border-radius: 16px;
            margin-top: 20px;
            display: none;
            text-align: center;
            font-weight: 600;
        }
        .status-success { background: var(--success); color: white; }
        .status-error { background: var(--danger); color: white; }

        /* Mobile Buttons */
        .mobile-buttons {
            display: none;
            gap: 12px;
            margin-top: 12px;
            width: 100%;
        }
        .mobile-buttons .btn {
            width: 100%;
            justify-content: center;
            padding: 12px 16px;
            font-size: 0.85rem;
            border-radius: 60px;
        }
        .mobile-buttons .btn .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #ffffff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        .mobile-buttons .btn-outline .spinner {
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--primary);
        }
        .mobile-buttons .btn.loading {
            pointer-events: none;
            opacity: 0.8;
        }
        .mobile-buttons .btn.loading .spinner { display: inline-block; }
        .mobile-buttons .btn.loading .btn-text { display: none; }

        /* Alert Popup */
        .alert-popup {
            position: fixed;
            bottom: 100px;
            right: 30px;
            background: var(--card-bg);
            border-left: 5px solid var(--primary);
            padding: 16px 24px;
            box-shadow: var(--shadow-xl);
            border-radius: 0 16px 16px 0;
            font-weight: 600;
            font-size: 0.95rem;
            z-index: 1000;
            display: none;
            animation: slideIn 0.3s ease-out;
            color: var(--text-main);
            max-width: 400px;
        }
        @keyframes slideIn {
            from { transform: translateX(120%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .alert-popup.success { border-left-color: var(--success); }
        .alert-popup.error { border-left-color: var(--danger); }
        .alert-popup.info { border-left-color: var(--info); }

        /* Staff Search Modal */
        .staff-list-item {
            padding: 12px 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }
        .staff-list-item:hover {
            background: var(--table-row-hover);
            transform: translateX(4px);
        }
        .staff-list-item .name {
            font-weight: 600;
            color: var(--text-main);
        }
        .staff-list-item .icon {
            color: var(--text-light);
            font-size: 0.8rem;
        }
        .modal-search-input {
            width: 100%;
            padding: 12px 16px 12px 40px;
            border: 2px solid var(--border-color);
            border-radius: 60px;
            background: var(--bg-secondary);
            color: var(--text-main);
            font-size: 0.9rem;
            transition: all var(--transition-fast);
        }
        .modal-search-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }
        .search-icon-wrapper { position: relative; }
        .search-icon-wrapper .icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
        }

        /* Transaction Method */
        .method-upi { border-color: #6366f1 !important; }
        .method-upi:focus {
            border-color: #6366f1 !important;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1) !important;
        }
        .method-bank { border-color: #10b981 !important; }
        .method-bank:focus {
            border-color: #10b981 !important;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1) !important;
        }
        .transaction-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .transaction-badge.cash { background: #f59e0b; color: white; }
        .transaction-badge.upi { background: #6366f1; color: white; }
        .transaction-badge.bank { background: #10b981; color: white; }

        .amount-display {
            font-weight: 700;
            color: var(--success);
        }
        .amount-display.negative { color: var(--danger); }

        .modal-spinner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            color: var(--text-light);
            gap: 12px;
        }
        .modal-spinner .spinner {
            width: 30px;
            height: 30px;
            border-width: 4px;
        }
        .modal-spinner span {
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* ================================================================
           RESPONSIVE
           ================================================================ */
        @media (max-width: 768px) {
            body { padding: 12px; }

            .card-header {
                padding: 0.8rem 1rem;
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            .card-header h2 {
                font-size: 1rem;
                width: 100%;
                white-space: normal;
            }
            .header-actions { width: 100%; justify-content: flex-start; }
            .admin-badge { font-size: 0.58rem; padding: 3px 9px; }
            .btn-my-account { font-size: 0.58rem; padding: 3px 9px; }
            .desktop-buttons { display: none !important; }
            .mobile-buttons {

<script>
/* =====================================================================
   StaffPayment.html — Enhanced Script
   ---------------------------------------------------------------------
   ✅ Unified Admin Auth (reads myaccount.html session keys)
   ✅ Session expiry check (10-day Remember Me)
   ✅ Failsafe redirect to myaccount.html
   ✅ Admin badge + My Account link
   ✅ Theme sync (storage + postMessage, no polling)
   ✅ init() runs only AFTER auth passes
   ✅ All original payment CRUD logic preserved
   ===================================================================== */


/* =====================================================================
   SECTION 1 — ADMIN AUTHENTICATION GUARD
   ===================================================================== */

function readMyAccountSession(key) {
    try {
        const rawLocal = localStorage.getItem(key);
        if (rawLocal) {
            const parsed = JSON.parse(rawLocal);
            if (parsed && typeof parsed === 'object' && 'value' in parsed) {
                if (parsed.expiry && Date.now() >= parsed.expiry) {
                    localStorage.removeItem(key);
                    return null;
                }
                return parsed.value;
            }
            return parsed;
        }
    } catch (e) {}
    try {
        const rawSession = sessionStorage.getItem(key);
        if (rawSession) return JSON.parse(rawSession);
    } catch (e) {}
    return null;
}

function checkAdminAuth() {
    const userType = readMyAccountSession('Universal_user_type');
    const user     = readMyAccountSession('Universal_user');
    const expiry   = readMyAccountSession('Universal_session_expiry');

    if (!userType || !user) return { ok: false, reason: 'no-session' };
    if (userType !== 'admin') return { ok: false, reason: 'not-admin', userType };
    if (expiry && typeof expiry === 'number' && Date.now() >= expiry) {
        ['Universal_user','Universal_user_data','Universal_user_type',
         'Universal_remember_me','Universal_session_expiry'].forEach(k => {
            localStorage.removeItem(k);
            sessionStorage.removeItem(k);
        });
        return { ok: false, reason: 'expired' };
    }
    return { ok: true, userType, user };
}

function redirectToMyAccount(reason) {
    console.warn('🔒 Admin auth failed:', reason);
    try {
        if (window.top && window.top !== window) {
            window.top.location.href = '../../Forms/MyAccount/myaccount.html';
        } else {
            window.location.href = '../../Forms/MyAccount/myaccount.html';
        }
    } catch (e) {
        window.location.href = '../../Forms/MyAccount/myaccount.html';
    }
}

function updateAdminBadge() {
    const userData = readMyAccountSession('Universal_user_data');
    const user = readMyAccountSession('Universal_user');
    const expiry = readMyAccountSession('Universal_session_expiry');

    const badge = document.getElementById('adminBadge');
    const nameDisplay = document.getElementById('adminNameDisplay');
    const indicator = document.getElementById('sessionIndicator');

    let displayName = 'Admin';
    if (userData) {
        if (userData['User Name']) displayName = userData['User Name'];
        else if (userData['Full Name']) displayName = userData['Full Name'];
        else if (userData['First Name']) {
            displayName = (userData['First Name'] + ' ' + (userData['Last Name'] || '')).trim();
        }
    } else if (user) {
        displayName = user;
    }

    if (nameDisplay) nameDisplay.textContent = displayName;
    if (badge) badge.classList.add('visible');

    if (indicator) {
        const isRememberMe = !!expiry && (expiry - Date.now()) > 60000;
        if (isRememberMe) {
            const remaining = expiry - Date.now();
            const days = Math.floor(remaining / (24 * 60 * 60 * 1000));
            const hours = Math.floor((remaining % (24 * 60 * 60 * 1000)) / (60 * 60 * 1000));
            indicator.textContent = days > 0 ? `🔒 ${days}d ${hours}h` : `🔒 ${hours}h`;
            indicator.style.background = 'rgba(16,185,129,0.3)';
            indicator.style.color = '#34d399';
        } else {
            indicator.textContent = 'Session';
            indicator.style.background = 'rgba(255,255,255,0.15)';
            indicator.style.color = '';
        }
    }
}

function revealMainContent() {
    const main = document.getElementById('mainContent');
    const loading = document.getElementById('authLoading');
    if (loading) loading.classList.add('hidden');
    if (main) {
        main.style.display = 'block';
        main.classList.add('visible');
    }
}

function gateAdminAccess(onAuthorized) {
    const mainEl = document.getElementById('mainContent');
    const loadingEl = document.getElementById('authLoading');
    const alreadyRevealed = mainEl &&
        (mainEl.style.display === 'block' || mainEl.classList.contains('visible'));
    const loadingHidden = loadingEl && loadingEl.classList.contains('hidden');

    if (alreadyRevealed || loadingHidden) {
        console.log('✅ loginadmin.js already authorized this session');
        onAuthorized();
        return;
    }

    const auth = checkAdminAuth();
    if (auth.ok) {
        console.log('✅ Admin auth verified via session keys:', auth.user);
        revealMainContent();
        onAuthorized();
    } else {
        showAccessDeniedAndRedirect(auth.reason);
    }
}

function showAccessDeniedAndRedirect(reason) {
    const loadingEl = document.getElementById('authLoading');
    if (loadingEl) {
        loadingEl.innerHTML = `
            <div style="text-align:center; padding: 2rem;">
                <div style="font-size: 3rem; color: #ef4444; margin-bottom: 1rem;">🔒</div>
                <h2 style="color: inherit; margin-bottom: 0.5rem;">Admin Access Required</h2>
                <p style="color: inherit; opacity: 0.7; font-size: 0.9rem; margin-bottom: 1.5rem;">
                    ${reason === 'not-admin'
                        ? 'You are logged in as a student. Please login as admin.'
                        : reason === 'expired'
                        ? 'Your session has expired. Please login again.'
                        : 'Please login as admin to access this page.'}
                </p>
                <div class="spinner" style="margin: 0 auto;"></div>
                <p style="opacity: 0.6; font-size: 0.8rem; margin-top: 1rem;">
                    Redirecting to My Account...
                </p>
            </div>
        `;
    }
    setTimeout(() => redirectToMyAccount(reason), 1500);
}


/* =====================================================================
   SECTION 2 — DARK MODE SYNC (no polling)
   ===================================================================== */

function syncThemeWithParent() {
    const localTheme = localStorage.getItem('user-theme-preference');
    if (localTheme) {
        document.body.setAttribute('data-theme', localTheme);
        document.documentElement.setAttribute('data-theme', localTheme);
    } else {
        try {
            if (window.parent && window.parent.document.body) {
                const parentTheme = window.parent.document.body.getAttribute('data-theme');
                if (parentTheme) {
                    document.body.setAttribute('data-theme', parentTheme);
                    document.documentElement.setAttribute('data-theme', parentTheme);
                }
            }
        } catch(e) { }
    }
}
window.addEventListener('DOMContentLoaded', syncThemeWithParent);
window.addEventListener('storage', function(e) {
    if (e.key === 'user-theme-preference') syncThemeWithParent();
    if (e.key && e.key.startsWith('Universal_')) updateAdminBadge();
});
window.addEventListener('message', function(event) {
    if (event.data && event.data.type === 'themeChange') {
        const newTheme = event.data.theme;
        if (newTheme) {
            document.body.setAttribute('data-theme', newTheme);
            document.documentElement.setAttribute('data-theme', newTheme);
        }
    }
});


/* =====================================================================
   SECTION 3 — CONFIGURATION
   ===================================================================== */

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwzEbd10tAnSKJSsg01LOXr8MAgKTFO4cp2sjq9moatjN3_IWZ8ZWF9uViTXE-991Nq/exec";
const SPREADSHEET_ID = "19D6rg5Co3665dPIFurTHEs3EV2mwRdfgmauX4VNixr4";
const STAFF_SHEET = "Staff Details";
const PAYMENT_SHEET = "Staff Payment";

const CACHE_KEY = "payment_cache";
const STAFF_CACHE_KEY = "staff_registry_cache";
const CACHE_TTL = 15 * 60 * 1000;


/* =====================================================================
   SECTION 4 — GLOBAL STATE
   ===================================================================== */

let allPayments = [];
let staffRegistry = [];
let currentViewPayment = null;
let selectedRowIndex = 2;
let selectedSrNo = null;
let searchDebounceTimer = null;
let saveInProgress = false;
let computedNextPaymentSrNo = 1;
let isDataLoaded = false;
let isStaffLoaded = false;
let formHtmlCacheData = null;
let initDone = false;


/* =====================================================================
   SECTION 5 — DOM REFS
   ===================================================================== */

const dom = {};

function cacheDomElements() {
    dom.page1 = document.getElementById('page1');
    dom.page2 = document.getElementById('page2');
    dom.tableBody = document.getElementById('tableBody');
    dom.searchInput = document.getElementById('searchInput');
    dom.refreshBtn = document.getElementById('refreshBtn');
    dom.addNewBtn = document.getElementById('addNewBtn');
    dom.backBtn = document.getElementById('backToPage1Btn');
    dom.editBtn = document.getElementById('editFromDetailBtn');
    dom.deleteBtn = document.getElementById('deleteFromDetailBtn');
    dom.detailsContainer = document.getElementById('detailsContainer');
    dom.globalModal = document.getElementById('globalModal');
    dom.formModal = document.getElementById('formModal');
    dom.staffSearchModal = document.getElementById('staffSearchModal');
    dom.modalTitle = document.getElementById('modalTitle');
    dom.modalMsg = document.getElementById('modalMsg');
    dom.formModalTitle = document.getElementById('formModalTitle');
    dom.formModalBody = document.getElementById('formModalBody');
    dom.staffListContainer = document.getElementById('staffListContainer');
    dom.staffSearchInput = document.getElementById('staffSearchInput');
    dom.alertBox = document.getElementById('alertBox');
}


/* =====================================================================
   SECTION 6 — UTILITIES
   ===================================================================== */

function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
}

function formatDateForDisplay(dateStr) {
    if (!dateStr) return '—';
    try {
        if (/^\d{2}\/\d{2}\/\d{4}$/.test(dateStr)) return dateStr;
        if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) {
            const [year, month, day] = dateStr.split('-');
            return `${day}/${month}/${year}`;
        }
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return '—';
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${day}/${month}/${year}`;
    } catch { return '—'; }
}

function formatDateForInput(dateStr) {
    if (!dateStr) return '';
    try {
        if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return dateStr;
        if (/^\d{2}\/\d{2}\/\d{4}$/.test(dateStr)) {
            const [day, month, year] = dateStr.split('/');
            return `${year}-${month}-${day}`;
        }
        return '';
    } catch { return ''; }
}

function getTodayDate() {
    const today = new Date();
    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, '0');
    const day = String(today.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
}

function showToast(msg, type = 'info') {
    const box = dom.alertBox;
    if (!box) return;
    box.textContent = msg;
    box.className = `alert-popup ${type}`;
    box.style.display = 'block';
    clearTimeout(box._timeout);
    box._timeout = setTimeout(() => { box.style.display = 'none'; }, 4500);
}

function showModal(msg, title = "Message", isConfirm = false, onConfirm = null) {
    dom.modalTitle.innerText = title;
    dom.modalMsg.innerHTML = msg;
    const confirmBtn = document.getElementById('confirmModalBtn');
    confirmBtn.onclick = () => {
        dom.globalModal.classList.remove('active');
        if (isConfirm && onConfirm) onConfirm();
    };
    dom.globalModal.classList.add('active');
}

function showSpinner(element, show) {
    if (!element) return;
    if (show) {
        element.disabled = true;
        const originalText = element.innerHTML;
        element.setAttribute('data-original-text', originalText);
        element.innerHTML = '<span class="spinner"></span> Loading...';
    } else {
        element.disabled = false;
        const original = element.getAttribute('data-original-text');
        if (original) element.innerHTML = original;
    }
}


/* =====================================================================
   SECTION 7 — DATA MANAGEMENT
   ===================================================================== */

function getCache(key) {
    try {
        const cached = sessionStorage.getItem(key);
        if (cached) {
            const { data, timestamp } = JSON.parse(cached);
            if (Date.now() - timestamp < CACHE_TTL) return data;
        }
    } catch { }
    return null;
}

function setCache(key, data) {
    try {
        sessionStorage.setItem(key, JSON.stringify({ data, timestamp: Date.now() }));
    } catch { }
}

async function loadPayments(forceRefresh = false) {
    if (!forceRefresh) {
        const cached = getCache(CACHE_KEY);
        if (cached) {
            allPayments = cached;
            isDataLoaded = true;
            renderTable();
            refreshDataInBackground();
            return allPayments;
        }
    }

    try {
        const response = await fetch(
            `${SCRIPT_URL}?spreadsheetId=${SPREADSHEET_ID}&sheetName=${encodeURIComponent(PAYMENT_SHEET)}&_=${Date.now()}`
        );
        const result = await response.json();
        if (result.status === "success" && Array.isArray(result.data)) {
            allPayments = result.data.map((item, idx) => ({ ...item, _rowIndex: idx + 2 }));
            setCache(CACHE_KEY, allPayments);
            isDataLoaded = true;
            renderTable();
            return allPayments;
        }
        throw new Error(result.message || "Failed to load data");
    } catch (err) {
        showToast("❌ Failed to load records: " + err.message, "error");
        return [];
    }
}

async function refreshDataInBackground() {
    try {
        const response = await fetch(
            `${SCRIPT_URL}?spreadsheetId=${SPREADSHEET_ID}&sheetName=${encodeURIComponent(PAYMENT_SHEET)}&_=${Date.now()}`
        );
        const result = await response.json();
        if (result.status === "success" && Array.isArray(result.data)) {
            const newData = result.data.map((item, idx) => ({ ...item, _rowIndex: idx + 2 }));
            if (JSON.stringify(newData) !== JSON.stringify(allPayments)) {
                allPayments = newData;
                setCache(CACHE_KEY, allPayments);
                renderTable();
            }
        }
    } catch (err) {
        console.log("Background refresh failed:", err.message);
    }
}

async function loadStaffRegistry(forceRefresh = false) {
    if (!forceRefresh) {
        const cached = getCache(STAFF_CACHE_KEY);
        if (cached) {
            staffRegistry = cached;
            isStaffLoaded = true;
            renderStaffList(staffRegistry);
            return staffRegistry;
        }
    }

    try {
        const response = await fetch(
            `${SCRIPT_URL}?spreadsheetId=${SPREADSHEET_ID}&sheetName=${encodeURIComponent(STAFF_SHEET)}`
        );
        const result = await response.json();
        if (result.status === "success" && Array.isArray(result.data)) {
            staffRegistry = result.data
                .map(row => row["Staff Name"] || row["StaffName"])
                .filter(name => !!name);
            setCache(STAFF_CACHE_KEY, staffRegistry);
            isStaffLoaded = true;
            renderStaffList(staffRegistry);
            return staffRegistry;
        }
        return [];
    } catch (err) {
        console.error("Failed to load staff registry:", err);
        return [];
    }
}


/* =====================================================================
   SECTION 8 — TABLE RENDERING
   ===================================================================== */

function renderTable(filter = "") {
    if (!dom.tableBody) return;

    const searchLower = filter.toLowerCase();
    let filtered = allPayments.filter(s => {
        const staffName = String(s['Staff Name'] || '').toLowerCase();
        return staffName.includes(searchLower);
    });

    if (!filtered.length) {
        dom.tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 40px;">💰 No payment records found</td></tr>';
        return;
    }

    const fragment = document.createDocumentFragment();
    filtered.forEach((s, idx) => {
        const row = document.createElement('tr');
        row.innerHTML = `
            <td><strong>${escapeHtml(s['Sr. No'] || idx + 1)}</strong></td>
            <td>${escapeHtml(formatDateForDisplay(s['Date']))}</td>
            <td>${escapeHtml(s['Staff Name'] || '—')}</td>
            <td class="amount-display">₹${escapeHtml(parseFloat(s['Amount'] || 0).toFixed(2))}</td>
            <td><button class="view-action-btn" data-srno="${escapeHtml(s['Sr. No'] || '')}">👁️ View</button></td>
        `;
        fragment.appendChild(row);
    });

    dom.tableBody.innerHTML = '';
    dom.tableBody.appendChild(fragment);

    dom.tableBody.querySelectorAll('.view-action-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const srNoVal = btn.getAttribute('data-srno');
            const found = allPayments.find(s => String(s['Sr. No']) === String(srNoVal));
            if (found) {
                currentViewPayment = found;
                showDetailView(found);
            }
        });
    });
}


/* =====================================================================
   SECTION 9 — DETAIL VIEW
   ===================================================================== */

function showDetailView(payment) {
    selectedSrNo = payment['Sr. No'];
    selectedRowIndex = payment._rowIndex || 2;

    const fields = [
        { label: "Sr. No", value: payment['Sr. No'] },
        { label: "Date", value: formatDateForDisplay(payment['Date']) },
        { label: "Staff Name", value: payment['Staff Name'] },
        { label: "Payment For", value: payment['Payment For'] },
        { label: "Transaction Method", value: payment['Transaction'] },
        { label: "UPI Transaction No", value: payment['UPI Trans No'] || '—' },
        { label: "Bank Transaction No", value: payment['Bank Trans No'] || '—' },
        { label: "Amount", value: `₹${parseFloat(payment['Amount'] || 0).toFixed(2)}` },
        { label: "Note", value: payment['Note'] || '—', full: true }
    ];

    const grid = dom.detailsContainer;
    grid.innerHTML = '';
    fields.forEach(f => {
        const card = document.createElement('div');
        card.className = `detail-card${f.full ? ' fullwidth' : ''}`;
        card.innerHTML = `
            <div class="detail-label">${f.label}</div>
            <div class="detail-value">${escapeHtml(String(f.value || '—'))}</div>
        `;
        grid.appendChild(card);
    });

    dom.page1.classList.remove('active-page');
    dom.page2.classList.add('active-page');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}


/* =====================================================================
   SECTION 10 — NAVIGATION
   ===================================================================== */

function goToListView() {
    dom.page2.classList.remove('active-page');
    dom.page1.classList.add('active-page');
}


/* =====================================================================
   SECTION 11 — CRUD OPERATIONS
   ===================================================================== */

function findRowIndexBySrNo(srNo) {
    const idx = allPayments.findIndex(s => String(s['Sr. No']) === String(srNo));
    return idx !== -1 ? allPayments[idx]._rowIndex : null;
}

async function deletePayment() {
    if (!currentViewPayment) return;
    const srNo = currentViewPayment['Sr. No'];
    const rowIdx = findRowIndexBySrNo(srNo);
    if (!rowIdx) {
        showModal("Row not found", "Error");
        return;
    }

    showModal(
        `⚠️ Are you sure you want to delete payment record <strong>${currentViewPayment['Payment For']}</strong> for ${currentViewPayment['Staff Name']}?<br><br>This action cannot be undone.`,
        "Confirm Delete",
        true,
        async () => {
            showSpinner(dom.deleteBtn, true);
            try {
                const params = new URLSearchParams();
                params.append("action", "delete");
                params.append("spreadsheetId", SPREADSHEET_ID);
                params.append("sheetName", PAYMENT_SHEET);
                params.append("rowIndex", rowIdx);

                const response = await fetch(SCRIPT_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: params.toString()
                });
                const result = await response.json();

                if (result.status === "success") {
                    showToast("✅ Payment deleted successfully!", "success");
                    sessionStorage.removeItem(CACHE_KEY);
                    await loadPayments(true);
                    goToListView();
                } else {
                    showModal("❌ Delete failed: " + result.message, "Error");
                }
            } catch (err) {
                showModal("❌ Error: " + err.message, "Error");
            } finally {
                showSpinner(dom.deleteBtn, false);
            }
        }
    );
}


/* =====================================================================
   SECTION 12 — FORM BUILDER
   ===================================================================== */

function buildFormHtml(payment = null, isEdit = false) {
    const def = {
        "Date": getTodayDate(),
        "Staff Name": "",
        "Payment For": "",
        "Transaction": "Cash",
        "UPI Trans No": "",
        "Bank Trans No": "",
        "Amount": "",
        "Note": ""
    };

    if (payment) {
        Object.keys(def).forEach(k => {
            if (payment[k] !== undefined) def[k] = payment[k];
        });
    }

    const dateValue = formatDateForInput(def["Date"]) || getTodayDate();

    return `
        <form id="paymentForm">
            <div class="form-grid">
                <div class="field">
                    <label>Payment Date *</label>
                    <input type="date" id="fPaymentDate" value="${dateValue}" max="${getTodayDate()}" required>
                </div>

                <div class="field">
                    <label>Staff Name *</label>
                    <div style="position: relative; display: flex; gap: 10px; align-items: center;">
                        <div style="position: relative; flex: 1;">
                            <span style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-light);">
                                <i class="fas fa-user-circle"></i>
                            </span>
                            <input type="text" id="fStaffName" value="${escapeHtml(def['Staff Name'])}" readonly required
                                   placeholder="Click the search button to find staff..."
                                   style="width: 100%; padding: 12px 16px 12px 40px; border: 2px solid var(--border-color); border-radius: 16px;
                                          background: var(--bg-secondary); color: var(--text-main); font-size: 0.9rem;
                                          cursor: default; transition: all var(--transition-fast); font-family: inherit;
                                          ${def['Staff Name'] ? 'border-color: var(--success);' : ''}">
                        </div>
                        <button type="button" onclick="openStaffSearchModalForForm()"
                                class="btn btn-primary"
                                style="flex-shrink: 0; padding: 10px 18px; border-radius: 16px; font-size: 0.85rem;
                                       display: flex; align-items: center; gap: 8px; min-width: 100px; justify-content: center;">
                            <i class="fas fa-search"></i>
                            <span>Select</span>
                        </button>
                    </div>
                    ${def['Staff Name'] ? `<div style="margin-top: 4px; font-size: 0.7rem; color: var(--success);">
                        <i class="fas fa-check-circle"></i> Staff selected
                    </div>` : ''}
                </div>

                <div class="field fullwidth">
                    <label>Payment For / Allocation Purpose *</label>
                    <input type="text" id="fPaymentFor" value="${escapeHtml(def['Payment For'])}" required
                           placeholder="e.g., Monthly Salary, Exam Supervision, Bonus...">
                </div>

                <div class="field">
                    <label>Amount (INR) *</label>
                    <input type="number" id="fAmount" value="${escapeHtml(def['Amount'])}" required
                           min="1" step="any" placeholder="0.00">
                </div>

                <div class="field">
                    <label>Transaction Method *</label>
                    <select id="fTransaction" onchange="toggleTransactionFields(this.value)" required>
                        <option value="Cash" ${def['Transaction'] === 'Cash' ? 'selected' : ''}>Cash</option>
                        <option value="UPI" ${def['Transaction'] === 'UPI' ? 'selected' : ''}>UPI Digital Payment</option>
                        <option value="Bank Transfer" ${def['Transaction'] === 'Bank Transfer' ? 'selected' : ''}>Direct Bank Transfer</option>
                    </select>
                </div>

                <div class="field" id="upiFieldContainer" style="${def['Transaction'] === 'UPI' ? '' : 'display: none;'}">
                    <label style="color: #6366f1;">UPI Transaction No *</label>
                    <input type="text" id="fUpiTransNo" value="${escapeHtml(def['UPI Trans No'])}"
                           placeholder="Enter 12-digit UPI Ref/TXN No..."
                           class="method-upi" ${def['Transaction'] === 'UPI' ? 'required' : ''}>
                </div>

                <div class="field" id="bankFieldContainer" style="${def['Transaction'] === 'Bank Transfer' ? '' : 'display: none;'}">
                    <label style="color: #10b981;">Bank Transaction No / UTR *</label>
                    <input type="text" id="fBankTransNo" value="${escapeHtml(def['Bank Trans No'])}"
                           placeholder="Enter Bank UTR Reference code..."
                           class="method-bank" ${def['Transaction'] === 'Bank Transfer' ? 'required' : ''}>
                </div>

                <div class="field fullwidth">
                    <label>Notes / Remarks</label>
                    <textarea id="fNote" rows="2" placeholder="Append transaction annotations or payment descriptors here...">${escapeHtml(def['Note'])}</textarea>
                </div>
            </div>

            <div id="formStatus" class="status-message"></div>

            <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 1.5rem;">
                <button type="button" id="cancelFormBtn" class="btn btn-outline">Cancel</button>
                <button type="submit" id="saveFormBtn" class="btn btn-primary">${isEdit ? "💾 Update Payment" : "💾 Save Payment"}</button>
            </div>
        </form>
    `;
}


/* =====================================================================
   SECTION 13 — TRANSACTION TOGGLE
   ===================================================================== */

function toggleTransactionFields(method) {
    const upiContainer = document.getElementById('upiFieldContainer');
    const bankContainer = document.getElementById('bankFieldContainer');
    const upiInput = document.getElementById('fUpiTransNo');
    const bankInput = document.getElementById('fBankTransNo');

    if (!upiContainer || !bankContainer) return;

    if (method === 'UPI') {
        upiContainer.style.display = 'block';
        bankContainer.style.display = 'none';
        if (upiInput) upiInput.required = true;
        if (bankInput) { bankInput.required = false; bankInput.value = ''; }
    } else if (method === 'Bank Transfer') {
        upiContainer.style.display = 'none';
        bankContainer.style.display = 'block';
        if (upiInput) { upiInput.required = false; upiInput.value = ''; }
        if (bankInput) bankInput.required = true;
    } else {
        upiContainer.style.display = 'none';
        bankContainer.style.display = 'none';
        if (upiInput) { upiInput.required = false; upiInput.value = ''; }
        if (bankInput) { bankInput.required = false; bankInput.value = ''; }
    }
}


/* =====================================================================
   SECTION 14 — STAFF SEARCH MODAL
   ===================================================================== */

function openStaffSearchModalForForm() {
    const modal = dom.staffSearchModal;
    modal.classList.add('active');
    dom.staffSearchInput.value = '';

    if (isStaffLoaded && staffRegistry.length > 0) {
        renderStaffList(staffRegistry);
    } else {
        dom.staffListContainer.innerHTML = `
            <div class="modal-spinner">
                <div class="spinner"></div>
                <span>Loading staff records...</span>
            </div>
        `;
        loadStaffRegistry();
    }

    setTimeout(() => dom.staffSearchInput.focus(), 100);
}

function closeStaffSearchModal() {
    dom.staffSearchModal.classList.remove('active');
}

function renderStaffList(list) {
    const container = dom.staffListContainer;
    if (!list || list.length === 0) {
        container.innerHTML = `
            <div style="text-align: center; padding: 40px; color: var(--text-light);">
                <i class="fas fa-users" style="font-size: 2rem; display: block; margin-bottom: 12px;"></i>
                No staff members found
            </div>
        `;
        return;
    }

    container.innerHTML = list.map(name => `
        <div class="staff-list-item" onclick="selectStaffMember('${name.replace(/'/g, "\\'")}')">
            <span class="name"><i class="fas fa-user-circle" style="margin-right: 10px; color: var(--primary);"></i>${escapeHtml(name)}</span>
            <span class="icon"><i class="fas fa-chevron-right"></i></span>
        </div>
    `).join('');
}

function filterStaffList(query) {
    const filtered = staffRegistry.filter(name =>
        name.toLowerCase().includes(query.toLowerCase().trim())
    );
    renderStaffList(filtered);
}

function selectStaffMember(name) {
    document.getElementById('fStaffName').value = name;
    closeStaffSearchModal();
}


/* =====================================================================
   SECTION 15 — FORM EVENTS
   ===================================================================== */

function attachFormEvents(isEdit, rowIdx) {
    const form = document.getElementById('paymentForm');
    if (!form) {
        console.error("❌ Form not found!");
        return;
    }

    const transactionSelect = document.getElementById('fTransaction');
    if (transactionSelect) {
        toggleTransactionFields(transactionSelect.value);
    }

    const cancelBtn = document.getElementById('cancelFormBtn');
    if (cancelBtn) {
        cancelBtn.addEventListener('click', () => {
            dom.formModal.classList.remove('active');
        });
    }

    document.getElementById('closeStaffSearchBtn')?.addEventListener('click', closeStaffSearchModal);

    dom.staffSearchModal.addEventListener('click', function(e) {
        if (e.target === this) closeStaffSearchModal();
    });

    form.onsubmit = (e) => {
        handleFormSubmit(e, isEdit, rowIdx);
    };
}


/* =====================================================================
   SECTION 16 — FORM SUBMIT
   ===================================================================== */

async function handleFormSubmit(e, isEdit, rowIdx) {
    e.preventDefault();
    if (saveInProgress) return;
    saveInProgress = true;

    const saveBtn = document.getElementById('saveFormBtn');
    showSpinner(saveBtn, true);
    document.getElementById('formStatus').style.display = 'none';

    try {
        const transactionMethod = document.getElementById('fTransaction').value;
        const rawDateValue = document.getElementById('fPaymentDate').value;

        const formData = {
            "Date": rawDateValue,
            "Staff Name": document.getElementById('fStaffName')?.value || "",
            "Payment For": document.getElementById('fPaymentFor')?.value || "",
            "Transaction": transactionMethod,
            "UPI Trans No": transactionMethod === "UPI" ? document.getElementById('fUpiTransNo')?.value || "" : "",
            "Bank Trans No": transactionMethod === "Bank Transfer" ? document.getElementById('fBankTransNo')?.value || "" : "",
            "Amount": parseFloat(document.getElementById('fAmount')?.value || 0).toFixed(2),
            "Note": document.getElementById('fNote')?.value || ""
        };

        const required = ['Staff Name', 'Payment For', 'Amount'];
        for (const field of required) {
            if (!formData[field] || formData[field].trim() === '') {
                showToast(`❌ ${field} is required`, "error");
                saveInProgress = false;
                showSpinner(saveBtn, false);
                return;
            }
        }

        if (parseFloat(formData['Amount']) <= 0) {
            showToast("❌ Amount must be greater than 0", "error");
            saveInProgress = false;
            showSpinner(saveBtn, false);
            return;
        }

        const params = new URLSearchParams();
        params.append("action", isEdit ? "update" : "insert");
        params.append("spreadsheetId", SPREADSHEET_ID);
        params.append("sheetName", PAYMENT_SHEET);
        if (isEdit && rowIdx) params.append("rowIndex", rowIdx);

        if (!isEdit) {
            const nextSrNo = allPayments.length + 1;
            params.append("Sr. No", nextSrNo);
        }

        for (const [key, value] of Object.entries(formData)) {
            params.append(key, value);
        }

        const response = await fetch(SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: params.toString()
        });

        const result = await response.json();

        if (result.status === "success") {
            showToast(`✅ Payment ${isEdit ? 'updated' : 'saved'} successfully!`, "success");
            sessionStorage.removeItem(CACHE_KEY);
            dom.formModal.classList.remove('active');
            await loadPayments(true);
            goToListView();
        } else {
            showToast("❌ Error: " + result.message, "error");
        }
    } catch (err) {
        console.error("Submission error:", err);
        showToast("❌ Error: " + err.message, "error");
    } finally {
        saveInProgress = false;
        showSpinner(saveBtn, false);
    }
}


/* =====================================================================
   SECTION 17 — MODAL OPEN
   ===================================================================== */

function getCachedFormHtml(isEdit, payment = null) {
    if (isEdit && payment) {
        return buildFormHtml(payment, true);
    }
    if (!isEdit && formHtmlCacheData) {
        return formHtmlCacheData;
    }
    const html = buildFormHtml(null, false);
    if (!isEdit) formHtmlCacheData = html;
    return html;
}

async function openAddModal() {
    dom.formModal.classList.add('active');
    dom.formModalTitle.textContent = "💰 Add New Payment";
    dom.formModalBody.innerHTML = getCachedFormHtml(false);

    setTimeout(() => attachFormEvents(false, null), 50);

    if (!isStaffLoaded) loadStaffRegistry();
    if (staffRegistry.length === 0 && !isStaffLoaded) {
        setTimeout(() => loadStaffRegistry(), 100);
    }
}

async function openEditModal() {
    if (!currentViewPayment) {
        showModal("No payment selected", "Error");
        return;
    }

    const rowIdx = findRowIndexBySrNo(currentViewPayment['Sr. No']);
    if (!rowIdx) {
        showModal("Row error", "Error");
        return;
    }

    dom.formModal.classList.add('active');
    dom.formModalTitle.textContent = "✏️ Edit Payment";
    dom.formModalBody.innerHTML = buildFormHtml(currentViewPayment, true);

    setTimeout(() => attachFormEvents(true, rowIdx), 50);
}


/* =====================================================================
   SECTION 18 — INITIALIZATION (only runs AFTER auth passes)
   ===================================================================== */

function init() {
    if (initDone) return;
    initDone = true;

    cacheDomElements();
    updateAdminBadge();

    dom.tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center;"><div class="spinner"></div> Loading payment records...</td></tr>';

    loadPayments();
    setTimeout(() => loadStaffRegistry(), 100);

    dom.searchInput?.addEventListener('input', (e) => {
        clearTimeout(searchDebounceTimer);
        searchDebounceTimer = setTimeout(() => renderTable(e.target.value), 300);
    });

    dom.refreshBtn?.addEventListener('click', async () => {
        showSpinner(dom.refreshBtn, true);
        sessionStorage.removeItem(CACHE_KEY);
        sessionStorage.removeItem(STAFF_CACHE_KEY);
        showToast("🔄 Syncing with Google Sheets...", "info");
        try {
            await loadPayments(true);
            await loadStaffRegistry(true);
            showToast("✅ Data refreshed successfully!", "success");
        } catch (err) {
            showToast("❌ Refresh failed: " + err.message, "error");
        } finally {
            showSpinner(dom.refreshBtn, false);
        }
    });

    dom.addNewBtn?.addEventListener('click', openAddModal);
    dom.backBtn?.addEventListener('click', goToListView);
    dom.editBtn?.addEventListener('click', openEditModal);
    dom.deleteBtn?.addEventListener('click', deletePayment);

    // Mobile buttons
    const mobileRefreshBtn = document.getElementById('mobileRefreshBtn');
    const mobileAddBtn = document.getElementById('mobileAddBtn');
    if (mobileRefreshBtn) {
        mobileRefreshBtn.addEventListener('click', function() {
            if (dom.refreshBtn) dom.refreshBtn.click();
            else refreshData();
        });
    }
    if (mobileAddBtn) {
        mobileAddBtn.addEventListener('click', function() {
            if (dom.addNewBtn) dom.addNewBtn.click();
            else openAddModal();
        });
    }

    document.getElementById('closeGlobalModal')?.addEventListener('click', () => dom.globalModal.classList.remove('active'));
    document.getElementById('closeFormModalBtn')?.addEventListener('click', () => {
        dom.formModal.classList.remove('active');
    });

    window.onclick = (e) => {
        if (e.target.classList?.contains('modal-overlay')) {
            e.target.classList.remove('active');
        }
    };

    // Background refresh every 5 min
    setInterval(() => {
        refreshDataInBackground();
    }, 5 * 60 * 1000);

    console.log('✅ StaffPayment.html initialized');
}


/* =====================================================================
   SECTION 19 — BOOTSTRAP WITH AUTH GATE
   ===================================================================== */

(function bootstrap() {
    syncThemeWithParent();

    const startWhenReady = () => {
        setTimeout(() => {
            gateAdminAccess(() => init());
        }, 800);
    };

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', startWhenReady);
    } else {
        startWhenReady();
    }

    // Failsafe redirect
    setTimeout(() => {
        const mainEl = document.getElementById('mainContent');
        const stillHidden = !mainEl || (mainEl.style.display === 'none' && !mainEl.classList.contains('visible'));
        const loadingHidden = document.getElementById('authLoading')?.classList.contains('hidden');
        if (stillHidden && !loadingHidden) {
            const auth = checkAdminAuth();
            if (!auth.ok) {
                console.warn('⏰ Safety net: redirecting');
                redirectToMyAccount(auth.reason);
            }
        }
    }, 5000);
})();


/* =====================================================================
   SECTION 20 — WINDOW EXPORTS
   ===================================================================== */

window.checkAdminAuth = checkAdminAuth;
window.updateAdminBadge = updateAdminBadge;
window.openStaffSearchModalForForm = openStaffSearchModalForForm;
window.closeStaffSearchModal = closeStaffSearchModal;
window.filterStaffList = filterStaffList;
window.selectStaffMember = selectStaffMember;
window.toggleTransactionFields = toggleTransactionFields;
window.openAddModal = openAddModal;
window.openEditModal = openEditModal;
window.deletePayment = deletePayment;
window.goToListView = goToListView;
window.refreshData = () => loadPayments(true);

console.log('✅ StaffPayment.html script initialised (auth-gated)');
</script>
</body>
</html>
