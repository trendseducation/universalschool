async function handleFormSubmit(e, isEdit, rowIdx) {
    e.preventDefault();
    if (saveInProgress) return;
    saveInProgress = true;

    const saveBtn = document.getElementById('saveFormBtn');
    showSpinner(saveBtn, true);

    const allErrorFields = [
        'fFirstName', 'fLastName', 'fFatherName', 'fMotherName',
        'fDateOfAdm', 'fBirthDate', 'fGender', 'fEmail',
        'fPersonalMobile', 'fParentMobile', 'fAdmIn', 'fGrNo', 'fStd'
    ];
    clearAllFieldErrors(allErrorFields);

    const dateInput = document.getElementById('fDateOfAdm');
    const birthDateInput = document.getElementById('fBirthDate');
    if (dateInput) dateInput.blur();
    if (birthDateInput) birthDateInput.blur();

    const dateValue = dateInput?.value || "";
    const birthDateValue = birthDateInput?.value || "";

    let hasErrors = false;
    const firstErrorField = { id: null };

    const nameChecks = [
        { id: 'fFirstName', label: 'First Name' },
        { id: 'fLastName',  label: 'Last Name'  },
        { id: 'fFatherName', label: 'Father Name' },
        { id: 'fMotherName', label: 'Mother Name' }
    ];
    nameChecks.forEach(({ id, label }) => {
        const el = document.getElementById(id);
        const result = validateSingleWordName(el?.value || '', label);
        if (!result.valid) {
            setFieldError(id, result.message);
            hasErrors = true;
            if (!firstErrorField.id) firstErrorField.id = id;
        }
    });

    const dateValidation = validateAndFormatDate(dateValue, 'Date of Admission');
    if (!dateValidation.isValid) {
        setFieldError('fDateOfAdm', dateValidation.error);
        hasErrors = true;
        if (!firstErrorField.id) firstErrorField.id = 'fDateOfAdm';
    }
    const birthValidation = validateAndFormatDate(birthDateValue, 'Birth Date');
    if (!birthValidation.isValid) {
        setFieldError('fBirthDate', birthValidation.error);
        hasErrors = true;
        if (!firstErrorField.id) firstErrorField.id = 'fBirthDate';
    }

    const emailVal = document.getElementById('fEmail')?.value.trim() || "";
    const emailFormat = validateEmailFormat(emailVal);
    if (!emailFormat.valid) {
        setFieldError('fEmail', emailFormat.message);
        hasErrors = true;
        if (!firstErrorField.id) firstErrorField.id = 'fEmail';
    } else {
        const currentSrNo = isEdit ? (currentEditStudent?.['Sr. No'] ?? null) : null;
        if (isEmailDuplicate(emailVal, currentSrNo)) {
            setFieldError('fEmail', `This email "${emailVal}" is already registered.`);
            hasErrors = true;
            if (!firstErrorField.id) firstErrorField.id = 'fEmail';
        }
    }

    const personalMob = document.getElementById('fPersonalMobile')?.value.trim() || "";
    if (!personalMob) {
        setFieldError('fPersonalMobile', 'Personal Mobile is required.');
        hasErrors = true;
        if (!firstErrorField.id) firstErrorField.id = 'fPersonalMobile';
    } else if (!/^[6-9][0-9]{9}$/.test(personalMob)) {
        setFieldError('fPersonalMobile', 'Enter a valid 10-digit mobile starting with 6-9.');
        hasErrors = true;
        if (!firstErrorField.id) firstErrorField.id = 'fPersonalMobile';
    }

    const parentMob = document.getElementById('fParentMobile')?.value.trim() || "";
    if (!parentMob) {
        setFieldError('fParentMobile', 'Parent Mobile is required.');
        hasErrors = true;
        if (!firstErrorField.id) firstErrorField.id = 'fParentMobile';
    } else if (!/^[6-9][0-9]{9}$/.test(parentMob)) {
        setFieldError('fParentMobile', 'Enter a valid 10-digit mobile starting with 6-9.');
        hasErrors = true;
        if (!firstErrorField.id) firstErrorField.id = 'fParentMobile';
    }

    const genderVal = document.getElementById('fGender')?.value || "";
    if (!genderVal) {
        setFieldError('fGender', 'Gender is required.');
        hasErrors = true;
        if (!firstErrorField.id) firstErrorField.id = 'fGender';
    }

    const admInVal = document.getElementById('fAdmIn')?.value.trim() || "";
    if (!admInVal) {
        setFieldError('fAdmIn', 'Adm In is required.');
        hasErrors = true;
        if (!firstErrorField.id) firstErrorField.id = 'fAdmIn';
    }

    const grNoVal = document.getElementById('fGrNo')?.value.trim() || "";
    if (!grNoVal) {
        setFieldError('fGrNo', 'G.R. No is required.');
        hasErrors = true;
        if (!firstErrorField.id) firstErrorField.id = 'fGrNo';
    } else if (!/^\d+$/.test(grNoVal)) {
        setFieldError('fGrNo', 'G.R. No must contain digits only.');
        hasErrors = true;
        if (!firstErrorField.id) firstErrorField.id = 'fGrNo';
    } else {
        const currentSrNo = isEdit ? (currentEditStudent?.['Sr. No'] ?? null) : null;
        if (isGrNoDuplicate(grNoVal, currentSrNo)) {
            setFieldError('fGrNo', `G.R. No "${grNoVal}" is already registered.`);
            hasErrors = true;
            if (!firstErrorField.id) firstErrorField.id = 'fGrNo';
        }
    }

    const stdVal = document.getElementById('fStd')?.value.trim() || "";
    if (!stdVal) {
        setFieldError('fStd', 'Std is required.');
        hasErrors = true;
        if (!firstErrorField.id) firstErrorField.id = 'fStd';
    }

    if (hasErrors) {
        saveInProgress = false;
        showSpinner(saveBtn, false);
        showToast('❌ Please fix the highlighted errors before saving.', 'error');
        if (firstErrorField.id) {
            const el = document.getElementById(firstErrorField.id);
            if (el) {
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                setTimeout(() => el.focus(), 300);
            }
        }
        return;
    }

    const firstName = document.getElementById('fFirstName')?.value.trim() || "";
    const middleName = document.getElementById('fMiddleName')?.value.trim() || "";
    const lastName = document.getElementById('fLastName')?.value.trim() || "";
    const fullName = combineFullName(firstName, middleName, lastName);

    const formData = {
        "Academic Year": document.getElementById('fAcademicYear')?.value || "",
        "Date of Adm": dateValue,
        "First Name": firstName,
        "Middle Name": middleName,
        "Last Name": lastName,
        "Full Name": fullName,
        "Father Name": document.getElementById('fFatherName')?.value.trim() || "",
        "Mother Name": document.getElementById('fMotherName')?.value.trim() || "",
        "Father Occupation": document.getElementById('fFatherOccupation')?.value || "",
        "Mother Occupation": document.getElementById('fMotherOccupation')?.value || "",
        "Adm In": admInVal,
        "G.R. No": grNoVal,
        "Std": stdVal,
        "Birth Date": birthDateValue,
        "Gender": genderVal,
        "Email Id": emailVal,
        "Personal Mob No": personalMob,
        "Parent Mob No": parentMob,
        "Last School Name": document.getElementById('fLastSchool')?.value || "",
        "Last Session Marks (%)": document.getElementById('fMarks')?.value || "",
        "Weight": document.getElementById('fWeight')?.value || "",
        "Height": document.getElementById('fHeight')?.value || "",
        "Address": document.getElementById('fAddress')?.value || "",
        "Note": document.getElementById('fNote')?.value || ""
    };

    const params = new URLSearchParams();
    params.append("action", isEdit ? "update" : "insert");
    params.append("spreadsheetId", SPREADSHEET_ID);
    params.append("sheetName", SHEET_NAME);

    if (isEdit) {
        let finalRowIdx = null;
        if (rowIdx) finalRowIdx = rowIdx;
        else if (currentEditStudent && currentEditStudent._rowIndex) finalRowIdx = currentEditStudent._rowIndex;
        else if (currentViewStudent && currentViewStudent._rowIndex) finalRowIdx = currentViewStudent._rowIndex;
        else if (formData['Adm In']) {
            const found = allStudents.find(s => String(s['Adm In']) === String(formData['Adm In']));
            if (found && found._rowIndex) finalRowIdx = found._rowIndex;
        }
        if (!finalRowIdx) {
            showModal("❌ Error: Could not determine which row to update. Please refresh and try again.", "Error");
            saveInProgress = false;
            showSpinner(saveBtn, false);
            return;
        }
        params.append("rowIndex", finalRowIdx);
    }

    if (DRIVE_FOLDER_ID) params.append("driveFolderId", DRIVE_FOLDER_ID);

    for (const [key, value] of Object.entries(formData)) {
        if (key === "Full Name") {
            if (value && value.trim()) params.append(key, value);
        } else {
            params.append(key, value);
        }
    }

    if (croppedImageData && croppedImageData.base64Data) {
        params.append("fileCount", "1");
        params.append("fileData1", croppedImageData.base64Data);
        params.append("fileName1", croppedImageData.fileName);
        params.append("fileType1", croppedImageData.mimeType);
        params.append("fileColumn1", IMAGE_COLUMN_NAME);
    }

    try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 30000);

        const response = await fetch(SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: params.toString(),
            signal: controller.signal
        });
        clearTimeout(timeoutId);
        const result = await response.json();

        if (result.status === "success") {
            showModal(`${isEdit ? "✅ Student updated" : "✅ Student saved"} successfully!`, "Success", false, null, 2000);
            await new Promise(resolve => setTimeout(resolve, 500));
            dom.formModal?.classList.remove('active');

            invalidateStudentCache();
            await loadStudents(true);
            goToListView();
        } else {
            showModal("❌ Error: " + (result.message || "Unknown error"), "Error");
        }
    } catch (err) {
        if (err.name === 'AbortError') {
            showModal("❌ Request timeout. Please check your internet connection and try again.", "Error");
        } else {
            showModal("❌ Error: " + err.message, "Error");
        }
    } finally {
        saveInProgress = false;
        showSpinner(saveBtn, false);
    }
}

/* =====================================================================
   SECTION 32 — BOOTSTRAP WITH AUTH GATE
   ===================================================================== */

/**
 * Bootstrap strategy:
 *   1. loginadmin.js is loaded (if present) and will reveal mainContent.
 *   2. We wait 800ms for it to run.
 *   3. Then we gate on admin session and start initApp().
 *   4. If loginadmin.js did NOT reveal mainContent, we run our own check.
 *   5. If auth fails → redirect to myaccount.html
 */
(function bootstrap() {
    const startWhenReady = () => {
        // Small delay so loginadmin.js (if present) can settle
        setTimeout(() => {
            gateAdminAccess(() => {
                initApp();
            });
        }, 800);
    };

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', startWhenReady);
    } else {
        startWhenReady();
    }

    // Failsafe: if loginadmin.js never loads and never reveals,
    // our gateAdminAccess still runs at +800ms above.

    // Additional safety net: after 5s, if still hidden and no session → redirect
    setTimeout(() => {
        const mainEl = document.getElementById('mainContent');
        const stillHidden = !mainEl || mainEl.style.display === 'none';
        if (stillHidden && !initDone) {
            const auth = checkAdminAuth();
            if (!auth.ok) {
                console.warn('⏰ Safety net: auth not verified after 5s, redirecting');
                redirectToMyAccount(auth.reason);
            }
        }
    }, 5000);
})();
