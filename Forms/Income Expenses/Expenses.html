<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <meta name="description" content="Expenses Management System — Universal English Medium High School">
    <title>💸 Expenses Management | Universal English Medium High School</title>

    <!-- ═══════════════════════════════════════════════════════════════
         DNS PREFETCH + PRECONNECT
         ═══════════════════════════════════════════════════════════════ -->
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="dns-prefetch" href="https://script.google.com">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- Icons loaded async — non-blocking -->
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>

    <!-- ═══════════════════════════════════════════════════════════════
         CRITICAL CSS — above-the-fold (loading shell)
         ═══════════════════════════════════════════════════════════════ -->
    <style id="critical-css">
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        html,body{height:100%}
        body{
            font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
            background:#f0f6ff;color:#0f172a;
            -webkit-font-smoothing:antialiased;
        }
        /* Loading overlay */
        #authLoading{
            position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
            background:#f0f6ff;z-index:9999;flex-direction:column;gap:1.5rem;
        }
        #authLoading.hidden{display:none!important}
        #authLoading .spinner{
            width:50px;height:50px;border:4px solid #dbeafe;border-top-color:#2563eb;
            border-radius:50%;animation:spin .8s linear infinite;
        }
        #authLoading p{color:#475569;font-weight:500;font-size:.9rem}
        @keyframes spin{to{transform:rotate(360deg)}}

        /* Dark mode override for loading overlay */
        [data-theme="dark"] #authLoading{background:#0a1a3a}
        [data-theme="dark"] #authLoading .spinner{border-color:#1e3a8a;border-top-color:#facc15}
        [data-theme="dark"] #authLoading p{color:#facc15}

        #mainContent{display:none}
        #mainContent.visible{display:block}

        /* Hidden scrollbars — scroll still works */
        *{scrollbar-width:none;-ms-overflow-style:none}
        *::-webkit-scrollbar{width:0!important;height:0!important;display:none!important}
        html,body{overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch}
    </style>

    <!-- ═══════════════════════════════════════════════════════════════
         FULL STYLESHEET — loaded async (non-blocking)
         ═══════════════════════════════════════════════════════════════ -->
    <style id="main-css" media="print" onload="this.media='all'">
        /* ================================================================
           CSS VARIABLES — LIGHT MODE (Blue & White)
           ================================================================ */
        :root {
            --bg-body: #f0f6ff;
            --bg-body-gradient:
                radial-gradient(1200px 600px at 10% -10%, rgba(37, 99, 235, 0.08), transparent 60%),
                radial-gradient(900px 500px at 110% 20%, rgba(37, 99, 235, 0.06), transparent 55%),
                #f0f6ff;
            --bg-card: #ffffff;
            --bg-header: #ffffff;

            --text-main: #0f172a;
            --text-secondary: #1e40af;
            --text-light: #3b82f6;

            --border-color: #dbeafe;
            --border-light: #e8f0fc;

            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.08);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1);

            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #60a5fa;
            --primary-soft: #eff6ff;
            --primary-soft-2: #dbeafe;

            --accent: #eab308;
            --accent-soft: rgba(234, 179, 8, 0.12);

            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #06b6d4;

            --gradient-primary: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            --gradient-header: linear-gradient(135deg, #1e40af 0%, #2563eb 100%);

            --table-header-bg: #eff6ff;
            --table-row-hover: #f5f9ff;
            --table-border: #e0eaff;

            --transition-fast: 150ms ease;
            --transition-normal: 300ms ease;

            --admin-gold: #f59e0b;
            --admin-badge-bg: rgba(245, 158, 11, 0.15);
        }

        /* ================================================================
           CSS VARIABLES — DARK MODE (Blue + Yellow + White)
           ================================================================ */
        [data-theme="dark"] {
            --bg-body: #0a1a3a;
            --bg-body-gradient:
                radial-gradient(1200px 600px at 10% -10%, rgba(37, 99, 235, 0.22), transparent 60%),
                radial-gradient(900px 500px at 110% 20%, rgba(250, 204, 21, 0.10), transparent 55%),
                #0a1a3a;
            --bg-card: #10254a;
            --bg-header: #10254a;

            --text-main: #ffffff;
            --text-secondary: #facc15;
            --text-light: #e5e7eb;

            --border-color: #1e3a8a;
            --border-light: #1a2f66;

            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.4);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.5);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.5);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.6);

            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --primary-light: #60a5fa;
            --primary-soft: rgba(59, 130, 246, 0.15);
            --primary-soft-2: rgba(59, 130, 246, 0.25);

            --accent: #facc15;
            --accent-soft: rgba(250, 204, 21, 0.15);

            --success: #34d399;
            --danger: #f87171;
            --warning: #fbbf24;
            --info: #22d3ee;

            --gradient-primary: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
            --gradient-header: linear-gradient(135deg, #1e40af 0%, #2563eb 100%);

            --table-header-bg: #142b56;
            --table-row-hover: #183468;
            --table-border: #1e3a8a;

            --admin-badge-bg: rgba(250, 204, 21, 0.18);
        }

        /* ================================================================
           ANIMATIONS — transform / opacity only (GPU accelerated)
           ================================================================ */
        @keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
        @keyframes modalPop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
        @keyframes slideDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
        @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

        /* ================================================================
           BASE
           ================================================================ */
        body{
            background: var(--bg-body-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px 16px;
            transition: background-color var(--transition-normal), color var(--transition-normal);
        }
        #mainContent.visible{animation: fadeIn .4s ease-out}
        .app-container{max-width: 1400px; margin: 0 auto}

        /* ================================================================
           HEADER
           ================================================================ */
        .card-header{
            background: var(--bg-header);
            border-radius: 20px;
            padding: 1.2rem 1.6rem;
            margin-bottom: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: nowrap;
            gap: 10px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
            contain: layout style;
        }
        .card-header::before{
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: var(--gradient-primary);
        }
        [data-theme="dark"] .card-header::before{
            background: linear-gradient(90deg, #2563eb, #facc15, #2563eb);
        }

        .header-title-wrap{
            display: flex; align-items: center; gap: 10px;
            flex: 1; min-width: 0;
        }
        .card-header h2{
            font-size: 1.5rem; font-weight: 800;
            color: var(--primary-dark);
            display: flex; align-items: center; gap: 10px;
            min-width: 0; line-height: 1.2;
        }
        .card-header h2 i{
            color: #fff;
            background: var(--gradient-primary);
            padding: 8px; border-radius: 12px;
            font-size: 1rem; flex-shrink: 0;
        }
        [data-theme="dark"] .card-header h2{
            color: #facc15;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
        }
        [data-theme="dark"] .card-header h2 i{
            background: linear-gradient(135deg, #facc15, #eab308);
            color: #1e3a8a;
        }
        .card-header h2 .title-text{
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .header-actions{
            display: flex; align-items: center; gap: 8px;
            flex-wrap: nowrap; flex-shrink: 0;
        }

        /* ================================================================
           ADMIN BADGE
           ================================================================ */
        .admin-badge{
            display: none; align-items: center; gap: 6px;
            background: var(--admin-badge-bg); color: var(--admin-gold);
            padding: 5px 12px; border-radius: 30px;
            font-size: .68rem; font-weight: 700;
            border: 1px solid var(--admin-gold);
            white-space: nowrap;
        }
        .admin-badge.visible{display: inline-flex}
        .admin-badge i{font-size: .68rem}
        .admin-badge .session-pill{
            font-size: .52rem; padding: 1px 6px; border-radius: 20px;
            background: rgba(255, 255, 255, .15); margin-left: 2px;
        }
        [data-theme="dark"] .admin-badge{
            background: rgba(250, 204, 21, 0.15);
            color: #facc15;
            border-color: #facc15;
        }

        .btn-my-account{
            display: inline-flex; align-items: center; gap: 5px;
            background: var(--primary-soft); color: var(--primary);
            padding: 5px 11px; border-radius: 30px;
            font-size: .65rem; font-weight: 700;
            text-decoration: none;
            border: 1px solid var(--border-color);
            transition: transform var(--transition-fast), background-color var(--transition-fast);
            white-space: nowrap;
        }
        .btn-my-account:hover{
            background: var(--primary); color: #fff;
            transform: translateY(-1px);
        }
        [data-theme="dark"] .btn-my-account{
            background: rgba(250, 204, 21, 0.1);
            color: #facc15;
            border-color: #1e3a8a;
        }
        [data-theme="dark"] .btn-my-account:hover{
            background: #facc15; color: #1e3a8a;
        }

        /* ================================================================
           BACK BUTTON — inline with title
           ================================================================ */
        .btn-back{
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            padding: 8px 16px; border-radius: 60px;
            font-weight: 600; font-size: .82rem; cursor: pointer;
            transition: transform var(--transition-fast), background-color var(--transition-fast);
            background: var(--primary); border: 2px solid var(--primary); color: #fff;
            white-space: nowrap; font-family: inherit; flex-shrink: 0;
            min-height: 38px;
        }
        .btn-back:hover{
            background: var(--primary-dark); border-color: var(--primary-dark);
            transform: translateX(-2px);
        }
        .btn-back i{transition: transform var(--transition-fast)}
        .btn-back:hover i{transform: translateX(-3px)}
        [data-theme="dark"] .btn-back{
            background: #facc15; border-color: #facc15; color: #1e3a8a;
        }
        [data-theme="dark"] .btn-back:hover{
            background: #eab308; border-color: #eab308;
        }

        /* ================================================================
           SOFT CARD
           ================================================================ */
        .soft-card{
            background: var(--bg-card);
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            overflow: hidden;
            margin-bottom: 20px;
            contain: layout style;
        }

        .search-section{
            padding: 1.2rem 1.6rem;
            border-bottom: 1px solid var(--border-color);
            display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
            background: var(--primary-soft);
        }
        [data-theme="dark"] .search-section{
            background: rgba(59, 130, 246, 0.08);
        }
        .search-wrapper{flex: 1; min-width: 200px}
        .search-wrapper input{
            width: 100%; padding: 12px 20px;
            border: 2px solid var(--border-color); border-radius: 60px;
            background: var(--bg-card); color: var(--text-main);
            font-size: .9rem; font-family: inherit;
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
        }
        .search-wrapper input::placeholder{color: var(--text-light)}
        .search-wrapper input:focus{
            outline: none; border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, .1);
        }
        [data-theme="dark"] .search-wrapper input{
            background: #0a1a3a; color: #ffffff; border-color: #1e3a8a;
        }
        [data-theme="dark"] .search-wrapper input:focus{
            border-color: #facc15;
            box-shadow: 0 0 0 4px rgba(250, 204, 21, .15);
        }
        [data-theme="dark"] .search-wrapper input::placeholder{
            color: #94a3b8;
        }

        /* ================================================================
           BUTTONS
           ================================================================ */
        .btn{
            border: none; padding: 10px 20px; border-radius: 60px;
            font-weight: 600; font-size: .85rem; cursor: pointer;
            transition: transform var(--transition-fast), box-shadow var(--transition-fast);
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            font-family: inherit; text-decoration: none; white-space: nowrap;
            min-height: 40px; will-change: transform;
        }
        .btn-primary{
            background: var(--gradient-primary); color: #fff;
        }
        .btn-primary:hover{
            transform: translateY(-2px);
            box-shadow: 0 10px 24px -6px rgba(37, 99, 235, .6);
        }
        [data-theme="dark"] .btn-primary:hover{
            box-shadow: 0 10px 24px -6px rgba(250, 204, 21, .35);
        }

        .btn-outline{
            background: #fff; border: 2px solid var(--primary); color: var(--primary);
        }
        .btn-outline:hover{
            background: var(--primary); color: #fff; transform: translateY(-2px);
        }
        [data-theme="dark"] .btn-outline{
            background: transparent; border-color: #facc15; color: #facc15;
        }
        [data-theme="dark"] .btn-outline:hover{
            background: #facc15; color: #1e3a8a;
        }

        .btn-danger{
            background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff;
        }
        .btn-danger:hover{transform: translateY(-2px); box-shadow: var(--shadow-md)}

        .btn-sm{padding: 6px 14px; font-size: .75rem; min-height: 34px}
        .btn:disabled{opacity: .6; cursor: not-allowed; transform: none !important}

        /* ================================================================
           TABLE
           ================================================================ */
        .table-wrapper{
            overflow-x: auto; overflow-y: visible; padding: 0;
            -webkit-overflow-scrolling: touch;
        }
        .data-table{
            width: 100%; border-collapse: separate; border-spacing: 0;
            font-size: .875rem; min-width: 480px;
        }
        .data-table th{
            text-align: left; padding: 14px 18px;
            background: var(--table-header-bg); color: var(--primary-dark);
            font-weight: 800; font-size: .75rem;
            text-transform: uppercase; letter-spacing: .6px;
            border-bottom: 2px solid var(--primary); white-space: nowrap;
            position: sticky; top: 0; z-index: 2;
        }
        .data-table td{
            padding: 14px 18px;
            border-bottom: 1px solid var(--table-border);
            color: var(--text-main); font-size: .9rem;
            transition: background-color var(--transition-fast);
        }
        .data-table tr:hover td{background: var(--table-row-hover)}

        .data-table .sr-col{width: 60px; text-align: center; font-weight: 700; color: var(--text-secondary)}
        .data-table .amount-col{font-weight: 700; color: var(--primary-dark); white-space: nowrap}
        .data-table .action-col{width: 100px; text-align: center; white-space: nowrap}

        [data-theme="dark"] .data-table th{
            color: #facc15;
            border-bottom-color: #facc15;
        }
        [data-theme="dark"] .data-table td{color: #ffffff}
        [data-theme="dark"] .data-table .sr-col{color: #cbd5e1}
        [data-theme="dark"] .data-table .amount-col{color: #facc15}

        .view-action-btn{
            background: var(--gradient-primary); color: #fff;
            border: none; padding: 6px 14px; border-radius: 30px;
            font-size: .72rem; font-weight: 600; cursor: pointer;
            transition: transform var(--transition-fast), filter var(--transition-fast);
            display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
        }
        .view-action-btn:hover{transform: translateY(-2px); filter: brightness(1.05)}

        /* ================================================================
           SKELETON LOADERS
           ================================================================ */
        .skeleton-row td{padding: 16px 18px}
        .skeleton{
            background: linear-gradient(90deg,
                var(--border-color) 25%,
                var(--primary-soft) 50%,
                var(--border-color) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s linear infinite;
            border-radius: 8px; height: 16px;
        }
        .skeleton.sm{width: 60%}
        .skeleton.md{width: 80%}
        .skeleton.lg{width: 95%}

        /* ================================================================
           MOBILE BUTTONS
           ================================================================ */
        .mobile-buttons{display: none; gap: 10px; margin-top: 10px; width: 100%}
        .mobile-buttons .btn{flex: 1; justify-content: center}

        /* ================================================================
           MODAL
           ================================================================ */
        .modal-overlay{
            position: fixed; inset: 0;
            background: rgba(15, 23, 42, .5);
            backdrop-filter: blur(6px);
            display: flex; align-items: center; justify-content: center;
            z-index: 2000;
            visibility: hidden; opacity: 0;
            transition: opacity var(--transition-normal), visibility var(--transition-normal);
            padding: 16px;
        }
        .modal-overlay.active{visibility: visible; opacity: 1}

        .modal-box{
            background: var(--bg-card);
            width: 100%; max-width: 640px; max-height: 90vh;
            border-radius: 24px;
            overflow-y: auto; overflow-x: hidden;
            box-shadow: var(--shadow-xl);
            border: 1px solid var(--border-color);
            -webkit-overflow-scrolling: touch;
            transform: scale(.94);
            transition: transform var(--transition-normal);
            will-change: transform;
        }
        .modal-overlay.active .modal-box{
            animation: modalPop .28s cubic-bezier(.34, 1.56, .64, 1) forwards;
        }
        [data-theme="dark"] .modal-box{
            background: #10254a;
            border-color: #1e3a8a;
        }

        .modal-header{
            background: var(--gradient-header);
            padding: 1.1rem 1.4rem;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 10;
            color: #fff; gap: 10px;
        }
        .modal-header h3{
            font-size: 1.15rem; font-weight: 700;
            display: flex; align-items: center; gap: 10px;
            min-width: 0; flex: 1;
        }
        .modal-header h3 i{flex-shrink: 0}
        [data-theme="dark"] .modal-header{
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
        }
        [data-theme="dark"] .modal-header h3{color: #facc15}

        .close-modal{
            background: rgba(255, 255, 255, .2); border: none;
            width: 32px; height: 32px; border-radius: 50%;
            font-size: 1.3rem; cursor: pointer; color: #fff;
            transition: transform var(--transition-fast), background-color var(--transition-fast);
            line-height: 1; display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .close-modal:hover{transform: rotate(90deg); background: rgba(255, 255, 255, .3)}
        [data-theme="dark"] .close-modal{
            color: #facc15;
            background: rgba(250, 204, 21, .15);
        }
        [data-theme="dark"] .close-modal:hover{
            background: rgba(250, 204, 21, .3);
        }

        .modal-body{padding: 1.4rem}

        /* ================================================================
           FORM
           ================================================================ */
        .form-grid{
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1rem;
        }
        .field{display: flex; flex-direction: column; gap: 6px}
        .field label{
            font-size: .7rem; font-weight: 800;
            text-transform: uppercase; letter-spacing: .5px;
            color: var(--primary-dark);
        }
        .field input,
        .field select,
        .field textarea{
            padding: 11px 14px; border-radius: 12px;
            border: 2px solid var(--border-color);
            background: var(--bg-card); color: var(--text-main);
            font-size: .9rem; font-family: inherit;
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
            width: 100%;
        }
        .field input:focus,
        .field select:focus,
        .field textarea:focus{
            outline: none; border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, .1);
        }
        .field input::placeholder,
        .field textarea::placeholder{color: var(--text-light)}

        [data-theme="dark"] .field label{color: #facc15}
        [data-theme="dark"] .field input,
        [data-theme="dark"] .field select,
        [data-theme="dark"] .field textarea{
            background: #0a1a3a;
            color: #ffffff;
            border-color: #1e3a8a;
        }
        [data-theme="dark"] .field input:focus,
        [data-theme="dark"] .field select:focus,
        [data-theme="dark"] .field textarea:focus{
            border-color: #facc15;
            box-shadow: 0 0 0 4px rgba(250, 204, 21, .15);
        }
        [data-theme="dark"] .field input::placeholder,
        [data-theme="dark"] .field textarea::placeholder{
            color: #94a3b8;
        }

        .fullwidth{grid-column: 1 / -1}
        .dynamic-ref-field{animation: slideDown .22s ease-out}

        /* ================================================================
           DETAIL VIEW
           ================================================================ */
        .details-grid{
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1rem;
            padding: 1.4rem;
        }
        .detail-card{
            background: #fff;
            border-radius: 14px;
            padding: 1rem 1.2rem;
            border: 1px solid var(--border-color);
            transition: transform var(--transition-fast), box-shadow var(--transition-fast);
            contain: layout style;
        }
        .detail-card:hover{
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary);
        }

function readMyAccountSession(key) {
    try {
        const rawLocal = localStorage.getItem(key);
        if (rawLocal) {
            const parsed = JSON.parse(rawLocal);
            if (parsed && typeof parsed === 'object' && 'value' in parsed) {
                if (parsed.expiry && Date.now() >= parsed.expiry) {
                    localStorage.removeItem(key);
                    return null;
                }
                return parsed.value;
            }
            return parsed;
        }
    } catch (e) {}
    try {
        const rawSession = sessionStorage.getItem(key);
        if (rawSession) return JSON.parse(rawSession);
    } catch (e) {}
    return null;
}

function checkAdminAuth() {
    const userType = readMyAccountSession('Universal_user_type');
    const user     = readMyAccountSession('Universal_user');
    const expiry   = readMyAccountSession('Universal_session_expiry');

    if (!userType || !user) return { ok: false, reason: 'no-session' };
    if (userType !== 'admin') return { ok: false, reason: 'not-admin', userType };
    if (expiry && typeof expiry === 'number' && Date.now() >= expiry) {
        ['Universal_user','Universal_user_data','Universal_user_type',
         'Universal_remember_me','Universal_session_expiry'].forEach(k => {
            localStorage.removeItem(k);
            sessionStorage.removeItem(k);
        });
        return { ok: false, reason: 'expired' };
    }
    return { ok: true, userType, user };
}

function redirectToMyAccount(reason) {
    console.warn('🔒 Admin auth failed:', reason);
    const url = '../../Study Material/My Account/myaccount.html';
    try {
        if (window.top && window.top !== window) window.top.location.href = url;
        else window.location.href = url;
    } catch (e) { window.location.href = url; }
}

function updateAdminBadge() {
    const userData = readMyAccountSession('Universal_user_data');
    const user = readMyAccountSession('Universal_user');
    const expiry = readMyAccountSession('Universal_session_expiry');

    const badge = document.getElementById('adminBadge');
    const nameDisplay = document.getElementById('adminNameDisplay');
    const indicator = document.getElementById('sessionIndicator');

    let displayName = 'Admin';
    if (userData) {
        if (userData['User Name']) displayName = userData['User Name'];
        else if (userData['Full Name']) displayName = userData['Full Name'];
        else if (userData['First Name']) {
            displayName = (userData['First Name'] + ' ' + (userData['Last Name'] || '')).trim();
        }
    } else if (user) displayName = user;

    if (nameDisplay) nameDisplay.textContent = displayName;
    if (badge) badge.classList.add('visible');

    if (indicator) {
        const isRememberMe = !!expiry && (expiry - Date.now()) > 60000;
        if (isRememberMe) {
            const remaining = expiry - Date.now();
            const days = Math.floor(remaining / (24 * 60 * 60 * 1000));
            const hours = Math.floor((remaining % (24 * 60 * 60 * 1000)) / (60 * 60 * 1000));
            indicator.textContent = days > 0 ? `🔒 ${days}d ${hours}h` : `🔒 ${hours}h`;
            indicator.style.background = 'rgba(16,185,129,0.3)';
            indicator.style.color = '#34d399';
        } else {
            indicator.textContent = 'Session';
            indicator.style.background = 'rgba(255,255,255,0.15)';
            indicator.style.color = '';
        }
    }
}

function revealMainContent() {
    const main = document.getElementById('mainContent');
    const loading = document.getElementById('authLoading');
    if (loading) loading.classList.add('hidden');
    if (main) {
        main.style.display = 'block';
        main.classList.add('visible');
    }
}

function showAccessDeniedAndRedirect(reason) {
    const loadingEl = document.getElementById('authLoading');
    if (loadingEl) {
        loadingEl.innerHTML = `
            <div style="text-align:center;padding:2rem;">
                <div style="font-size:3rem;color:#ef4444;margin-bottom:1rem;">🔒</div>
                <h2 style="color:inherit;margin-bottom:.5rem;">Admin Access Required</h2>
                <p style="color:inherit;opacity:.7;font-size:.9rem;margin-bottom:1.5rem;">
                    ${reason === 'not-admin'
                        ? 'You are logged in as a student. Please login as admin.'
                        : reason === 'expired'
                        ? 'Your session has expired. Please login again.'
                        : 'Please login as admin to access this page.'}
                </p>
                <div class="spinner" style="margin:0 auto;"></div>
                <p style="opacity:.6;font-size:.8rem;margin-top:1rem;">Redirecting to My Account...</p>
            </div>`;
    }
    setTimeout(() => redirectToMyAccount(reason), 1500);
}

function gateAdminAccess(onAuthorized) {
    const mainEl = document.getElementById('mainContent');
    const loadingEl = document.getElementById('authLoading');
    const alreadyRevealed = mainEl && (mainEl.style.display === 'block' || mainEl.classList.contains('visible'));
    const loadingHidden = loadingEl && loadingEl.classList.contains('hidden');

    if (alreadyRevealed || loadingHidden) { onAuthorized(); return; }

    const auth = checkAdminAuth();
    if (auth.ok) {
        revealMainContent();
        onAuthorized();
    } else {
        showAccessDeniedAndRedirect(auth.reason);
    }
}

/* [OPT] Fast HTML escape using lookup table */
const HTML_ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const HTML_ESCAPE_REGEX = /[&<>"']/g;
function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str).replace(HTML_ESCAPE_REGEX, m => HTML_ESCAPES[m]);
}

/* [OPT] Toast — reuse same DOM node, no allocation */
function showToast(msg, type = 'info') {
    const box = document.getElementById('alertBox');
    const txt = document.getElementById('alertText');
    const icon = box.firstElementChild;
    if (!box || !txt) return;

    txt.textContent = msg;
    box.className = `alert-popup ${type} show`;

    const iconMap = {
        success: 'fa-check-circle',
        error: 'fa-exclamation-circle',
        warning: 'fa-exclamation-triangle',
        info: 'fa-info-circle'
    };
    icon.className = `fas ${iconMap[type] || iconMap.info}`;

    if (box._timeout) clearTimeout(box._timeout);
    box._timeout = setTimeout(() => box.classList.remove('show'), 3000);
}

function showModal(msg, title = "Notice", isConfirm = false, onConfirm = null, confirmText = "OK") {
    const modal = document.getElementById('globalModal');
    document.getElementById('modalTitle').innerHTML =
        `<i class="fas ${isConfirm ? 'fa-exclamation-triangle' : 'fa-info-circle'}" aria-hidden="true"></i> ${title}`;
    document.getElementById('modalMsg').innerHTML = msg;
    const confirmBtn = document.getElementById('confirmModalBtn');
    const cancelBtn = document.getElementById('cancelModalBtn');

    if (isConfirm) {

        cancelBtn.onclick = () => modal.classList.remove('active');
    } else {
        cancelBtn.style.display = 'none';

    confirmBtn.onclick = () => {
        modal.classList.remove('active');
        if (isConfirm && onConfirm) onConfirm();

    modal.classList.add('active');
}

/* [OPT] Debounce — generic wrapper for input handlers */
function debounce(fn, wait = 250) {
    let timer = null;
    return function(...args) {
        if (timer) clearTimeout(timer);
        timer = setTimeout(() => { timer = null; fn.apply(this, args); }, wait);
    };
}

function showSpinner(el, show, customHtml = null) {
    if (!el) return;
    if (show) {
        el.disabled = true;
        if (!el.hasAttribute('data-original')) el.setAttribute('data-original', el.innerHTML);
        el.innerHTML = customHtml || '<span style="display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.6s linear infinite;"></span>';
    } else {

        if (orig) { el.innerHTML = orig; el.removeAttribute('data-original'); }

}

function getCache() {
    try {
        const raw = sessionStorage.getItem(CACHE_KEY);
        if (!raw) return null;
        const { data, ts } = JSON.parse(raw);
        if (Date.now() - ts > CACHE_TTL) {
            sessionStorage.removeItem(CACHE_KEY);
            return null;
        }
        return data;
    } catch (e) { return null; }
}

function setCache(data) {
    try {
        sessionStorage.setItem(CACHE_KEY, JSON.stringify({ data, ts: Date.now() }));
    } catch (e) {
        try { sessionStorage.removeItem(CACHE_KEY); } catch (_) {}
    }
}

function invalidateCache() {
    try { sessionStorage.removeItem(CACHE_KEY); } catch (e) {}
}

    document.getElementById('page1').style.display = 'none';
    document.getElementById('page2').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'instant' });
}

/* =====================================================================
   SECTION 8 — SKELETON LOADER
   ===================================================================== */

function renderSkeleton(rows = 5) {
    let html = '';
    for (let i = 0; i < rows; i++) {
        const w1 = i % 2 ? 'md' : 'sm';
        const w2 = i % 2 ? 'lg' : 'md';
        html += `<tr class="skeleton-row">` +
            `<td><div class="skeleton sm"></div></td>` +
            `<td><div class="skeleton ${w2}"></div></td>` +
            `<td><div class="skeleton ${w1}"></div></td>` +
            `<td><div class="skeleton sm"></div></td>` +
            `</tr>`;
    }
    return html;
}

/* =====================================================================
   SECTION 9 — DATA FETCHING (Promise.all, AbortController, Cache)
   ===================================================================== */

async function loadExpenses(options = {}) {
    const { forceRefresh = false, silent = false } = options;
    if (isFetching && !forceRefresh) return;

    const tbody = document.getElementById('tableBody');

    /* [OPT] Serve from cache instantly */
    if (!forceRefresh) {
        const cached = getCache();
        if (cached && Array.isArray(cached) && cached.length >= 0) {
            allExpenses = cached.map((item, idx) => ({ ...item, _rowIndex: idx + 2 }));
            renderTable();
            lastFetchTime = Date.now();
            scheduleIdle(() => silentRefresh());
            return;
        }
    }

    if (!silent) tbody.innerHTML = renderSkeleton(6);

    isFetching = true;

    /* [OPT] Abort previous in-flight request */
    if (activeFetchController) activeFetchController.abort();
    activeFetchController = new AbortController();

    try {
        const url = `${SCRIPT_URL}?spreadsheetId=${SPREADSHEET_ID}&sheetName=${encodeURIComponent(SHEET_NAME)}&_=${Date.now()}`;
        const response = await fetch(url, {
            signal: activeFetchController.signal,
            cache: 'default'
        });
        const result = await response.json();

        if (result.status === 'success' && Array.isArray(result.data)) {
            allExpenses = result.data.map((item, idx) => ({ ...item, _rowIndex: idx + 2 }));
            setCache(result.data);
            lastFetchTime = Date.now();
            renderTable();
        } else {
            throw new Error(result.message || 'Failed to load data');
        }
    } catch (err) {
        if (err.name === 'AbortError') { isFetching = false; return; }
        console.error('Load error:', err);
        tbody.innerHTML = `
            <tr><td colspan="4">
                <div class="empty-state">
                    <i class="fas fa-exclamation-triangle" style="color:#ef4444;"></i>
                    <p>Failed to load expenses records</p>
                    <p class="sub-text">${escapeHtml(err.message)}</p>
                    <button class="btn btn-primary btn-sm" data-retry="1" style="margin-top:12px;">
                        <i class="fas fa-redo"></i> Retry
                    </button>
                </div>
            </td></tr>`;
        if (!silent) showToast('❌ Failed to load expenses records', 'error');
    } finally {
        isFetching = false;
    }
}

/* [OPT] Silent background refresh — no UI flicker, updates only if changed */
async function silentRefresh() {
    if (isFetching) return;
    if (Date.now() - lastFetchTime < CACHE_TTL) return;
    try {
        const url = `${SCRIPT_URL}?spreadsheetId=${SPREADSHEET_ID}&sheetName=${encodeURIComponent(SHEET_NAME)}&_=${Date.now()}`;
        const response = await fetch(url);
        const result = await response.json();
        if (result.status === 'success' && Array.isArray(result.data)) {
            const newHash = JSON.stringify(result.data);
            const oldHash = JSON.stringify(allExpenses.map(i => {
                const { _rowIndex, ...rest } = i;
                return rest;
            }));
            if (newHash !== oldHash) {
                allExpenses = result.data.map((item, idx) => ({ ...item, _rowIndex: idx + 2 }));
                setCache(result.data);
                renderTable();
                lastFetchTime = Date.now();
                console.log('🔄 Background refresh updated expenses data');
            } else {
                lastFetchTime = Date.now();
            }
        }
    } catch (err) {
        console.log('Background refresh skipped:', err.message);
    }
}

/* =====================================================================
   SECTION 10 — TABLE RENDERING (DOM as strings, RAF-coalesced)
   ===================================================================== */

/* [OPT] Pre-computed Intl formatter — reused across all rows */
const INR_FORMATTER = new Intl.NumberFormat('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

let renderRafHandle = null;
let pendingFilter = '';

/* [OPT] Coalesce multiple renders into one RAF frame */
function scheduleRender(filter = '') {
    pendingFilter = filter;
    if (renderRafHandle) return;
    renderRafHandle = requestAnimationFrame(() => {
        renderRafHandle = null;
        renderTable(pendingFilter);
    });
}

function renderTable(filter = '') {
    const tbody = document.getElementById('tableBody');
    const searchLower = filter.toLowerCase().trim();

    let filtered = allExpenses;
    if (searchLower) {
        filtered = allExpenses.filter(item => {
            const expensesName = String(item['Expenses Name'] || '').toLowerCase();
            const partyName = String(item['Party Name'] || '').toLowerCase();
            const mobile = String(item['Mobile No'] || '').toLowerCase();
            return expensesName.indexOf(searchLower) !== -1 ||
                   partyName.indexOf(searchLower) !== -1 ||
                   mobile.indexOf(searchLower) !== -1;
        });
    }

    if (!filtered.length) {
        tbody.innerHTML = `
            <tr><td colspan="4">
                <div class="empty-state">
                    <i class="fas fa-file-invoice-dollar"></i>
                    <p>${searchLower ? 'No matching records found' : 'No expenses records yet'}</p>
                    <p class="sub-text">${searchLower ? 'Try a different search' : 'Click "Add Expenses" to create one'}</p>
                </div>
            </td></tr>`;
        return;
    }

    /* [OPT] Build entire table body as one string */
    const rows = new Array(filtered.length);
    for (let i = 0; i < filtered.length; i++) {
        const item = filtered[i];
        const srNo = item['Sr. No'] || (i + 1);
        const expensesName = item['Expenses Name'] || '—';
        const amount = parseFloat(item['Amount'] || 0) || 0;
        const actualIndex = allExpenses.indexOf(item);

        rows[i] =
            `<tr>` +
            `<td class="sr-col">${escapeHtml(srNo)}</td>` +
            `<td>${escapeHtml(expensesName)}</td>` +
            `<td class="amount-col">₹${INR_FORMATTER.format(amount)}</td>` +
            `<td class="action-col">` +
                `<button class="view-action-btn" data-srno="${escapeHtml(srNo)}" data-index="${actualIndex}">` +
                    `<i class="fas fa-eye" aria-hidden="true"></i> View` +
                `</button>` +
            `</td>` +
            `</tr>`;
    }
    tbody.innerHTML = rows.join('');
}

/* =====================================================================
   SECTION 11 — DETAIL VIEW (DOM as strings)
   ===================================================================== */

function showDetailView(item) {
    const mode = item['Mode'] || '';
    const amount = parseFloat(item['Amount'] || 0) || 0;

    const cards = [];

    cards.push(cardHtml('Sr. No', item['Sr. No'] || '—'));
    cards.push(cardHtml('Expenses Name', item['Expenses Name'] || '—'));
    cards.push(cardHtml('Party Name', item['Party Name'] || '—'));
    cards.push(cardHtml('Mobile No', item['Mobile No'] || '—'));
    cards.push(cardHtml('Mode', mode || '—'));
    cards.push(cardHtml('Amount', `₹${INR_FORMATTER.format(amount)}`));

    /* Dynamic reference field */
    if (mode === 'Bank Transfer' && item['Bank Transfer Ref No']) {
        cards.push(cardHtml('Bank Transfer Ref No', item['Bank Transfer Ref No']));
    } else if (mode === 'UPI' && item['UPI Ref No']) {
        cards.push(cardHtml('UPI Ref No', item['UPI Ref No']));
    } else if (mode === 'Cheque' && item['Cheque No']) {
        cards.push(cardHtml('Cheque No', item['Cheque No']));
    }

    cards.push(cardHtml('Note', item['Note'] || '—', true));

    document.getElementById('detailsContainer').innerHTML = cards.join('');
    showPage2();
}

function cardHtml(label, value, fullwidth = false) {
    return `<div class="detail-card${fullwidth ? ' fullwidth' : ''}">` +
        `<div class="detail-label">${escapeHtml(label)}</div>` +
        `<div class="detail-value">${escapeHtml(String(value))}</div>` +
        `</div>`;
}

/* =====================================================================
   SECTION 12 — FORM BUILDER
   ===================================================================== */

function buildFormHtml(item = null, isEdit = false) {
    const def = {
        'Expenses Name': '', 'Party Name': '', 'Mobile No': '', 'Mode': '',
        'Bank Transfer Ref No': '', 'UPI Ref No': '', 'Cheque No': '',
        'Amount': '', 'Note': ''
    };

    if (item) {
        for (const k in def) {
            if (item[k] !== undefined) def[k] = item[k];
        }
    }

    const mode = def['Mode'];

    return `<form id="expensesForm" novalidate>
        <div class="form-grid">

            <div class="field">
                <label for="fExpensesName">Expenses Name</label>
                <input type="text" id="fExpensesName" value="${escapeHtml(def['Expenses Name'])}"
                       placeholder="e.g., Electricity Bill, Rent, Stationery" autocomplete="off">
            </div>

            <div class="field">
                <label for="fPartyName">Party Name</label>
                <input type="text" id="fPartyName" value="${escapeHtml(def['Party Name'])}"
                       placeholder="e.g., Ram Sharma, ABC Store" autocomplete="off">
            </div>

            <div class="field">
                <label for="fMobileNo">Mobile No</label>
                <input type="tel" id="fMobileNo" value="${escapeHtml(def['Mobile No'])}"
                       maxlength="10" pattern="[6-9][0-9]{9}"
                       placeholder="10-digit starting with 6-9" autocomplete="off" inputmode="numeric">
                <small style="color:var(--text-light);font-size:.7rem;">
                    Optional. Must be 10 digits starting with 6, 7, 8 or 9.
                </small>
            </div>

            <div class="field">
                <label for="fMode">Mode</label>
                <select id="fMode">
                    <option value="">Select Mode</option>
                    <option value="Cash" ${mode === 'Cash' ? 'selected' : ''}>Cash</option>
                    <option value="Bank Transfer" ${mode === 'Bank Transfer' ? 'selected' : ''}>Bank Transfer</option>
                    <option value="UPI" ${mode === 'UPI' ? 'selected' : ''}>UPI</option>
                    <option value="Cheque" ${mode === 'Cheque' ? 'selected' : ''}>Cheque</option>
                </select>
            </div>

            <div class="field fullwidth" id="dynamicRefContainer"></div>

            <div class="field">
                <label for="fAmount">Amount (₹)</label>
                <input type="number" id="fAmount" value="${escapeHtml(def['Amount'])}"
                       min="0" step="0.01" placeholder="0.00" autocomplete="off" inputmode="decimal">
            </div>

            <div class="field fullwidth">
                <label for="fNote">Note</label>
                <textarea id="fNote" rows="3" placeholder="Additional notes or remarks...">${escapeHtml(def['Note'])}</textarea>
            </div>

        </div>

        <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:1.4rem;padding-top:1rem;border-top:1px solid var(--border-color);flex-wrap:wrap;">
            <button type="button" id="cancelFormBtn" class="btn btn-outline">Cancel</button>
            <button type="submit" id="saveFormBtn" class="btn btn-primary">
                <i class="fas fa-save" aria-hidden="true"></i> ${isEdit ? 'Update Expenses' : 'Save Expenses'}
            </button>
        </div>
    </form>`;
}

function renderDynamicRefField(mode, currentValue = '') {
    const container = document.getElementById('dynamicRefContainer');
    if (!container) return;

    let html = '';
    if (mode === 'Bank Transfer') {
        html = `<div class="dynamic-ref-field">
            <label style="color:#2563eb;" for="fBankRefNo">Bank Transfer Ref No</label>
            <input type="text" id="fBankRefNo" value="${escapeHtml(currentValue)}"
                   placeholder="Enter bank transfer reference / UTR no">
        </div>`;
    } else if (mode === 'UPI') {
        html = `<div class="dynamic-ref-field">
            <label style="color:#2563eb;" for="fUpiRefNo">UPI Ref No</label>
            <input type="text" id="fUpiRefNo" value="${escapeHtml(currentValue)}"
                   placeholder="Enter UPI transaction ref no">
        </div>`;
    } else if (mode === 'Cheque') {
        html = `<div class="dynamic-ref-field">
            <label style="color:#2563eb;" for="fChequeNo">Cheque No</label>
            <input type="text" id="fChequeNo" value="${escapeHtml(currentValue)}"
                   placeholder="Enter cheque number">
        </div>`;
    }
    container.innerHTML = html;
}

/* =====================================================================
   SECTION 13 — MODAL OPEN
   ===================================================================== */

function openAddModal() {
    const body = document.getElementById('formModalBody');
    document.getElementById('formModalTitle').innerHTML = '<i class="fas fa-plus" aria-hidden="true"></i> Add New Expenses';
    body.innerHTML = buildFormHtml(null, false);

    document.getElementById('fMode').addEventListener('change', function() {
        renderDynamicRefField(this.value);
    });

    bindFormEvents(false, null);
    document.getElementById('formModal').classList.add('active');

    requestAnimationFrame(() => document.getElementById('fExpensesName')?.focus());
}

function openEditModal() {
    if (!currentViewItem) { showToast('❌ No record selected', 'error'); return; }

    const body = document.getElementById('formModalBody');
    document.getElementById('formModalTitle').innerHTML = '<i class="fas fa-edit" aria-hidden="true"></i> Edit Expenses';
    body.innerHTML = buildFormHtml(currentViewItem, true);

    const mode = currentViewItem['Mode'] || '';
    let currentRefValue = '';
    if (mode === 'Bank Transfer') currentRefValue = currentViewItem['Bank Transfer Ref No'] || '';
    else if (mode === 'UPI') currentRefValue = currentViewItem['UPI Ref No'] || '';
    else if (mode === 'Cheque') currentRefValue = currentViewItem['Cheque No'] || '';
    renderDynamicRefField(mode, currentRefValue);

    document.getElementById('fMode').addEventListener('change', function() {
        renderDynamicRefField(this.value);
    });

    bindFormEvents(true, currentViewRowIndex);
    document.getElementById('formModal').classList.add('active');

    requestAnimationFrame(() => document.getElementById('fExpensesName')?.focus());
}

/* =====================================================================
   SECTION 14 — FORM BINDINGS
   ===================================================================== */

function bindFormEvents(isEdit, rowIdx) {
    document.getElementById('cancelFormBtn')?.addEventListener('click', () => {
        document.getElementById('formModal').classList.remove('active');
    });

    document.getElementById('expensesForm')?.addEventListener('submit', (e) => {
        e.preventDefault();
        handleSubmit(e, isEdit, rowIdx);
    });

    /* [OPT] Debounced mobile input — strip non-digits, cap 10 */
    const mobileInput = document.getElementById('fMobileNo');
    if (mobileInput) {
        const sanitize = debounce(function() {
            const v = this.value.replace(/\D/g, '').slice(0, 10);
            if (v !== this.value) this.value = v;
        }, 100);
        mobileInput.addEventListener('input', sanitize);
    }
}

/* =====================================================================
   SECTION 15 — SUBMIT
   ===================================================================== */

async function handleSubmit(e, isEdit, rowIdx) {
    e.preventDefault();
    if (saveInProgress) return;

    const expensesName = document.getElementById('fExpensesName')?.value.trim() || '';
    const partyName = document.getElementById('fPartyName')?.value.trim() || '';
    const mobileNo = document.getElementById('fMobileNo')?.value.trim() || '';
    const mode = document.getElementById('fMode')?.value || '';
    const amount = document.getElementById('fAmount')?.value || '';
    const note = document.getElementById('fNote')?.value || '';

    if (mobileNo && !/^[6-9][0-9]{9}$/.test(mobileNo)) {
        showToast('⚠️ Mobile must be 10 digits starting with 6-9', 'warning');
        return;
    }
    if (amount !== '' && isNaN(parseFloat(amount))) {
        showToast('⚠️ Amount must be a valid number', 'warning');
        return;
    }

    let bankRefNo = '', upiRefNo = '', chequeNo = '';
    if (mode === 'Bank Transfer') bankRefNo = document.getElementById('fBankRefNo')?.value.trim() || '';
    else if (mode === 'UPI') upiRefNo = document.getElementById('fUpiRefNo')?.value.trim() || '';
    else if (mode === 'Cheque') chequeNo = document.getElementById('fChequeNo')?.value.trim() || '';

    saveInProgress = true;
    const saveBtn = document.getElementById('saveFormBtn');
    showSpinner(saveBtn, true);

    try {
        const params = new URLSearchParams();
        params.append('action', isEdit ? 'update' : 'insert');
        params.append('spreadsheetId', SPREADSHEET_ID);
        params.append('sheetName', SHEET_NAME);
        if (isEdit && rowIdx) params.append('rowIndex', rowIdx);
        params.append('Expenses Name', expensesName);
        params.append('Party Name', partyName);
        params.append('Mobile No', mobileNo);
        params.append('Mode', mode);
        params.append('Bank Transfer Ref No', bankRefNo);
        params.append('UPI Ref No', upiRefNo);
        params.append('Cheque No', chequeNo);
        params.append('Amount', amount);
        params.append('Note', note);

        const response = await fetch(SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: params.toString()
        });
        const result = await response.json();

        if (result.status === 'success') {
            invalidateCache();
            showToast(`✅ Expenses ${isEdit ? 'updated' : 'saved'} successfully!`, 'success');
            document.getElementById('formModal').classList.remove('active');
            await loadExpenses({ forceRefresh: true });
            if (isEdit) showPage1();
        } else {
            throw new Error(result.message || 'Unknown error');
        }
    } catch (err) {
        console.error('Submit error:', err);
        showToast('❌ ' + err.message, 'error');
    } finally {
        saveInProgress = false;
        showSpinner(saveBtn, false);
    }
}

/* =====================================================================
   SECTION 16 — DELETE
   ===================================================================== */

function deleteExpenses() {
    if (!currentViewItem || !currentViewRowIndex) {
        showToast('❌ No record selected', 'error'); return;
    }

    const name = currentViewItem['Expenses Name'] || 'this record';
    const amount = parseFloat(currentViewItem['Amount'] || 0) || 0;

    showModal(
        `Are you sure you want to delete <strong>${escapeHtml(name)}</strong>` +
        (amount ? ` (₹${INR_FORMATTER.format(amount)})` : '') +
        `?<br><br>This action cannot be undone.`,
        'Confirm Delete',
        true,
        async () => {
            const btn = document.getElementById('deleteFromDetailBtn');
            showSpinner(btn, true);
            try {
                const params = new URLSearchParams();
                params.append('action', 'delete');
                params.append('spreadsheetId', SPREADSHEET_ID);
                params.append('sheetName', SHEET_NAME);
                params.append('rowIndex', currentViewRowIndex);

                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: params.toString()
                });
                const result = await response.json();

                if (result.status === 'success') {
                    invalidateCache();
                    showToast('✅ Expenses record deleted!', 'success');
                    currentViewItem = null;
                    currentViewRowIndex = null;
                    await loadExpenses({ forceRefresh: true });
                    showPage1();
                } else {
                    throw new Error(result.message || 'Unknown error');
                }
            } catch (err) {
                console.error('Delete error:', err);
                showToast('❌ Delete failed: ' + err.message, 'error');
            } finally {
                showSpinner(btn, false);
            }
        },
        'Delete'
    );
}

/* =====================================================================
   SECTION 17 — EVENT DELEGATION
   ===================================================================== */

function handleTableClick(e) {
    const btn = e.target.closest('.view-action-btn');
    if (!btn) {
        const retry = e.target.closest('[data-retry]');
        if (retry) loadExpenses({ forceRefresh: true });
        return;
    }

    const srNo = btn.getAttribute('data-srno');
    const index = parseInt(btn.getAttribute('data-index'), 10);

    let found = null;
    if (srNo) found = allExpenses.find(item => String(item['Sr. No']) === String(srNo));
    if (!found && !isNaN(index) && index >= 0 && index < allExpenses.length) {
        found = allExpenses[index];
    }

    if (found) {
        currentViewItem = found;
        currentViewRowIndex = found._rowIndex;
        showDetailView(found);
    } else {
        showToast('❌ Record not found', 'error');
    }
}

/* =====================================================================
   SECTION 18 — AUTO BACKGROUND UPDATE
   ===================================================================== */

function startAutoRefresh() {
    if (autoRefreshTimer) clearInterval(autoRefreshTimer);
    autoRefreshTimer = setInterval(() => {
        if (document.visibilityState === 'visible') {
            silentRefresh();
        }
    }, AUTO_REFRESH_INTERVAL);
}

function stopAutoRefresh() {
    if (autoRefreshTimer) {
        clearInterval(autoRefreshTimer);
        autoRefreshTimer = null;
    }
}

/* [OPT] Pause/resume auto-refresh based on tab visibility */
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
        if (Date.now() - lastFetchTime > CACHE_TTL) {
            scheduleIdle(() => silentRefresh());
        }
        startAutoRefresh();
    } else {
        stopAutoRefresh();
    }
});

/* =====================================================================
   SECTION 19 — INITIALIZATION
   ===================================================================== */

function initApp() {
    if (initDone) return;
    initDone = true;

    updateAdminBadge();

    /* ── Bind top-level buttons ── */
    const refreshBtn = document.getElementById('refreshBtn');
    const addNewBtn = document.getElementById('addNewBtn');
    const mobileRefreshBtn = document.getElementById('mobileRefreshBtn');
    const mobileAddBtn = document.getElementById('mobileAddBtn');

    const doRefresh = async (btn) => {
        showSpinner(btn, true);
        invalidateCache();
        await loadExpenses({ forceRefresh: true, silent: true });
        showSpinner(btn, false);
        showToast('🔄 Data refreshed', 'success');
    };

    refreshBtn?.addEventListener('click', () => doRefresh(refreshBtn));
    mobileRefreshBtn?.addEventListener('click', () => doRefresh(mobileRefreshBtn));

    addNewBtn?.addEventListener('click', openAddModal);
    mobileAddBtn?.addEventListener('click', openAddModal);

    /* ── Detail page buttons ── */
    document.getElementById('backToPage1Btn')?.addEventListener('click', showPage1);
    document.getElementById('editFromDetailBtn')?.addEventListener('click', openEditModal);
    document.getElementById('deleteFromDetailBtn')?.addEventListener('click', deleteExpenses);

    /* ── Modal close buttons ── */
    document.getElementById('closeFormModalBtn')?.addEventListener('click', () => {
        document.getElementById('formModal').classList.remove('active');
    });
    document.getElementById('closeGlobalModal')?.addEventListener('click', () => {
        document.getElementById('globalModal').classList.remove('active');
    });

    /* [OPT] Modal overlay click — single delegated listener */
    document.addEventListener('click', (e) => {
        if (e.target.classList && e.target.classList.contains('modal-overlay')) {
            e.target.classList.remove('active');
        }
    });

    /* ── Table click delegation ── */
    document.getElementById('tableBody')?.addEventListener('click', handleTableClick);

    /* [OPT] Debounced search input */
    const searchInput = document.getElementById('searchInput');
    if (searchInput) {
        searchInput.addEventListener('input', debounce(function() {
            scheduleRender(this.value);
        }, 250));
    }

    /* ── Keyboard shortcuts ── */
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            document.querySelectorAll('.modal-overlay.active').forEach(m => {
                m.classList.remove('active');
            });
        }
    });

    /* ── Cross-tab theme/session sync ── */
    window.addEventListener('storage', (e) => {
        if (e.key === 'user-theme-preference') syncThemeWithParent();
        if (e.key && e.key.indexOf('Universal_') === 0) updateAdminBadge();
    });

    /* ── Initial data load ── */
    loadExpenses();

    /* ── Start auto background updater ── */
    startAutoRefresh();

    console.log('✅ Expenses Management System ready');
    console.log('   ⚡ Auto-refresh: every 5 min (paused when tab hidden)');
    console.log('   💾 Cache TTL: 5 min');
}

/* =====================================================================
   SECTION 20 — BOOTSTRAP WITH AUTH GATE
   ===================================================================== */

function bootstrap() {
    syncThemeWithParent();
    setTimeout(() => {
        gateAdminAccess(() => initApp());
    }, 400);

    /* Failsafe redirect */
    setTimeout(() => {
        const mainEl = document.getElementById('mainContent');
        const stillHidden = !mainEl || (mainEl.style.display === 'none' && !mainEl.classList.contains('visible'));
        const loadingHidden = document.getElementById('authLoading')?.classList.contains('hidden');
        if (stillHidden && !loadingHidden) {
            const auth = checkAdminAuth();
            if (!auth.ok) redirectToMyAccount(auth.reason);
        }
    }, 5000);
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bootstrap);
} else {
    bootstrap();
}

/* =====================================================================
   SECTION 21 — WINDOW EXPORTS
   ===================================================================== */

window.expensesApp = {
    loadExpenses,
    openAddModal,
    openEditModal,
    invalidateCache,
    silentRefresh
};

console.log('✅ expenses.html script initialised (optimized, auth-gated)');

})();
</script>
