function showDetailView(record) {
    if (!record) {
        showToast('❌ No record to display', 'error');
        return;
    }

    dom.detailStudentName.textContent = record['Student Name'] || 'Student Marks';
    const container = dom.detailContainer;
    container.innerHTML = '';

    const std = record['Std'] || '';
    const studentName = record['Student Name'] || 'Student';
    const dateStr = formatDate(record['Date']);
    const testNameStr = record['Test Name'] || '—';
    const subjectNameStr = record['Subject Name'] || '—';
    const assignTeacherStr = record['Assign Teacher'] || '—';
    const obtainStr = record['Obtain Marks'] || '—';
    const totalStr  = record['Total Marks'] || '—';
    const percentageStr = record['Percentage'] || record['Percentage (%)'] || '';
    const statusStr = record['Status'] || '';

    const obtainNum = parseFloat(obtainStr) || 0;
    const totalNum  = parseFloat(totalStr)  || 0;
    const storedPct = String(percentageStr || '').replace(/%/g, '').trim();
    const storedStatus = String(statusStr).trim();
    const storedRemarks = record['Remarks'] || '';

    const pct = storedPct || ((totalNum > 0) ? ((obtainNum / totalNum) * 100).toFixed(2) : '');
    const status = storedStatus || ((totalNum > 0) ? (parseFloat(pct) >= 40 ? 'Pass' : 'Fail') : '');
    const statusLower = status.toLowerCase();
    const statusClassHero = statusLower === 'pass' ? 'pass-bg' : (statusLower === 'fail' ? 'fail-bg' : '');

    const hero = document.createElement('div');
    hero.className = 'detail-hero';
    hero.innerHTML = `
        <div class="detail-hero-left">
            <div class="name">${escapeHtml(studentName)}</div>
            <div class="meta">
                <span><i class="fas fa-calendar"></i> ${escapeHtml(dateStr)}</span>
                <span><i class="fas fa-graduation-cap"></i> ${escapeHtml(stdDisplayName(std))}</span>
                ${subjectNameStr && subjectNameStr !== '—' ? `<span><i class="fas fa-book"></i> ${escapeHtml(subjectNameStr)}</span>` : ''}
                ${testNameStr && testNameStr !== '—' ? `<span><i class="fas fa-file-alt"></i> ${escapeHtml(testNameStr)}</span>` : ''}
            </div>
        </div>
        <div class="detail-hero-right">
            ${!isValueEmpty(obtainStr) ? `
                <div class="hero-stat highlight">
                    <div class="label">Obtained</div>
                    <div class="value">${escapeHtml(String(obtainStr))}<span style="font-size:.7em;opacity:.75;"> / ${escapeHtml(String(totalStr))}</span></div>
                </div>` : ''}
            ${pct ? `
                <div class="hero-stat highlight">
                    <div class="label">Percentage</div>
                    <div class="value">${pct}%</div>
                </div>` : ''}
            ${status ? `
                <div class="hero-stat ${statusClassHero}">
                    <div class="label">Status</div>
                    <div class="value">${escapeHtml(status)}</div>
                </div>` : ''}
        </div>
    `;
    container.appendChild(hero);

    const personalTiles = [];
    personalTiles.push(infoTile('Student Name', studentName));
    if (!isValueEmpty(std)) personalTiles.push(infoTile('Standard', stdDisplayName(std)));
    if (!isValueEmpty(dateStr) && dateStr !== '—') personalTiles.push(infoTile('Exam Date', dateStr));
    if (!isValueEmpty(subjectNameStr) && subjectNameStr !== '—') personalTiles.push(infoTile('Subject Name', subjectNameStr));
    if (!isValueEmpty(testNameStr) && testNameStr !== '—') personalTiles.push(infoTile('Test Name', testNameStr));
    if (!isValueEmpty(assignTeacherStr) && assignTeacherStr !== '—') personalTiles.push(infoTile('Assign Teacher', assignTeacherStr));
    if (status) personalTiles.push(infoTile('Status', status));

    const secPersonal = document.createElement('div');
    secPersonal.className = 'detail-section';
    secPersonal.innerHTML = `
        <div class="detail-section-header">
            <i class="fas fa-user"></i>
            Personal Information
        </div>
        <div class="detail-section-body">
            ${personalTiles.join('')}
        </div>
    `;
    container.appendChild(secPersonal);

    const resultTiles = [];
    if (!isValueEmpty(obtainStr)) resultTiles.push(infoTile('Obtain Marks', obtainStr, 'highlight'));
    if (!isValueEmpty(totalStr))  resultTiles.push(infoTile('Total Marks', totalStr, 'highlight'));
    if (pct)                       resultTiles.push(infoTile('Percentage', pct + '%', 'highlight'));
    if (status)                    resultTiles.push(infoTile('Final Status', status, 'highlight'));
    if (storedRemarks && String(storedRemarks).trim()) {
        resultTiles.push(infoTile('Remarks', storedRemarks, 'remark-tile'));
    }

    if (resultTiles.length > 0) {
        const secResult = document.createElement('div');
        secResult.className = 'detail-section';
        secResult.innerHTML = `
            <div class="detail-section-header">
                <i class="fas fa-award"></i>
                Result Summary & Remarks
            </div>
            <div class="detail-section-body">
                ${resultTiles.join('')}
            </div>
        `;
        container.appendChild(secResult);
    }

    dom.page1.classList.remove('active-page');
    dom.page2.classList.add('active-page');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

                    probe2.src = fallback;
                } else {
                    photoEl.style.display = 'none';

            };
            probe.src = photoUrl;
        } else {
            photoEl.style.display = 'none';

function printResult() {
    const sheet = document.getElementById('printResultSheet');
    if (!sheet) {
        showToast('❌ Nothing to print', 'error');
        return;
    }

    const oldFrame = document.getElementById('printResultFrame');
    if (oldFrame) oldFrame.remove();

    const iframe = document.createElement('iframe');
    iframe.id = 'printResultFrame';
    iframe.style.position = 'fixed';
    iframe.style.right = '0';
    iframe.style.bottom = '0';
    iframe.style.width = '0';
    iframe.style.height = '0';
    iframe.style.border = '0';
    iframe.style.visibility = 'hidden';
    document.body.appendChild(iframe);

    const doc = iframe.contentWindow.document;
    const printStyles = getPrintResultStyles();

    doc.open();
    doc.write(`
        <!DOCTYPE html>
        <html>
        <head>
            <meta charset="UTF-8">
            <title>Result - ${escapeHtml(currentViewRecord?.['Student Name'] || 'Student')}</title>
            <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
            <style>${printStyles}</style>
        </head>
        <body class="pr-print-body">
            ${sheet.outerHTML}
        </body>
        </html>
    `);
    doc.close();

    // ✅ Wait for all <img> inside the iframe to finish loading
    const waitForImages = () => {
        return new Promise((resolve) => {
            const images = Array.from(iframe.contentDocument.querySelectorAll('img'));
            if (images.length === 0) return resolve();

            let loadedCount = 0;
            const total = images.length;
            let resolved = false;

            const done = () => {
                if (resolved) return;
                resolved = true;
                resolve();
            };

            const safetyTimeout = setTimeout(() => {
                console.warn('⚠️ Print image wait timed out — printing anyway');
                done();
            }, 4000);

            images.forEach(img => {
                if (img.complete && img.naturalWidth > 0) {
                    loadedCount++;
                    if (loadedCount === total) {
                        clearTimeout(safetyTimeout);
                        done();
                    }
                } else {
                    const onDone = () => {
                        loadedCount++;
                        if (loadedCount === total) {
                            clearTimeout(safetyTimeout);
                            done();
                        }
                    };
                    img.addEventListener('load', onDone, { once: true });
                    img.addEventListener('error', onDone, { once: true });
                }
            });
        });
    };

    Promise.resolve()
        .then(() => new Promise(r => setTimeout(r, 250)))
        .then(() => waitForImages())
        .then(() => new Promise(r => setTimeout(r, 200)))
        .then(() => {
            try {
                iframe.contentWindow.focus();
                iframe.contentWindow.print();
            } catch (e) {
                console.error('Print failed:', e);
                showToast('❌ Print failed. Try opening in a new tab.', 'error');
            } finally {
                setTimeout(() => {
                    if (iframe && iframe.parentNode) iframe.parentNode.removeChild(iframe);
                }, 2000);
            }
        });
}

            .pr-section-title, .pr-result-badge, .pr-remarks-box, .pr-photo-box, .pr-info-cell span {

// ================================================================
// SORT + FILTER EVENTS
// ================================================================
function setupToolbarEvents() {
    if (dom.sortSelect) {
        dom.sortSelect.addEventListener('change', (e) => {
            sortMode = e.target.value;
            if (dom.mobileSortSelect) dom.mobileSortSelect.value = sortMode;
            renderTable(dom.searchInput.value);
        });
    }
    if (dom.mobileSortSelect) {
        dom.mobileSortSelect.addEventListener('change', (e) => {
            sortMode = e.target.value;
            if (dom.sortSelect) dom.sortSelect.value = sortMode;
            renderTable(dom.searchInput.value);
        });
    }

    document.querySelectorAll('.filter-chip').forEach(chip => {
        chip.addEventListener('click', () => {
            const f = chip.getAttribute('data-filter');
            if (f === 'custom') {
                closeMobileFilterSheet();
                openDateRangeModal();
                return;
            }
            activeFilter = f;
            customFromDate = null;
            customToDate = null;
            setActiveFilterChip();
            closeMobileFilterSheet();
            renderTable(dom.searchInput.value);
        });
    });

    if (dom.clearFilterBtn) {
        dom.clearFilterBtn.addEventListener('click', () => {
            activeFilter = 'all';
            customFromDate = null;
            customToDate = null;
            setActiveFilterChip();
            renderTable(dom.searchInput.value);
        });
    }

    if (dom.mobileFilterBtn) {
        dom.mobileFilterBtn.addEventListener('click', openMobileFilterSheet);
    }
    if (dom.mobileFilterClose) {
        dom.mobileFilterClose.addEventListener('click', closeMobileFilterSheet);
    }
    if (dom.mobileFilterBackdrop) {
        dom.mobileFilterBackdrop.addEventListener('click', closeMobileFilterSheet);
    }
}

function openMobileFilterSheet() {
    if (dom.mobileFilterSheet) dom.mobileFilterSheet.classList.add('open');
    if (dom.mobileFilterBackdrop) dom.mobileFilterBackdrop.classList.add('open');
}
function closeMobileFilterSheet() {
    if (dom.mobileFilterSheet) dom.mobileFilterSheet.classList.remove('open');
    if (dom.mobileFilterBackdrop) dom.mobileFilterBackdrop.classList.remove('open');
}

function openDateRangeModal() {
    const today = new Date();
    const firstOfMonth = new Date(today.getFullYear(), today.getMonth(), 1);

    dom.fromDateInput.value = customFromDate
        ? formatToInputDate(new Date(customFromDate))
        : formatToInputDate(firstOfMonth);
    dom.toDateInput.value = customToDate
        ? formatToInputDate(new Date(customToDate))
        : formatToInputDate(today);

    dom.dateRangeModal.classList.add('active');
}

function applyDateRange() {
    const fromVal = dom.fromDateInput.value;
    const toVal = dom.toDateInput.value;

    if (!fromVal || !toVal) {
        showToast('❌ Please select both From and To dates', 'error');
        return;
    }
    if (new Date(fromVal) > new Date(toVal)) {
        showToast('❌ From date cannot be after To date', 'error');
        return;
    }

    customFromDate = fromVal;
    customToDate = toVal;
    activeFilter = 'custom';
    setActiveFilterChip();
    dom.dateRangeModal.classList.remove('active');
    renderTable(dom.searchInput.value);
    showToast(`📅 Filter applied: ${formatDate(fromVal)} → ${formatDate(toVal)}`, 'success');
}

function setupDateRangeQuickPicks() {
    document.querySelectorAll('.quick-pick').forEach(btn => {
        btn.addEventListener('click', () => {
            const today = new Date();
            let from = new Date();
            let to = new Date();

            const q = btn.getAttribute('data-quick');
            if (q === 'last7') {
                from.setDate(today.getDate() - 6);
            } else if (q === 'last30') {
                from.setDate(today.getDate() - 29);
            } else if (q === 'this-month') {
                from = new Date(today.getFullYear(), today.getMonth(), 1);
                to = new Date(today.getFullYear(), today.getMonth() + 1, 0);
            } else if (q === 'last-month') {
                from = new Date(today.getFullYear(), today.getMonth() - 1, 1);
                to = new Date(today.getFullYear(), today.getMonth(), 0);
            } else if (q === 'this-year') {
                from = new Date(today.getFullYear(), 0, 1);
                to = new Date(today.getFullYear(), 11, 31);
            }

            dom.fromDateInput.value = formatToInputDate(from);
            dom.toDateInput.value = formatToInputDate(to);
        });
    });
}


// ================================================================
// GLOBAL FUNCTIONS
// ================================================================
window.handleRetry = function() {
    clearCache();
    loadRecords(true);
};

window.handleClearCache = function() {
    clearCache();
    showToast('🧹 Cache cleared! Refreshing...', 'info');
    loadRecords(true);
};

window.openPrintResult = openPrintResult;
window.printResult = printResult;


// ================================================================
// INITIALIZATION
// ================================================================
function init() {
    const isAuthorized = checkAdminAuth();
    if (!isAuthorized) return;

    // ✅ Kick off logo preload in background
    preloadSchoolLogo().then(() => {
        console.log('✅ School logo preloaded for print');
    });

    // Inject print styles once
    if (!document.getElementById('printResultStyles')) {
        const styleEl = document.createElement('style');
        styleEl.id = 'printResultStyles';
        styleEl.textContent = getPrintResultStyles();
        document.head.appendChild(styleEl);
    }

    loadRecords();

    dom.searchInput.addEventListener('input', (e) => {
        clearTimeout(searchDebounceTimer);
        searchDebounceTimer = setTimeout(() => renderTable(e.target.value), 300);
    });

    dom.refreshBtn.addEventListener('click', () => {
        clearCache();
        loadRecords(true);
    });
    dom.mobileRefreshBtn.addEventListener('click', () => {
        clearCache();
        loadRecords(true);
    });

    dom.backToListBtn.addEventListener('click', goToListView);

    if (dom.printFromDetailBtn) {
        dom.printFromDetailBtn.addEventListener('click', openPrintResult);
    }

    dom.closeDateRangeBtn.addEventListener('click', () => dom.dateRangeModal.classList.remove('active'));
    dom.cancelDateRangeBtn.addEventListener('click', () => dom.dateRangeModal.classList.remove('active'));
    dom.applyDateRangeBtn.addEventListener('click', applyDateRange);

    const closePrintBtn = document.getElementById('closePrintResultBtn');
    const closePrintFooterBtn = document.getElementById('closePrintResultFooterBtn');
    const printNowBtn = document.getElementById('printResultNowBtn');
    if (closePrintBtn) closePrintBtn.addEventListener('click', () => {
        document.getElementById('printResultModal').classList.remove('active');
    });
    if (closePrintFooterBtn) closePrintFooterBtn.addEventListener('click', () => {
        document.getElementById('printResultModal').classList.remove('active');
    });
    if (printNowBtn) printNowBtn.addEventListener('click', printResult);

    document.querySelectorAll('.modal-overlay').forEach(el => {
        el.addEventListener('click', function(e) {
            if (e.target === this) this.classList.remove('active');
        });
    });

    setupToolbarEvents();
    setupDateRangeQuickPicks();
    setActiveFilterChip();

    setInterval(() => {
        if (document.hidden) return;
        refreshInBackground();
    }, 5 * 60 * 1000);

    console.log('✅ Universal School | On Exam Result Loaded');
    console.log(`📊 Sheet: ${CONFIG.SHEET_NAME}`);
    console.log(`🔐 Auth: ${isRememberMeActive() ? 'Remember Me Active' : 'Session Only'}`);
    console.log('🖨 Print Result: iframe-based + base64 logo');
    console.log('🎨 Theme: Blue / Yellow / Black / White');
}

document.addEventListener('DOMContentLoaded', function() {
    setTimeout(init, 100);
});
</script>
