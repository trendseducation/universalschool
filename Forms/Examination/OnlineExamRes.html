<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>📚 Universal School | On Exam Result</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ============================================================
           THEME VARIABLES — Blue / Yellow / White / Black
           ============================================================ */
        :root {
            --bg-body: #eef3fb;
            --bg-card: #ffffff;
            --bg-header: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --text-light: #94a3b8;
            --border-light: #e2e8f0;
            --shadow-sm: 0 10px 28px -10px rgba(15, 23, 42, 0.12);
            --shadow-hover: 0 22px 44px -14px rgba(15, 23, 42, 0.22);
            --accent: #1d4ed8;
            --accent-2: #2563eb;
            --accent-soft: rgba(37, 99, 235, 0.08);
            --yellow: #facc15;
            --yellow-soft: rgba(250, 204, 21, 0.18);
            --yellow-deep: #b45309;
            --card-border: 1px solid rgba(15, 23, 42, 0.06);
            --input-bg: #f8fafc;
            --input-border: #dbeafe;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --admin-badge-bg: rgba(29, 78, 216, 0.10);
            --table-header-bg: #f1f5fd;
            --table-row-hover: #eff6ff;
            --table-border: #e2e8f0;
            --transition-fast: 150ms ease;
            --transition-normal: 300ms ease;
        }

        [data-theme="dark"] {
            --bg-body: #050b1a;
            --bg-card: #0f172a;
            --bg-header: #0b1224;
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --text-light: #64748b;
            --border-light: #1e293b;
            --shadow-sm: 0 12px 32px -10px rgba(0, 0, 0, 0.75);
            --shadow-hover: 0 24px 48px -14px rgba(0, 0, 0, 0.85);
            --accent: #3b82f6;
            --accent-2: #60a5fa;
            --accent-soft: rgba(59, 130, 246, 0.16);
            --yellow: #facc15;
            --yellow-soft: rgba(250, 204, 21, 0.14);
            --yellow-deep: #facc15;
            --card-border: 1px solid rgba(255, 255, 255, 0.05);
            --input-bg: #0f172a;
            --input-border: #1e3a8a;
            --admin-badge-bg: rgba(250, 204, 21, 0.14);
            --table-header-bg: #111c34;
            --table-row-hover: #16213c;
            --table-border: #1e293b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            transition: background var(--transition-normal), color var(--transition-normal);
            min-height: 100vh;
            padding: 20px 16px;
        }

        ::-webkit-scrollbar { width: 0; height: 0; display: none; }
        * { scrollbar-width: none; -ms-overflow-style: none; }

        /* ============================================================
           ANIMATIONS
           ============================================================ */
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeSlide { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes modalPop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes slideIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .spinner {
            display: inline-block;
            width: 20px; height: 20px;
            border: 3px solid var(--border-light);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        /* ============================================================
           LAYOUT
           ============================================================ */
        .app-wrapper { max-width: 1440px; margin: 0 auto; animation: fadeIn 0.5s ease-out; }

        .page { display: none; animation: fadeSlide 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .page.active-page { display: block; }

        /* ============================================================
           TOP BAR
           ============================================================ */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            background: var(--bg-header);
            padding: 0.7rem 1.5rem;
            border-radius: 60px;
            border: var(--card-border);
            box-shadow: var(--shadow-sm);
            margin-bottom: 1.8rem;
            transition: background var(--transition-normal);
        }

        .brand-area { display: flex; align-items: center; gap: 10px; }
        .brand-logo { height: 44px; width: auto; object-fit: contain; }
        [data-theme="dark"] .brand-logo { filter: brightness(0) invert(1); }

        .brand-text {
            font-size: 1.45rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent), var(--yellow));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .admin-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--admin-badge-bg);
            color: var(--yellow-deep);
            padding: 0.22rem 0.85rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            border: 1px solid var(--yellow);
        }
        [data-theme="dark"] .admin-badge { color: var(--yellow); }

        .page-title-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--accent);
            color: #ffffff;
            padding: 0.4rem 1.1rem;
            border-radius: 40px;
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            box-shadow: 0 6px 18px -6px rgba(29, 78, 216, 0.55);
        }
        .page-title-chip i { color: var(--yellow); }

        /* ============================================================
           BUTTONS
           ============================================================ */
        .btn {
            border: none;
            padding: 0.6rem 1.4rem;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #ffffff;
            box-shadow: var(--shadow-sm);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--accent);
            color: var(--accent);
        }
        .btn-outline:hover { background: var(--accent); color: #ffffff; transform: translateY(-2px); }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger), #b91c1c);
            color: #ffffff;
        }
        .btn-danger:hover { transform: translateY(-2px); }

        .btn-yellow {
            background: linear-gradient(135deg, var(--yellow), #eab308);
            color: #1f2937;
        }
        .btn-yellow:hover { transform: translateY(-2px); }

        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none !important; }

        /* ============================================================
           TOOLBAR
           ============================================================ */
        .toolbar-section {
            background: var(--bg-card);
            border-radius: 32px;
            padding: 1.2rem 1.5rem;
            border: var(--card-border);
            box-shadow: var(--shadow-sm);
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .toolbar-row {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-wrapper { flex: 1 1 260px; min-width: 220px; position: relative; }
        .search-wrapper input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            border-radius: 60px;
            border: 2px solid var(--input-border);
            background: var(--input-bg);
            color: var(--text-main);
            font-size: 0.9rem;
            font-family: inherit;
            transition: all var(--transition-fast);
        }
        .search-wrapper input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-soft);
        }
        .search-wrapper i {
            position: absolute;
            left: 0.9rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            font-size: 0.85rem;
            pointer-events: none;
        }

        .toolbar-select {
            padding: 0.7rem 1rem;
            border-radius: 60px;
            border: 2px solid var(--input-border);
            background: var(--input-bg);
            color: var(--text-main);
            font-size: 0.85rem;
            font-family: inherit;
            cursor: pointer;
            transition: all var(--transition-fast);
            min-width: 180px;
        }
        .toolbar-select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }

        .filter-group { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }

        .filter-chip {
            padding: 0.55rem 1.1rem;
            border-radius: 60px;
            border: 2px solid var(--input-border);
            background: var(--input-bg);
            color: var(--text-main);
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .filter-chip i { font-size: 0.75rem; opacity: 0.75; }
        .filter-chip:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
        .filter-chip.active {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #ffffff;
            border-color: var(--accent);
            box-shadow: 0 6px 16px -6px rgba(29, 78, 216, 0.55);
        }
        .filter-chip.active i { opacity: 1; color: var(--yellow); }

        .filter-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            font-size: 0.78rem;
            color: var(--text-muted);
            padding: 0.4rem 0.8rem;
            border-radius: 30px;
            background: var(--accent-soft);
            border: 1px dashed var(--border-light);
        }
        .filter-meta strong { color: var(--accent); }
        .filter-meta .clear-filter-btn {
            background: transparent;
            border: none;
            color: var(--danger);
            font-weight: 800;
            cursor: pointer;
            font-size: 0.75rem;
            padding: 0 6px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .filter-meta .clear-filter-btn:hover { text-decoration: underline; }

        .desktop-buttons { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-left: auto; }
        .mobile-buttons { display: none; gap: 0.6rem; width: 100%; }
        .mobile-buttons .btn { flex: 1; justify-content: center; }

        .mobile-controls { display: none; gap: 0.6rem; width: 100%; }
        .mobile-controls .toolbar-select { flex: 1; min-width: 0; }
        .mobile-controls .mobile-filter-btn {
            flex: 0 0 auto;
            padding: 0.7rem 1.2rem;
            border-radius: 60px;
            border: 2px solid var(--accent);
            background: var(--accent-soft);
            color: var(--accent);
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all var(--transition-fast);
        }
        .mobile-controls .mobile-filter-btn:hover { background: var(--accent); color: #ffffff; }

        /* Mobile filter sheet */
        .mobile-filter-sheet {
            position: fixed;
            left: 0; right: 0;
            bottom: -100%;
            background: var(--bg-card);
            border-radius: 32px 32px 0 0;
            box-shadow: 0 -20px 60px -10px rgba(0, 0, 0, 0.35);
            z-index: 2500;
            transition: bottom 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 1.5rem 1.2rem 2rem;
            max-height: 80vh;
            overflow-y: auto;
            border-top: 1px solid var(--border-light);
        }
        .mobile-filter-sheet.open { bottom: 0; }
        .mobile-filter-sheet-backdrop {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 2499;
            opacity: 0;
            visibility: hidden;
            transition: all var(--transition-normal);
        }
        .mobile-filter-sheet-backdrop.open { opacity: 1; visibility: visible; }

        .mobile-filter-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid var(--border-light);
        }
        .mobile-filter-header h4 {
            font-size: 1rem;
            font-weight: 800;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .mobile-filter-header h4 i { color: var(--yellow); }
        .mobile-filter-header button {
            background: transparent;
            border: none;
            font-size: 1.6rem;
            line-height: 1;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0 4px;
        }
        .mobile-filter-sheet .filter-chip {
            width: 100%;
            justify-content: center;
            margin-bottom: 0.5rem;
            padding: 0.7rem 1rem;
        }

        /* ============================================================
           TABLE
           ============================================================ */
        .table-card {
            background: var(--bg-card);
            border-radius: 32px;
            border: var(--card-border);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }
        .table-wrapper { overflow-x: auto; padding: 0 1rem 1rem; }

        .data-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 0.875rem;
        }
        .data-table th {
            text-align: left;
            padding: 1rem 1.2rem;
            background: var(--table-header-bg);
            color: var(--accent);
            font-weight: 800;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            border-bottom: 3px solid var(--accent);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        [data-theme="dark"] .data-table th { color: var(--yellow); border-bottom-color: var(--accent); }
        .data-table td {
            padding: 1rem 1.2rem;
            border-bottom: 1px solid var(--border-light);
            color: var(--text-main);
            transition: background var(--transition-fast);
        }
        .data-table tr:hover td { background: var(--table-row-hover); }
        .data-table th:first-child { border-top-left-radius: 12px; }
        .data-table th:last-child { border-top-right-radius: 12px; }

        .view-action-btn {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #ffffff;
            border: none;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .view-action-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px -8px rgba(29, 78, 216, 0.6); }
        .view-action-btn i { color: var(--yellow); }

        .status-pill {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
        }
        .status-pill.pass { background: rgba(16, 185, 129, 0.15); color: #059669; border: 1px solid rgba(16, 185, 129, 0.4); }
        .status-pill.fail { background: rgba(239, 68, 68, 0.15); color: #dc2626; border: 1px solid rgba(239, 68, 68, 0.4); }
        [data-theme="dark"] .status-pill.pass { color: #34d399; }
        [data-theme="dark"] .status-pill.fail { color: #f87171; }

        /* ============================================================
           DETAIL VIEW
           ============================================================ */
        .detail-view-body {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .detail-hero {
            background: linear-gradient(135deg, var(--accent), #1e40af);
            color: #ffffff;
            border-radius: 24px;
            padding: 1.5rem 2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            align-items: center;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }
        .detail-hero::before {
            content: '';
            position: absolute;
            right: -60px; top: -60px;
            width: 220px; height: 220px;
            background: var(--yellow-soft);
            border-radius: 50%;
        }
        .detail-hero-left { display: flex; flex-direction: column; gap: 6px; min-width: 200px; position: relative; z-index: 1; }
        .detail-hero-left .name { font-size: 1.6rem; font-weight: 900; letter-spacing: -0.5px; }
        .detail-hero-left .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 0.8rem;
            opacity: 0.95;
        }
        .detail-hero-left .meta span {
            background: rgba(255, 255, 255, 0.18);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }
        .detail-hero-left .meta span i { color: var(--yellow); }
        .detail-hero-right { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; position: relative; z-index: 1; }
        .hero-stat {
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.28);
            border-radius: 16px;
            padding: 0.8rem 1.2rem;
            text-align: center;
            min-width: 100px;
        }
        .hero-stat .label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.6px; opacity: 0.95; font-weight: 800; }
        .hero-stat .value { font-size: 1.5rem; font-weight: 900; margin-top: 2px; letter-spacing: -0.5px; }
        .hero-stat.pass-bg { background: rgba(16, 185, 129, 0.4); border-color: rgba(16, 185, 129, 0.7); }
        .hero-stat.fail-bg { background: rgba(239, 68, 68, 0.4); border-color: rgba(239, 68, 68, 0.7); }

        .detail-section {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 20px;
            overflow: hidden;
        }
        .detail-section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0.9rem 1.4rem;
            font-size: 0.85rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            border-bottom: 1px solid var(--border-light);
            background: var(--table-header-bg);
            color: var(--accent);
        }
        [data-theme="dark"] .detail-section-header { color: var(--yellow); }
        .detail-section-header i {
            width: 28px; height: 28px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 0.8rem;
        }
        [data-theme="dark"] .detail-section-header i { color: var(--yellow); }

        .detail-section-body {
            padding: 1rem 1.4rem 1.4rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 0.9rem;
        }

        .info-tile {
            background: var(--accent-soft);
            border-radius: 14px;
            padding: 0.8rem 1rem;
            border: 1px solid var(--border-light);
            transition: all var(--transition-fast);
        }
        .info-tile:hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); }
        .info-tile .label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-muted);
            font-weight: 800;
        }
        .info-tile .value {
            font-weight: 800;
            font-size: 1rem;
            margin-top: 4px;
            color: var(--text-main);
            word-break: break-word;
        }
        .info-tile.marks-tile .value { color: var(--accent); font-size: 1.15rem; }
        [data-theme="dark"] .info-tile.marks-tile .value { color: var(--yellow); }
        .info-tile.highlight {
            background: linear-gradient(135deg, var(--yellow-soft), var(--accent-soft));
            border-color: var(--yellow);
        }
        .info-tile.highlight .label { color: var(--yellow-deep); }
        .info-tile.highlight .value { color: var(--accent); font-size: 1.2rem; }
        [data-theme="dark"] .info-tile.highlight .value { color: var(--yellow); }

        .detail-actions {
            padding: 0 1.5rem 1.5rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        /* ============================================================
           MODALS
           ============================================================ */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(5, 11, 26, 0.55);
            backdrop-filter: blur(12px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            visibility: hidden;
            opacity: 0;
            transition: all var(--transition-normal);
        }
        .modal-overlay.active { display: flex; visibility: visible; opacity: 1; }
        .modal-overlay.nested { z-index: 2001; }

        .modal-box {
            background: var(--bg-card);
            border-radius: 40px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border: var(--card-border);
            box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.6);
            animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .modal-box.wide { max-width: 900px; }

        .modal-header {
            background: linear-gradient(135deg, var(--accent), #1e40af);
            padding: 1.2rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 40px 40px 0 0;
            color: #ffffff;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .modal-header h3 { font-size: 1.25rem; font-weight: 800; display: flex; align-items: center; gap: 8px; }
        .modal-header h3 i { color: var(--yellow); }

        .modal-close {
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            color: #ffffff;
            transition: transform var(--transition-fast);
            line-height: 1;
        }
        .modal-close:hover { transform: rotate(90deg); }
        .modal-body { padding: 2rem; overflow-y: auto; max-height: calc(90vh - 70px); }

        /* ============================================================
           DATE RANGE MODAL
           ============================================================ */
        .date-range-box {
            background: var(--bg-card);
            border-radius: 32px;
            max-width: 520px;
            width: 100%;
            overflow: hidden;
            box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.6);
            animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .date-range-hero {
            background: linear-gradient(135deg, var(--accent), #1e40af);
            padding: 1.5rem 2rem;
            color: #ffffff;
            position: relative;
            overflow: hidden;
        }
        .date-range-hero::after {
            content: '';
            position: absolute;
            right: -40px; top: -40px;
            width: 160px; height: 160px;
            background: var(--yellow-soft);
            border-radius: 50%;
        }
        .date-range-hero h3 {
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .date-range-hero h3 i { color: var(--yellow); }
        .date-range-hero p { font-size: 0.85rem; opacity: 0.95; margin-top: 4px; }
        .date-range-close {
            position: absolute;
            top: 12px; right: 16px;
            background: rgba(255, 255, 255, 0.18);
            border: none;
            color: #ffffff;
            width: 32px; height: 32px;
            border-radius: 50%;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-fast);
        }
        .date-range-close:hover { background: rgba(255, 255, 255, 0.35); transform: rotate(90deg); }
        .date-range-body { padding: 1.8rem 2rem 2rem; }
        .date-range-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem; }
        .date-field { display: flex; flex-direction: column; gap: 6px; }
        .date-field label {
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .date-field label i { color: var(--yellow-deep); }
        [data-theme="dark"] .date-field label i { color: var(--yellow); }
        .date-field input[type="date"] {
            padding: 0.8rem 1rem;
            border-radius: 16px;
            border: 2px solid var(--input-border);
            background: var(--input-bg);
            color: var(--text-main);
            font-size: 0.9rem;
            font-family: inherit;
            transition: all var(--transition-fast);
        }
        .date-field input[type="date"]:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-soft);
        }
        .date-quick-picks { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1.5rem; }
        .quick-pick {
            padding: 0.45rem 1rem;
            border-radius: 30px;
            border: 2px dashed var(--border-light);
            background: transparent;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        .quick-pick:hover {
            border-color: var(--accent);
            color: var(--accent);
            border-style: solid;
            background: var(--accent-soft);
        }
        .date-range-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }

        /* ============================================================
           PRINT RESULT STYLES
           ============================================================ */
        .pr-result-sheet {
            background: #ffffff;
            color: #0f172a;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            width: 100%;
            max-width: 820px;
            margin: 0 auto;
            padding: 18px 22px 26px;
            border: 3px solid #1d4ed8;
            border-radius: 18px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 12px 40px -10px rgba(0, 0, 0, 0.25);
            isolation: isolate;
            box-sizing: border-box;
        }
        .pr-watermark {
            position: absolute; inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 5;
            overflow: hidden;
        }
        .pr-watermark img {
            width: 78%;
            max-width: 580px;
            opacity: 0.07;
            transform: rotate(-18deg);
            filter: grayscale(15%) contrast(90%);
            user-select: none;
            -webkit-user-drag: none;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }
        .pr-result-sheet > *:not(.pr-watermark) { position: relative; z-index: 1; }
        .pr-info-grid, .pr-subject-table, .pr-status-table, .pr-remarks-box, .pr-photo-box {
            background-color: rgba(255, 255, 255, 0.85) !important;
        }
        .pr-subject-table th { background-color: rgba(29, 78, 216, 0.95) !important; }
        .pr-status-table th { background-color: rgba(250, 204, 21, 0.95) !important; color: #1f2937 !important; }

        .pr-header {
            display: grid;
            grid-template-columns: 130px 1fr 130px;
            align-items: center;
            gap: 12px;
            border-bottom: 3px solid #1d4ed8;
            padding-bottom: 12px;
            margin-bottom: 14px;
        }
        .pr-header-left { display: flex; justify-content: flex-start; }
        .pr-logo { height: 100px; width: 100px; object-fit: contain; }
        .pr-header-center { text-align: center; }
        .pr-title { font-size: 2.1rem; font-weight: 900; color: #1d4ed8; letter-spacing: 1px; margin: 0; line-height: 1.1; }
        .pr-result-badge {
            display: inline-block;
            margin-top: 6px;
            background: #facc15;
            color: #1f2937;
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: 3px;
            padding: 4px 36px;
            border-radius: 999px;
            position: relative;
            border: 2px solid #1d4ed8;
        }
        .pr-result-badge::before, .pr-result-badge::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40px;
            height: 2px;
            background: #1d4ed8;
            transform: translateY(-50%);
        }
        .pr-result-badge::before { right: calc(100% + 8px); }
        .pr-result-badge::after { left: calc(100% + 8px); }
        .pr-header-right { display: flex; justify-content: flex-end; }
        .pr-photo-box {
            position: relative;
            width: 110px; height: 140px;
            border: 2px solid #1d4ed8;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(29, 78, 216, 0.2);
            flex: 0 0 auto;
        }
        .pr-photo-box > img, .pr-photo-box > .pr-photo-placeholder {
            position: absolute; inset: 0; width: 100%; height: 100%;
        }
        .pr-photo-box > img { object-fit: cover; object-position: center top; display: block; background: #ffffff; }
        .pr-photo-placeholder {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 6px; color: #94a3b8;
            font-size: 0.7rem; font-weight: 800;
            text-transform: uppercase; letter-spacing: 1px;
            background: rgba(241, 245, 249, 0.85);
        }
        .pr-photo-placeholder i { font-size: 1.8rem; }

        .pr-info-grid { border: 2px solid #1d4ed8; border-radius: 6px; padding: 8px 10px; margin-bottom: 12px; box-sizing: border-box; }
        .pr-info-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
        .pr-info-row:last-child { margin-bottom: 0; }
        .pr-info-cell { display: flex; align-items: center; gap: 6px; flex: 1 1 180px; min-width: 140px; }
        .pr-info-cell.full { flex: 1 1 100%; }
        .pr-info-cell label { font-size: 0.78rem; font-weight: 800; color: #1d4ed8; white-space: nowrap; }
        .pr-info-cell span {
            flex: 1;
            border: 1.5px solid #1d4ed8;
            border-radius: 4px;
            padding: 3px 8px;
            font-size: 0.82rem;
            font-weight: 700;
            color: #0f172a;
            background: rgba(255, 255, 255, 0.9);
            min-height: 22px;
            line-height: 1.3;
            word-break: break-word;
            box-sizing: border-box;
        }

        .pr-subject-table { width: 100%; border-collapse: collapse; margin-bottom: 12px; border: 2px solid #1d4ed8; box-sizing: border-box; }
        .pr-subject-table th {
            color: #ffffff;
            font-size: 0.82rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 6px 8px;
            border: 1.5px solid #1d4ed8;
            text-align: center;
        }
        .pr-subject-table td {
            padding: 5px 10px;
            font-size: 0.82rem;
            color: #0f172a;
            border: 1.5px solid #1d4ed8;
            height: 26px;
            background: rgba(255, 255, 255, 0.85);
        }
        .pr-subject-table tbody tr:nth-child(even) td { background: rgba(248, 250, 252, 0.9); }

        .pr-section-title {
            display: inline-block;
            background: #1d4ed8;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 800;
            padding: 4px 18px;
            border-radius: 999px;
            margin: 4px 0 6px;
            letter-spacing: 0.5px;
        }
        .pr-section-title.yellow {
            background: #facc15;
            color: #1f2937;
            border: 2px solid #1d4ed8;
        }

        .pr-status-table { width: 100%; border-collapse: collapse; margin-bottom: 12px; border: 2px solid #1d4ed8; box-sizing: border-box; }
        .pr-status-table th {
            color: #1f2937;
            font-size: 0.75rem;
            font-weight: 800;
            padding: 5px 6px;
            border: 1.5px solid #1d4ed8;
            text-align: center;
        }
        .pr-status-table td {
            padding: 6px 8px;
            font-size: 0.8rem;
            font-weight: 800;
            color: #0f172a;
            text-align: center;
            border: 1.5px solid #1d4ed8;
            min-height: 24px;
            background: rgba(255, 255, 255, 0.85);
        }
        .pr-remarks-box {
            border: 2px solid #1d4ed8;
            border-radius: 6px;
            padding: 8px 12px;
            min-height: 46px;
            font-size: 0.82rem;
            font-weight: 700;
            color: #0f172a;
            line-height: 1.5;
            box-sizing: border-box;
        }
        .pr-print-body { background: #ffffff; padding: 0; margin: 0; }

        @media print {
            @page { size: A4; margin: 6mm; }
            html, body {
                background: #ffffff !important;
                margin: 0 !important;
                padding: 0 !important;
                width: 100% !important;
                height: auto !important;
            }
            .pr-print-body { padding: 0 !important; margin: 0 !important; }
            .pr-result-sheet {
                box-shadow: none !important;
                border-radius: 0 !important;
                max-width: 100% !important;
                width: 100% !important;
                margin: 0 !important;
                padding: 8px 12px 12px !important;
                box-sizing: border-box !important;
                overflow: visible !important;
                border: 3px solid #1d4ed8 !important;
                page-break-inside: avoid;
                break-inside: avoid;
                background-color: #ffffff !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .pr-watermark { display: flex !important; opacity: 1 !important; z-index: 5 !important; }
            .pr-watermark img {
                display: block !important;
                opacity: 0.07 !important;
                width: 78% !important;
                max-width: 580px !important;
                transform: rotate(-18deg) !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .pr-logo { height: 90px !important; width: 90px !important; }
            .pr-info-grid, .pr-subject-table, .pr-subject-table th, .pr-subject-table td,
            .pr-status-table, .pr-status-table th, .pr-status-table td,
            .pr-section-title, .pr-result-badge, .pr-remarks-box, .pr-photo-box, .pr-info-cell span {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }

        /* ============================================================
           STATUS / TOAST
           ============================================================ */
        .alert-popup {
            position: fixed;
            bottom: 100px;
            right: 30px;
            background: var(--bg-card);
            border-left: 5px solid var(--accent);
            padding: 16px 24px;
            box-shadow: var(--shadow-hover);
            border-radius: 0 16px 16px 0;
            font-weight: 700;
            font-size: 0.95rem;
            z-index: 3000;
            display: none;
            animation: slideIn 0.3s ease-out;
            color: var(--text-main);
            max-width: 400px;
        }
        .alert-popup.success { border-left-color: var(--success); }
        .alert-popup.error { border-left-color: var(--danger); }
        .alert-popup.warning { border-left-color: var(--warning); }

        /* ============================================================
           LOADING / EMPTY / ERROR
           ============================================================ */
        .loading-container, .empty-container, .error-container {
            text-align: center;
            padding: 40px 20px;
        }
        .loading-spinner {
            width: 40px; height: 40px;
            border: 4px solid var(--border-light);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        .empty-icon, .error-icon { font-size: 2.5rem; display: block; margin-bottom: 12px; }
        .error-icon { color: var(--danger); }
        .empty-title { font-weight: 700; color: var(--text-muted); font-size: 1.1rem; }
        .error-title { font-weight: 700; color: var(--danger); font-size: 1.1rem; }
        .error-actions { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 820px) {
            .desktop-buttons { display: none; }
            .mobile-buttons { display: flex; }
            .mobile-controls { display: flex; }
            .desktop-filter-row { display: none; }
            .top-bar { padding: 0.6rem 1rem; border-radius: 32px; }
            .brand-text { font-size: 1.15rem; }
            .brand-logo { height: 38px; }
            .toolbar-section { padding: 1rem 1.2rem; border-radius: 24px; }
            .data-table th, .data-table td { padding: 0.8rem 0.8rem; font-size: 0.75rem; }
            .modal-box { max-width: 95%; }
            .detail-section-body { grid-template-columns: 1fr 1fr; padding: 0.8rem 1rem 1rem; }
            .modal-body { padding: 1.5rem; }
            .alert-popup { bottom: 70px; right: 15px; left: 15px; max-width: none; }
            .detail-hero { padding: 1.2rem 1.4rem; }
            .detail-hero-left .name { font-size: 1.3rem; }
            .detail-view-body { padding: 1rem; gap: 1rem; }
            .date-range-fields { grid-template-columns: 1fr; }
        }

        @media (min-width: 821px) {
            .mobile-controls { display: none !important; }
            .mobile-filter-sheet, .mobile-filter-sheet-backdrop { display: none !important; }
        }

        @media (max-width: 480px) {
            body { padding: 12px; }
            .top-bar { padding: 0.4rem 0.8rem; border-radius: 24px; }
            .brand-text { font-size: 1rem; }
            .brand-logo { height: 32px; }
            .data-table th, .data-table td { padding: 0.6rem; font-size: 0.7rem; }
            .detail-section-body { grid-template-columns: 1fr; }
            .modal-box { border-radius: 28px; }
            .modal-header { border-radius: 28px 28px 0 0; padding: 1rem 1.2rem; }
            .modal-header h3 { font-size: 1.05rem; }
            .modal-body { padding: 1.2rem; }
            .btn { padding: 0.5rem 1rem; font-size: 0.8rem; }
            .filter-chip { font-size: 0.72rem; padding: 0.45rem 0.9rem; }
            .hero-stat { min-width: 80px; padding: 0.6rem 0.9rem; }
            .hero-stat .value { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

<div class="app-wrapper">

    <!-- ===================== TOP BAR ===================== -->
    <header class="top-bar">
        <div class="brand-area">
            <img class="brand-logo" src="https://lh3.googleusercontent.com/d/1Vug3CcEFge9XYr24jhBZwk-_C4gWaar_" alt="Universal School logo">
            <span class="brand-text">Universal School</span>
            <span class="admin-badge"><i class="fas fa-user-shield"></i> Admin</span>
        </div>
        <div style="display: flex; gap: 0.8rem; align-items: center; flex-wrap: wrap;">
            <span class="page-title-chip"><i class="fas fa-clipboard-check"></i> On Exam Result</span>
        </div>
    </header>

    <!-- ===================== PAGE 1 - LIST VIEW ===================== -->
    <div id="page1" class="page active-page">

        <!-- Toolbar -->
        <div class="toolbar-section">
            <div class="toolbar-row">
                <div class="search-wrapper">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Search by Student Name, Std, Subject, Date...">
                </div>

                <select id="sortSelect" class="toolbar-select" title="Sort records">
                    <option value="date-desc">📅 Date (Newest First)</option>
                    <option value="date-asc">📅 Date (Oldest First)</option>
                    <option value="name-asc">🔤 Name (A → Z)</option>
                    <option value="name-desc">🔤 Name (Z → A)</option>
                    <option value="std-asc">🎓 Std (A → Z)</option>
                    <option value="marks-desc">📊 Marks (High → Low)</option>
                </select>

                <div class="desktop-buttons">
                    <button id="refreshBtn" class="btn btn-outline"><span>⟳</span> Refresh</button>
                </div>
            </div>

            <!-- Desktop filter chips -->
            <div class="toolbar-row desktop-filter-row">
                <div class="filter-group">
                    <button class="filter-chip" data-filter="all">
                        <i class="fas fa-layer-group"></i> All Tests
                    </button>
                    <button class="filter-chip" data-filter="last-test">
                        <i class="fas fa-clock"></i> Last Test
                    </button>
                    <button class="filter-chip" data-filter="this-month">
                        <i class="fas fa-calendar-day"></i> This Month
                    </button>
                    <button class="filter-chip" data-filter="last-month">
                        <i class="fas fa-calendar-minus"></i> Last Month
                    </button>
                    <button class="filter-chip" data-filter="custom">
                        <i class="fas fa-calendar-alt"></i> Custom Range
                    </button>
                    <button class="filter-chip" data-filter="pass">
                        <i class="fas fa-check-circle"></i> Pass Only
                    </button>
                    <button class="filter-chip" data-filter="fail">
                        <i class="fas fa-times-circle"></i> Fail Only
                    </button>
                </div>
            </div>

            <!-- Mobile controls -->
            <div class="mobile-controls">
                <select id="mobileSortSelect" class="toolbar-select" title="Sort records">
                    <option value="date-desc">📅 Date (Newest)</option>
                    <option value="date-asc">📅 Date (Oldest)</option>
                    <option value="name-asc">🔤 Name (A → Z)</option>
                    <option value="name-desc">🔤 Name (Z → A)</option>
                    <option value="std-asc">🎓 Std (A → Z)</option>
                    <option value="marks-desc">📊 Marks (High → Low)</option>
                </select>
                <button class="mobile-filter-btn" id="mobileFilterBtn">
                    <i class="fas fa-filter"></i> <span id="mobileFilterLabel">All Tests</span>
                </button>
            </div>

            <div class="mobile-buttons">
                <button id="mobileRefreshBtn" class="btn btn-outline"><span>⟳</span> Refresh</button>
            </div>

            <div id="filterMeta" class="filter-meta" style="display:none;">
                <i class="fas fa-filter"></i>
                <span>Showing: <strong id="filterMetaText">—</strong></span>
                <span id="filterMetaCount" style="opacity:.75;"></span>
                <button class="clear-filter-btn" id="clearFilterBtn" title="Clear filter">
                    <i class="fas fa-times"></i> Clear
                </button>
            </div>
        </div>

        <!-- Table -->
        <div class="table-card">
            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Sr. No</th>
                            <th>Student Name</th>
                            <th>Date</th>
                            <th>Std</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="5" style="text-align:center;">
                                <div class="loading-container">
                                    <div class="loading-spinner"></div>
                                    <div class="loading-message">Loading exam records...</div>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- ===================== PAGE 2 - DETAIL VIEW ===================== -->
    <div id="page2" class="page">
        <div class="table-card">
            <div class="modal-header" style="border-radius: 32px 32px 0 0;">
                <h3><i class="fas fa-graduation-cap"></i> <span id="detailStudentName">Student Marks</span></h3>
                <button id="backToListBtn" class="btn btn-outline" style="background:rgba(255,255,255,0.15);color:white;border-color:rgba(255,255,255,0.3);">
                    <i class="fas fa-arrow-left"></i> Back
                </button>
            </div>
            <div id="detailContainer" class="detail-view-body"></div>
            <div class="detail-actions">
                <button id="printFromDetailBtn" class="btn btn-yellow">
                    <i class="fas fa-print"></i> Print Result
                </button>
            </div>
        </div>
    </div>

    <!-- ===================== DATE RANGE MODAL ===================== -->
    <div id="dateRangeModal" class="modal-overlay nested">
        <div class="date-range-box">
            <div class="date-range-hero">
                <button class="date-range-close" id="closeDateRangeBtn">×</button>
                <h3><i class="fas fa-calendar-alt"></i> Custom Date Range</h3>
                <p>Pick a From and To date to filter the exam records</p>
            </div>
            <div class="date-range-body">
                <div class="date-range-fields">
                    <div class="date-field">
                        <label><i class="fas fa-play"></i> From Date</label>
                        <input type="date" id="fromDateInput">
                    </div>
                    <div class="date-field">
                        <label><i class="fas fa-stop"></i> To Date</label>
                        <input type="date" id="toDateInput">
                    </div>
                </div>
                <div class="date-quick-picks">
                    <button class="quick-pick" data-quick="last7">Last 7 days</button>
                    <button class="quick-pick" data-quick="last30">Last 30 days</button>
                    <button class="quick-pick" data-quick="this-month">This month</button>
                    <button class="quick-pick" data-quick="last-month">Last month</button>
                    <button class="quick-pick" data-quick="this-year">This year</button>
                </div>
                <div class="date-range-actions">
                    <button class="btn btn-outline" id="cancelDateRangeBtn">Cancel</button>
                    <button class="btn btn-primary" id="applyDateRangeBtn">
                        <i class="fas fa-check"></i> Apply Filter
                    </button>
                </div>
            </div>
        </div>
    </div>

const SESSION_KEYS = {
    USER: 'Universal_user',
    USER_DATA: 'Universal_user_data',
    USER_TYPE: 'Universal_user_type',
    REMEMBER_ME: 'Universal_remember_me',
    SESSION_EXPIRY: 'Universal_session_expiry'
};

function getSessionData(key) {
    const localData = localStorage.getItem(key);
    if (localData) {
        try {
            const parsed = JSON.parse(localData);
            if (parsed.expiry && Date.now() < parsed.expiry) return parsed.value;
            localStorage.removeItem(key);
            return null;
        } catch (e) { return null; }
    }
    const sessionData = sessionStorage.getItem(key);
    if (sessionData) {
        try { return JSON.parse(sessionData); } catch (e) { return sessionData; }
    }
    return null;
}

function isRememberMeActive() {
    const rememberMe = localStorage.getItem(SESSION_KEYS.REMEMBER_ME);
    if (rememberMe) {
        try {
            const parsed = JSON.parse(rememberMe);
            return parsed.value === true && Date.now() < parsed.expiry;
        } catch (e) { return false; }
    }
    return false;
}

function getSessionExpiryTime() {
    const expiryData = localStorage.getItem(SESSION_KEYS.SESSION_EXPIRY);
    if (expiryData) {
        try {
            const parsed = JSON.parse(expiryData);
            if (Date.now() < parsed.expiry) return parsed.value;
        } catch (e) {}
    }
    return null;
}

function clearAllSessionData() {
    Object.values(SESSION_KEYS).forEach(key => {
        localStorage.removeItem(key);
        sessionStorage.removeItem(key);
    });
}

function checkAdminAuth() {
    let user = null;
    let userType = null;
    const rememberMe = isRememberMeActive();

    if (rememberMe) {
        user = getSessionData(SESSION_KEYS.USER);
        userType = getSessionData(SESSION_KEYS.USER_TYPE);
        const expiry = getSessionExpiryTime();
        if (expiry && Date.now() > expiry) {
            clearAllSessionData();
            user = null;
            userType = null;
        }
    } else {
        const userData = sessionStorage.getItem(SESSION_KEYS.USER);
        const userTypeData = sessionStorage.getItem(SESSION_KEYS.USER_TYPE);
        if (userData) {
            try {
                user = JSON.parse(userData);
                userType = JSON.parse(userTypeData);
            } catch (e) { user = null; userType = null; }
        }
    }

    if (!user || userType !== 'admin') {
        if (user && userType === 'student') {
            showToast('⚠️ Student access denied. Admin login required.', 'warning');
            setTimeout(() => {
                window.location.href = '../../Study Material/My Account/myaccount.html';
            }, 1500);
            return false;
        }
        sessionStorage.setItem('redirect_after_login', window.location.href);
        window.location.href = '../../Study Material/My Account/myaccount.html';
        return false;
    }
    return true;
}

setInterval(() => {
    const expiry = getSessionExpiryTime();
    if (expiry && Date.now() > expiry) {
        clearAllSessionData();

}, 60000);

function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
}

function showToast(msg, type = 'info') {
    const box = dom.alertBox;
    if (!box) return;
    box.textContent = msg;
    box.className = `alert-popup ${type}`;
    box.style.display = 'block';
    clearTimeout(box._timeout);
    box._timeout = setTimeout(() => { box.style.display = 'none'; }, 4500);
}

function extractDriveFileId(url) {
    if (!url) return '';
    const s = String(url).trim();
    if (!s) return '';
    let m = s.match(/\/d\/([-\w]{25,})/);
    if (m) return m[1];
    m = s.match(/[?&]id=([-\w]{25,})/);
    if (m) return m[1];
    if (/^[-\w]{25,}$/.test(s)) return s;
    return '';
}

function toLh3Url(url) {
    const id = extractDriveFileId(url);
    if (!id) return '';
    return `https://lh3.googleusercontent.com/d/${id}`;
}

function isValueEmpty(value) {
    if (value === undefined || value === null) return true;
    const s = String(value).trim();
    if (s === '' || s === '—' || s === '-') return true;
    if (s === '{}' || s === '[]' || s === 'null' || s === 'undefined') return true;
    const n = parseFloat(s);
    if (!isNaN(n) && n === 0) return true;
    return false;
}


// ================================================================
// ✅ IMAGE PRELOADING — fetch image → base64 data URI
// ================================================================
function fetchImageAsDataURL(url) {
    return new Promise((resolve) => {
        if (!url) return resolve('');

        if (IMAGE_BASE64_CACHE[url]) {
            return resolve(IMAGE_BASE64_CACHE[url]);
        }

        const img = new Image();
        img.crossOrigin = 'anonymous';

        const timeout = setTimeout(() => {
            console.warn('⏱ Image load timeout:', url);
            resolve('');
        }, 8000);

        img.onload = () => {
            clearTimeout(timeout);
            try {
                const canvas = document.createElement('canvas');
                canvas.width = img.naturalWidth || img.width;
                canvas.height = img.naturalHeight || img.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                const dataUrl = canvas.toDataURL('image/png');
                IMAGE_BASE64_CACHE[url] = dataUrl;
                resolve(dataUrl);
            } catch (err) {
                console.warn('Canvas conversion failed for:', url, err);
                IMAGE_BASE64_CACHE[url] = url;
                resolve(url);
            }
        };

        img.onerror = () => {
            clearTimeout(timeout);
            console.warn('❌ Image failed to load:', url);
            IMAGE_BASE64_CACHE[url] = '';
            resolve('');
        };

        img.src = url;
    });
}

async function fetchFirstWorkingImage(urls) {
    for (const url of urls) {
        const dataUrl = await fetchImageAsDataURL(url);

// ================================================================
// DATE HELPERS
// ================================================================
function parseAnyDate(input) {
    if (!input && input !== 0) return null;
    if (input instanceof Date) return isNaN(input.getTime()) ? null : input;

    const s = String(input).trim();
    if (!s) return null;

    if (/^\d{5}$/.test(s)) {
        const serial = Number(s);
        if (!isNaN(serial) && serial > 20000 && serial < 60000) {
            const epoch = new Date(1899, 11, 30);
            const dt = new Date(epoch.getTime() + serial * 86400000);
            return isNaN(dt.getTime()) ? null : dt;
        }
    }

    let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (m) {
        const [_, d, mo, y] = m;
        const dt = new Date(Number(y), Number(mo) - 1, Number(d));
        return isNaN(dt.getTime()) ? null : dt;
    }

    m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (m) {
        const [_, y, mo, d] = m;
        const dt = new Date(Number(y), Number(mo) - 1, Number(d));
        return isNaN(dt.getTime()) ? null : dt;
    }

    const dt = new Date(s);
    return isNaN(dt.getTime()) ? null : dt;
}

function formatDate(dateStr) {
    if (!dateStr) return '—';
    try {
        const d = parseAnyDate(dateStr);
        if (!d) return String(dateStr);
        const day = String(d.getDate()).padStart(2, '0');
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const year = d.getFullYear();
        return `${day}/${month}/${year}`;
    } catch { return String(dateStr); }
}

function formatToInputDate(date) {
    if (!date) return '';
    const y = date.getFullYear();
    const mo = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${mo}-${d}`;
}

function isSameDay(a, b) {
    return a.getFullYear() === b.getFullYear()
        && a.getMonth() === b.getMonth()
        && a.getDate() === b.getDate();
}


// ================================================================
// CACHE
// ================================================================
const CACHE_KEY = 'on_exam_result_cache_v2';
const CACHE_VERSION_KEY = 'on_exam_result_version_v2';
const CURRENT_CACHE_VERSION = '2.0';

function getCache() {
    try {
        const version = localStorage.getItem(CACHE_VERSION_KEY);
        if (version !== CURRENT_CACHE_VERSION) {
            localStorage.removeItem(CACHE_KEY);
            localStorage.setItem(CACHE_VERSION_KEY, CURRENT_CACHE_VERSION);
            return null;
        }
        const cached = localStorage.getItem(CACHE_KEY);
        if (cached) {
            const { data, timestamp } = JSON.parse(cached);
            if (Date.now() - timestamp < CONFIG.CACHE_TTL) return data;
            localStorage.removeItem(CACHE_KEY);
        }
    } catch (e) { console.error('Cache read error:', e); }
    return null;
}

function setCache(data) {
    try {
        localStorage.setItem(CACHE_KEY, JSON.stringify({ data, timestamp: Date.now() }));
        localStorage.setItem(CACHE_VERSION_KEY, CURRENT_CACHE_VERSION);
    } catch (e) { console.error('Cache write error:', e); }
}

function clearCache() {
    localStorage.removeItem(CACHE_KEY);
    localStorage.removeItem(CACHE_VERSION_KEY);
    dataLoaded = false;
}


// ================================================================
// FETCH STUDENTS (for photo lookup)
// ================================================================
async function fetchAllStudents(forceRefresh = false) {
    if (!forceRefresh && Object.keys(allStudents).length > 0) {
        return allStudents;
    }
    const result = {};
    for (const sheetName of CONFIG.STUDENT_SHEETS) {
        try {
            const url = `${CONFIG.SCRIPT_URL}?spreadsheetId=${CONFIG.STUDENT_SPREADSHEET_ID}&sheetName=${sheetName}&_=${Date.now()}`;
            const response = await fetch(url);
            const data = await response.json();
            if (data.status === 'success' && Array.isArray(data.data)) {
                result[sheetName] = data.data.map((row, idx) => ({
                    ...row, _rowIndex: idx + 2, _sheet: sheetName
                }));
            }
        } catch (err) {
            console.error(`Error fetching ${sheetName}:`, err);
            result[sheetName] = [];
        }
    }
    allStudents = result;
    return result;
}

async function findStudentPhotoUrl(studentName, stdDisplay) {
    if (!studentName) return '';
    const cacheKey = `${studentName}||${stdDisplay || ''}`;
    if (studentPhotoCache.hasOwnProperty(cacheKey)) {
        return studentPhotoCache[cacheKey];
    }

    try {
        await fetchAllStudents();
    } catch (e) {
        studentPhotoCache[cacheKey] = '';
        return '';
    }

    const targetName = String(studentName).trim().toLowerCase();
    const rawStdKey = stdRawKey(stdDisplay || '');

    const preferred = rawStdKey && allStudents[rawStdKey] ? [rawStdKey] : [];
    const others = Object.keys(allStudents).filter(k => !preferred.includes(k));
    const order = [...preferred, ...others];

    for (const sheet of order) {
        const rows = allStudents[sheet] || [];
        for (const row of rows) {
            const name = String(row['Full Name'] || row['First Name'] || '').trim();
            if (!name) continue;
            if (name.toLowerCase() === targetName) {
                const imgVal = row['Image'] || row['image'] || row['IMAGE'] || '';
                const url = toLh3Url(imgVal);
                studentPhotoCache[cacheKey] = url;
                return url;
            }
        }
    }
    for (const sheet of order) {
        const rows = allStudents[sheet] || [];
        for (const row of rows) {
            const name = String(row['Full Name'] || row['First Name'] || '').trim();
            if (!name) continue;
            if (name.toLowerCase().includes(targetName) || targetName.includes(name.toLowerCase())) {
                const imgVal = row['Image'] || row['image'] || row['IMAGE'] || '';
                const url = toLh3Url(imgVal);
                studentPhotoCache[cacheKey] = url;
                return url;
            }
        }
    }

    studentPhotoCache[cacheKey] = '';
    return '';
}


// ================================================================
// FETCH EXAM RECORDS
// ================================================================
async function loadRecords(forceRefresh = false) {
    const tableBody = dom.tableBody;
    if (!tableBody) return;

    if (!forceRefresh && dataLoaded && allRecords.length > 0) {
        renderTable();
        return;
    }

    try {
        if (!forceRefresh) {
            const cached = getCache();
            if (cached && Array.isArray(cached) && cached.length > 0) {
                allRecords = cached;
                dataLoaded = true;
                renderTable();
                showToast(`📦 Loaded ${allRecords.length} records from cache`, 'info');
                setTimeout(() => refreshInBackground(), 3000);
                return;
            }
        }

        tableBody.innerHTML = `
            <tr><td colspan="5" style="text-align:center;">
                <div class="loading-container">
                    <div class="loading-spinner"></div>
                    <div class="loading-message">Loading exam records...</div>
                </div>
            </td></tr>
        `;

        const url = `${CONFIG.SCRIPT_URL}?spreadsheetId=${CONFIG.SPREADSHEET_ID}&sheetName=${CONFIG.SHEET_NAME}&_=${Date.now()}`;
        const response = await fetch(url);
        const result = await response.json();

        if (result.status === 'success' && Array.isArray(result.data)) {
            allRecords = result.data.map((item, idx) => ({ ...item, _rowIndex: idx + 2 }));
            setCache(allRecords);
            dataLoaded = true;
            renderTable();
            showToast(`✅ Loaded ${allRecords.length} records`, 'success');
        } else {
            throw new Error(result.message || 'Failed to load data');
        }
    } catch (err) {
        console.error('Load records error:', err);
        const cached = getCache();
        if (cached && Array.isArray(cached) && cached.length > 0) {
            allRecords = cached;
            dataLoaded = true;
            renderTable();
            showToast('⚠️ Using cached data (offline mode)', 'warning');
        } else {
            tableBody.innerHTML = `
                <tr><td colspan="5">
                    <div class="error-container">
                        <span class="error-icon">⚠️</span>
                        <p class="error-title">Failed to load data</p>
                        <p class="error-message">${escapeHtml(err.message)}</p>
                        <div class="error-actions">
                            <button onclick="handleRetry()" class="btn btn-primary">⟳ Retry</button>
                            <button onclick="handleClearCache()" class="btn btn-outline">🧹 Clear Cache</button>
                        </div>
                    </div>
                </td></tr>
            `;
        }
    }
}

async function refreshInBackground() {
    try {
        const url = `${CONFIG.SCRIPT_URL}?spreadsheetId=${CONFIG.SPREADSHEET_ID}&sheetName=${CONFIG.SHEET_NAME}&_=${Date.now()}`;
        const response = await fetch(url);
        const result = await response.json();
        if (result.status === 'success' && Array.isArray(result.data)) {
            const newData = result.data.map((item, idx) => ({ ...item, _rowIndex: idx + 2 }));
            if (JSON.stringify(allRecords) !== JSON.stringify(newData)) {
                allRecords = newData;
                setCache(allRecords);
                renderTable();
                showToast('🔄 Data updated in background', 'info');
            }
        }
    } catch (err) { console.log('Background refresh failed:', err.message); }
}


// ================================================================
// SORTING
// ================================================================
function getRecordMarks(r) {
    const v = parseFloat(r['Obtain Marks']);
    return isNaN(v) ? -1 : v;
}

function sortRecords(records) {
    const list = [...records];
    switch (sortMode) {
        case 'date-desc':
            return list.sort((a, b) => {
                const da = parseAnyDate(a['Date']) || new Date(0);
                const db = parseAnyDate(b['Date']) || new Date(0);
                return db - da;
            });
        case 'date-asc':
            return list.sort((a, b) => {
                const da = parseAnyDate(a['Date']) || new Date(0);
                const db = parseAnyDate(b['Date']) || new Date(0);
                return da - db;
            });
        case 'name-asc':
            return list.sort((a, b) => String(a['Student Name'] || '').localeCompare(String(b['Student Name'] || '')));
        case 'name-desc':
            return list.sort((a, b) => String(b['Student Name'] || '').localeCompare(String(a['Student Name'] || '')));
        case 'std-asc':
            return list.sort((a, b) => String(a['Std'] || '').localeCompare(String(b['Std'] || '')));
        case 'marks-desc':
            return list.sort((a, b) => getRecordMarks(b) - getRecordMarks(a));
        default:
            return list;
    }
}


// ================================================================
// FILTERING
// ================================================================
function getFilteredRecords() {
    const now = new Date();
    let list = [...allRecords];

    if (activeFilter === 'last-test') {
        let latest = null;
        list.forEach(r => {
            const d = parseAnyDate(r['Date']);
            if (!d) return;
            if (!latest || d > latest) latest = d;
        });
        if (latest) {
            list = list.filter(r => {
                const d = parseAnyDate(r['Date']);
                return d && isSameDay(d, latest);
            });
        }
    } else if (activeFilter === 'this-month') {
        list = list.filter(r => {
            const d = parseAnyDate(r['Date']);
            if (!d) return false;
            return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
        });
    } else if (activeFilter === 'last-month') {
        const lm = new Date(now.getFullYear(), now.getMonth() - 1, 1);
        list = list.filter(r => {
            const d = parseAnyDate(r['Date']);
            if (!d) return false;
            return d.getMonth() === lm.getMonth() && d.getFullYear() === lm.getFullYear();
        });
    } else if (activeFilter === 'custom' && customFromDate && customToDate) {
        const from = new Date(customFromDate); from.setHours(0, 0, 0, 0);
        const to   = new Date(customToDate);   to.setHours(23, 59, 59, 999);
        list = list.filter(r => {
            const d = parseAnyDate(r['Date']);
            return d && d >= from && d <= to;
        });
    } else if (activeFilter === 'pass') {
        list = list.filter(r => String(r['Status'] || '').trim().toLowerCase() === 'pass');
    } else if (activeFilter === 'fail') {
        list = list.filter(r => String(r['Status'] || '').trim().toLowerCase() === 'fail');
    }
    return list;
}

function filterLabelFor(f) {
    if (f === 'last-test') return 'Last Test';
    if (f === 'this-month') return 'This Month';
    if (f === 'last-month') return 'Last Month';
    if (f === 'custom') return `Custom (${formatDate(customFromDate)} → ${formatDate(customToDate)})`;
    if (f === 'pass') return 'Pass Only';
    if (f === 'fail') return 'Fail Only';
    return 'All Tests';
}

function updateFilterMeta(filteredCount) {
    const meta = dom.filterMeta;
    const txt = dom.filterMetaText;
    const cnt = dom.filterMetaCount;
    if (!meta || !txt || !cnt) return;

    if (dom.mobileFilterLabel) dom.mobileFilterLabel.textContent = filterLabelFor(activeFilter);

    if (activeFilter === 'all') {
        meta.style.display = 'none';
        return;
    }
    meta.style.display = 'inline-flex';
    txt.textContent = filterLabelFor(activeFilter);
    cnt.textContent = `· ${filteredCount} record${filteredCount === 1 ? '' : 's'}`;
}

function setActiveFilterChip() {
    document.querySelectorAll('.filter-chip').forEach(c => {
        c.classList.toggle('active', c.getAttribute('data-filter') === activeFilter);
    });
}


// ================================================================
// RENDER TABLE
// ================================================================
function renderTable(filter = '') {
    const tableBody = dom.tableBody;
    if (!tableBody) return;

    const searchLower = (filter || '').toLowerCase().trim();

    let list = getFilteredRecords();

    if (searchLower) {
        list = list.filter(r => {
            const name = (r['Student Name'] || '').toLowerCase();
            const stdRaw = (r['Std'] || '').toLowerCase();
            const stdPretty = stdDisplayName(r['Std']).toLowerCase();
            const date = String(r['Date'] || '').toLowerCase();
            const testName = (r['Test Name'] || '').toLowerCase();
            const subject = (r['Subject Name'] || '').toLowerCase();
            const teacher = (r['Assign Teacher'] || '').toLowerCase();
            return name.includes(searchLower) || stdRaw.includes(searchLower) ||
                   stdPretty.includes(searchLower) || date.includes(searchLower) ||
                   testName.includes(searchLower) || subject.includes(searchLower) ||
                   teacher.includes(searchLower);
        });
    }

    list = sortRecords(list);
    updateFilterMeta(list.length);

    if (!list || list.length === 0) {
        tableBody.innerHTML = `
            <tr><td colspan="5">
                <div class="empty-container">
                    <span class="empty-icon">📚</span>
                    <p class="empty-title">${searchLower || activeFilter !== 'all' ? 'No matching records found' : 'No exam records yet'}</p>
                    <p class="empty-subtitle">${searchLower || activeFilter !== 'all' ? 'Try adjusting your search or filter' : 'Records will appear here once they are added'}</p>
                </div>
            </td></tr>
        `;
        return;
    }

    const fragment = document.createDocumentFragment();
    list.forEach((record, idx) => {
        const row = document.createElement('tr');
        const actualIndex = allRecords.indexOf(record);
        const studentName = record['Student Name'] || '—';
        const date = record['Date'] || '—';
        const std = stdDisplayName(record['Std']);

        row.innerHTML = `
            <td><strong>${idx + 1}</strong></td>
            <td>${escapeHtml(studentName)}</td>
            <td>${formatDate(date)}</td>
            <td>${escapeHtml(std)}</td>
            <td>
                <button class="view-action-btn" data-index="${actualIndex}">
                    <i class="fas fa-eye"></i> View
                </button>
            </td>
        `;
        fragment.appendChild(row);
    });

    tableBody.innerHTML = '';
    tableBody.appendChild(fragment);

    tableBody.querySelectorAll('.view-action-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const index = parseInt(this.getAttribute('data-index'));
            if (!isNaN(index) && index >= 0 && index < allRecords.length) {
                currentViewRecord = allRecords[index];
                selectedRowIndex = currentViewRecord._rowIndex;
                showDetailView(currentViewRecord);
            } else {
                showToast('❌ Record not found', 'error');
            }
        });
    });
}
