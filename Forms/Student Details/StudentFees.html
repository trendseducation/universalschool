<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin>
<link rel="dns-prefetch" href="https://script.google.com">

<title>Universal School · My Fees</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"></noscript>

<script>
(function () {
    try {
        var t = localStorage.getItem('user-theme-preference') || 'light';
        document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
    } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
    }
})();
</script>

<style>
/* ══════════════════════════════════════════════════════════════
   THEME VARIABLES — same as StudentExam.html
   ══════════════════════════════════════════════════════════════ */
:root {
    --bg-body: #f4f7fc;
    --bg-card: #ffffff;
    --bg-header: #ffffff;
    --text-main: #1e293b;
    --text-muted: #5b6e8c;
    --text-light: #94a3b8;
    --border-light: #e2e8f0;
    --shadow-sm: 0 12px 28px -8px rgba(0,0,0,0.06);
    --shadow-hover: 0 24px 40px -12px rgba(0,0,0,0.12);
    --accent: #2563eb;
    --accent-2: #7c3aed;
    --accent-soft: rgba(37, 99, 235, 0.08);
    --accent-glow: rgba(37, 99, 235, 0.35);
    --card-border: 1px solid rgba(0,0,0,0.04);
    --input-bg: #f8fafc;
    --input-border: #e2e8f0;
    --success: #10b981;
    --success-soft: rgba(16, 185, 129, 0.10);
    --danger: #ef4444;
    --danger-soft: rgba(239, 68, 68, 0.10);
    --warning: #f59e0b;
    --info: #06b6d4;
    --grad-hero: linear-gradient(135deg, #2563eb, #7c3aed);
    --transition-fast: 150ms ease;
    --transition-normal: 300ms ease;
    --table-header-bg: #f8fafc;
    --table-row-hover: #f1f5f9;
    --table-border: #e2e8f0;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
}
[data-theme="dark"] {
    --bg-body: #0a0f1c;
    --bg-card: #1e293b;
    --bg-header: #111827;
    --text-main: #f1f5f9;
    --text-muted: #9ca3af;
    --text-light: #64748b;
    --border-light: #1f2a3e;
    --shadow-sm: 0 12px 28px -8px rgba(0,0,0,0.6);
    --shadow-hover: 0 24px 40px -12px rgba(0,0,0,0.8);
    --accent: #3b82f6;
    --accent-2: #a78bfa;
    --accent-soft: rgba(59, 130, 246, 0.15);
    --accent-glow: rgba(59, 130, 246, 0.45);
    --card-border: 1px solid rgba(255,255,255,0.04);
    --input-bg: #1e293b;
    --input-border: #334155;
    --table-header-bg: #1e293b;
    --table-row-hover: #334155;
    --table-border: #334155;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg-body);
    color: var(--text-main);
    transition: background var(--transition-normal), color var(--transition-normal);
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    font-size: 15px;
    line-height: 1.5;
    -webkit-tap-highlight-color: transparent;
}

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 8px; }
::-webkit-scrollbar-track { background: transparent; }

img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeSlide { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
@keyframes softPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }

.spinner {
    display: inline-block;
    width: 18px; height: 18px;
    border: 3px solid var(--border-light);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
}
.spinner.sm { width: 14px; height: 14px; border-width: 2px; }

/* ══════════════════════════════════════════════════════════════
   LAYOUT
   ══════════════════════════════════════════════════════════════ */
.app-wrapper {
    max-width: 1200px;
    margin: 0 auto;
    padding: clamp(0.75rem, 2vw, 1.4rem);
    padding-top: calc(clamp(0.75rem, 2vw, 1.4rem) + var(--safe-top));
    padding-bottom: calc(clamp(1rem, 2vw, 1.5rem) + var(--safe-bottom));
    display: grid;
    grid-template-columns: 1fr;
    gap: clamp(0.85rem, 2vw, 1.3rem);
    align-content: start;
    min-height: 100dvh;
}
.page { display: none; animation: fadeSlide 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
.page.active-page { display: block; }

/* ══════════════════════════════════════════════════════════════
   TOP BAR
   ══════════════════════════════════════════════════════════════ */
.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    background: var(--bg-header);
    border-radius: 999px;
    padding: 0.5rem clamp(0.85rem, 2vw, 1.4rem);
    border: var(--card-border);
    box-shadow: var(--shadow-sm);
    position: sticky;
    top: calc(var(--safe-top) + 6px);
    z-index: 50;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    margin-bottom: 0.4rem;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.brand img { height: clamp(30px, 3.5vw, 40px); width: auto; object-fit: contain; flex-shrink: 0; }
[data-theme="dark"] .brand img { filter: brightness(0) invert(1); }
.brand-name {
    font-size: clamp(0.9rem, 1.5vw, 1.15rem);
    font-weight: 800;
    letter-spacing: -0.015em;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.my-account-pill {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    background: var(--accent-soft);
    border: 1px solid var(--border-light);
    border-radius: 999px;
    padding: 4px 12px 4px 4px;
    cursor: pointer;
    transition: all 260ms cubic-bezier(0.2, 0.9, 0.3, 1.1);
    color: var(--text-main);
    flex-shrink: 0;
    max-width: 100%;
    font-weight: 700;
}
.my-account-pill:hover,
.my-account-pill:active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    transform: translateY(-2px);
    box-shadow: 0 10px 24px -10px var(--accent-glow);
}
.my-account-pill .pill-thumb {
    width: clamp(26px, 3vw, 32px);
    height: clamp(26px, 3vw, 32px);
    border-radius: 50%;
    object-fit: cover;
    background: var(--input-bg);
    border: 2px solid var(--bg-card);
    flex-shrink: 0;
}
.my-account-pill:hover .pill-thumb { border-color: rgba(255,255,255,0.6); }
.my-account-pill .pill-label {
    font-size: clamp(0.68rem, 1vw, 0.82rem);
    font-weight: 700;
    letter-spacing: 0.2px;
    white-space: nowrap;
    max-width: clamp(90px, 22vw, 180px);
    overflow: hidden;
    text-overflow: ellipsis;
    display: inline-block;
    vertical-align: middle;
}

/* ══════════════════════════════════════════════════════════════
   TOAST
   ══════════════════════════════════════════════════════════════ */
.toast {
    position: fixed;
    bottom: calc(20px + var(--safe-bottom));
    right: 20px;
    background: var(--bg-card);
    border-left: 5px solid var(--accent);
    padding: 0.9rem 1.2rem;
    border-radius: 0 16px 16px 0;
    box-shadow: var(--shadow-hover);
    font-weight: 600;
    font-size: 0.88rem;
    z-index: 3000;
    display: none;
    animation: slideIn 0.3s ease-out;
    color: var(--text-main);
    max-width: 340px;
}
.toast.success { border-left-color: var(--success); }
.toast.error   { border-left-color: var(--danger); }
.toast.warning { border-left-color: var(--warning); }
.toast.info    { border-left-color: var(--accent); }

/* ══════════════════════════════════════════════════════════════
   TOOLBAR (search + sort + filters)
   ══════════════════════════════════════════════════════════════ */
.toolbar-section {
    background: var(--bg-card);
    border-radius: 32px;
    padding: 1.2rem 1.5rem;
    border: var(--card-border);
    box-shadow: var(--shadow-sm);
    display: flex;
    flex-direction: column;
    gap: 1rem;
    margin-bottom: 1rem;
}
.toolbar-row {
    display: flex;
    gap: 0.8rem;
    flex-wrap: wrap;
    align-items: center;
}
.search-wrapper {
    flex: 1 1 260px;
    min-width: 220px;
    position: relative;
}
.search-wrapper input {
    width: 100%;
    padding: 0.75rem 1rem 0.75rem 2.5rem;
    border-radius: 60px;
    border: 2px solid var(--input-border);
    background: var(--input-bg);
    color: var(--text-main);
    font-size: 0.9rem;
    font-family: inherit;
    transition: all var(--transition-fast);
}
.search-wrapper input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
}
.search-wrapper i {
    position: absolute;
    left: 0.9rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-light);
    font-size: 0.85rem;
    pointer-events: none;
}
.toolbar-select {
    padding: 0.7rem 1rem;
    border-radius: 60px;
    border: 2px solid var(--input-border);
    background: var(--input-bg);
    color: var(--text-main);
    font-size: 0.85rem;
    font-family: inherit;
    cursor: pointer;
    transition: all var(--transition-fast);
    min-width: 170px;
}
.toolbar-select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
}
.desktop-buttons { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-left: auto; }
.filter-group { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
.filter-chip {
    padding: 0.55rem 1.1rem;
    border-radius: 60px;
    border: 2px solid var(--input-border);
    background: var(--input-bg);
    color: var(--text-main);
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    transition: all var(--transition-fast);
    display: inline-flex;
    align-items: center;
    gap: 6px;
}
.filter-chip i { font-size: 0.75rem; opacity: 0.75; }
.filter-chip:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
.filter-chip.active {
    background: linear-gradient(135deg, var(--accent), #1d4ed8);
    color: white;
    border-color: var(--accent);
    box-shadow: 0 6px 16px -6px rgba(37, 99, 235, 0.5);
}
.filter-chip.active i { opacity: 1; }

.filter-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    font-size: 0.78rem;
    color: var(--text-muted);
    padding: 0.4rem 0.8rem;
    border-radius: 30px;
    background: var(--accent-soft);
    border: 1px dashed var(--border-light);
}
.filter-meta strong { color: var(--accent); }
.filter-meta .clear-filter-btn {
    background: transparent;
    border: none;
    color: var(--danger);
    font-weight: 700;
    cursor: pointer;
    font-size: 0.75rem;
    padding: 0 6px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
}
.filter-meta .clear-filter-btn:hover { text-decoration: underline; }

.mobile-controls { display: none; gap: 0.6rem; width: 100%; }
.mobile-controls .toolbar-select { flex: 1; min-width: 0; }
.mobile-controls .mobile-filter-btn {
    flex: 0 0 auto;
    padding: 0.7rem 1.2rem;
    border-radius: 60px;
    border: 2px solid var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all var(--transition-fast);
}
.mobile-controls .mobile-filter-btn:hover { background: var(--accent); color: white; }

/* ══════════════════════════════════════════════════════════════
   TABLE
   ══════════════════════════════════════════════════════════════ */
.table-card {
    background: var(--bg-card);
    border-radius: 32px;
    border: var(--card-border);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
}
.table-wrapper { overflow-x: auto; padding: 0 1rem 1rem; }
.data-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    font-size: 0.875rem;
}
.data-table th {
    text-align: left;
    padding: 1rem 1.2rem;
    background: var(--table-header-bg);
    color: var(--accent);
    font-weight: 700;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 3px solid var(--accent);
    position: sticky;
    top: 0;
    z-index: 10;
}
.data-table td {
    padding: 1rem 1.2rem;
    border-bottom: 1px solid var(--border-light);
    color: var(--text-main);
    transition: background var(--transition-fast);
}
.data-table tr:hover td { background: var(--table-row-hover); }

.view-action-btn {
    background: linear-gradient(135deg, var(--accent), #1d4ed8);
    color: white;
    border: none;
    padding: 6px 16px;
    border-radius: 30px;
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    transition: all var(--transition-fast);
    display: inline-flex;
    align-items: center;
    gap: 6px;
}
.view-action-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); }

/* Payment status badge */
.pay-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.3px;
}
.pay-badge.paid     { background: var(--success-soft); color: var(--success); }
.pay-badge.partial  { background: rgba(245, 158, 11, 0.12); color: var(--warning); }
.pay-badge.due      { background: var(--danger-soft); color: var(--danger); }

/* ══════════════════════════════════════════════════════════════
   BUTTONS
   ══════════════════════════════════════════════════════════════ */
.btn {
    border: none;
    padding: 0.7rem 1.5rem;
    border-radius: 60px;
    font-weight: 700;
    font-size: 0.88rem;
    cursor: pointer;
    transition: all var(--transition-fast);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    font-family: inherit;
}
.btn-primary {
    background: linear-gradient(135deg, var(--accent), #1d4ed8);
    color: #fff;
    box-shadow: 0 6px 18px -6px var(--accent-glow);
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
.btn-outline {
    background: transparent;
    border: 2px solid var(--accent);
    color: var(--accent);
}
.btn-outline:hover { background: var(--accent); color: #fff; transform: translateY(-2px); }
.btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none !important; }

/* ══════════════════════════════════════════════════════════════
   DETAIL VIEW (page 2)
   ══════════════════════════════════════════════════════════════ */
.detail-card {
    background: var(--bg-card);
    border-radius: 32px;
    border: var(--card-border);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
}

.detail-hero {
    background: var(--grad-hero);
    color: #fff;
    padding: 1.5rem 1.8rem;
    border-radius: 32px 32px 0 0;
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    align-items: center;
    justify-content: space-between;
}
.detail-hero-left { display: flex; flex-direction: column; gap: 6px; min-width: 200px; }
.detail-hero-left .name {
    font-size: clamp(1.2rem, 2.5vw, 1.6rem);
    font-weight: 800;
    letter-spacing: -0.4px;
}
.detail-hero-left .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    font-size: 0.82rem;
    opacity: 0.95;
}
.detail-hero-left .meta span {
    background: rgba(255,255,255,0.16);
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.25);
    display: inline-flex;
    align-items: center;
    gap: 6px;
}
.detail-hero-left .meta i { font-size: 0.85em; }

.detail-hero .btn-back {
    background: rgba(255,255,255,0.16);
    border: 1px solid rgba(255,255,255,0.35);
    color: #fff;
    padding: 0.55rem 1.1rem;
    border-radius: 999px;
    font-size: 0.82rem;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all var(--transition-fast);
    font-family: inherit;
}
.detail-hero .btn-back:hover {
    background: rgba(255,255,255,0.28);
    transform: translateX(-2px);
}

.kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 1rem;
    padding: 1.4rem 1.8rem;
}
.kpi-card {
    background: linear-gradient(135deg, var(--accent-soft), rgba(124,58,237,0.08));
    border-radius: 18px;
    padding: 1.1rem 1.3rem;
    border: 1px solid var(--border-light);
    text-align: center;
    transition: transform var(--transition-fast), box-shadow var(--transition-fast);
}
.kpi-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-sm); }
.kpi-label {
    font-size: 0.68rem;
    text-transform: uppercase;
    font-weight: 800;
    color: var(--text-muted);
    letter-spacing: 0.6px;
}
.kpi-value {
    font-size: clamp(1.3rem, 3vw, 1.7rem);
    font-weight: 800;
    margin-top: 6px;
    color: var(--text-main);
    letter-spacing: -0.5px;
}
.kpi-value.primary { color: var(--accent); }
.kpi-value.success { color: var(--success); }
.kpi-value.danger  { color: var(--danger); }

.installments-section {
    padding: 0 1.8rem 1.8rem;
}
.section-title {
    font-size: 0.82rem;
    font-weight: 800;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: 8px;
}
.section-title i { color: var(--accent); }

.details-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1rem;
}
.installment-card {
    background: var(--bg-card);
    border: 1px solid var(--border-light);
    border-radius: 18px;
    padding: 1rem 1.1rem;
    transition: all var(--transition-fast);
}
.installment-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-sm);
    border-color: var(--accent);
}
.installment-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 0.6rem;
    border-bottom: 1px solid var(--border-light);
    margin-bottom: 0.7rem;
}
.installment-header .ins-number {
    font-weight: 800;
    color: var(--text-main);
    font-size: 0.95rem;
}
.installment-header .ins-method {
    font-size: 0.68rem;
    font-weight: 700;
    padding: 3px 12px;
    border-radius: 20px;
    background: linear-gradient(135deg, var(--accent), #1d4ed8);
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 0.4px;
}
.installment-details {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.6rem;
    font-size: 0.8rem;
}
.installment-details .ins-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
}
.installment-details .ins-item .ins-label {
    font-size: 0.62rem;
    text-transform: uppercase;
    color: var(--text-muted);
    font-weight: 800;
    letter-spacing: 0.4px;
}
.installment-details .ins-item .ins-value {
    font-weight: 600;
    color: var(--text-main);
    word-break: break-word;
}
.installment-amount {
    margin-top: 0.7rem;
    padding-top: 0.7rem;
    border-top: 1px solid var(--border-light);
    display: flex;

/* ══════════════════════════════════════════════════════════════

const DASH_COLS = {

/* ══════════════════════════════════════════════════════════════

const $ = (id) => document.getElementById(id);

/* ══════════════════════════════════════════════════════════════
   STATE

let currentEmail     = null;
let currentFullName  = null;
let allFeeRecords    = [];
let filteredRecords  = [];

/* ══════════════════════════════════════════════════════════════
   UTILITIES
   ══════════════════════════════════════════════════════════════ */
function showToast(msg, type = 'info', ms = 3500) {
    if (!dom.toast) return;
    dom.toast.textContent = msg;
    dom.toast.className = `toast ${type}`;
    dom.toast.style.display = 'block';
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => { dom.toast.style.display = 'none'; }, ms);
}
function setRefreshIndicator(on) {
    if (dom.refreshDot) dom.refreshDot.classList.toggle('show', !!on);
}
function normalizeEmail(v) { return (v || '').toString().trim().toLowerCase(); }
function normalizeName(v) {
    if (v == null) return '';
    return v.toString().replace(/\./g, '').replace(/\s+/g, ' ').trim().toLowerCase();
}
function namesMatch(a, b) {
    const na = normalizeName(a);
    const nb = normalizeName(b);
    if (!na || !nb) return false;
    if (na === nb) return true;
    const wa = na.split(' ').filter(Boolean);
    const wb = nb.split(' ').filter(Boolean);
    if (wa.length >= 2 && wb.length >= 2) {
        const sameFirst = wa[0] === wb[0];
        const sameLast  = wa[wa.length - 1] === wb[wb.length - 1];
        if (sameFirst && sameLast) return true;
        if (na.includes(nb) || nb.includes(na)) return true;
    }
    return false;
}
function escapeHtml(v) {
    return (v == null ? '' : v.toString())
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function readSessionValue(key) {
    try {
        const raw = localStorage.getItem(key);
        if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && typeof parsed === 'object' && 'value' in parsed) {
                if (parsed.expiry && Date.now() >= parsed.expiry) {
                    localStorage.removeItem(key);
                    return null;
                }
                return parsed.value;
            }
            return parsed;
        }
    } catch (e) {}
    try {
        const s = sessionStorage.getItem(key);
        if (s) { try { return JSON.parse(s); } catch (e) { return s; } }
    } catch (e) {}
    return null;
}
function getLoggedInEmail() {
    const userType = readSessionValue(SESSION_KEYS.USER_TYPE);
    if (userType !== 'student') return null;
    const email = readSessionValue(SESSION_KEYS.USER);
    if (!email) return null;
    return normalizeEmail(email);
}
function pickByAliases(row, aliases) {
    if (!row) return '';
    const wanted = aliases.map(a => a.toString().trim().toLowerCase());
    for (const key of Object.keys(row)) {
        const norm = key.toString().trim().toLowerCase();
        if (wanted.includes(norm)) {
            const v = row[key];
            if (v != null && v.toString().trim() !== '') return v;
        }
    }
    return '';
}

/* ══════════════════════════════════════════════════════════════
   NAME HELPERS — mirrors StudentDashboard.html
   ══════════════════════════════════════════════════════════════ */
const NAME_HEADER_ALIASES_FULL = [
    'full name','fullname','name','student name','studentname',
    'student','full_name','full-name','student_name','student-name',
    'name of student','nameofstudent'
];
function getRowFullName(row) {
    if (!row) return '';
    for (const key of Object.keys(row)) {
        const norm = key.toString().trim().toLowerCase();
        if (NAME_HEADER_ALIASES_FULL.includes(norm)) {
            const v = row[key];
            if (v != null && v.toString().trim() !== '') return v.toString().trim();
        }
    }
    return '';
}

function updatePillLabel(fullName, avatarUrl) {
    if (dom.pillLabel) {
        const name = (fullName || '').toString().trim();
        if (!name) dom.pillLabel.textContent = 'My Account';
        else {
            const short = name.length > 18 ? name.slice(0, 16).trim() + '…' : name;
            dom.pillLabel.textContent = short;
            if (dom.myAccountPill) dom.myAccountPill.title = `${name} · My Account`;

    if (avatarUrl && dom.pillThumb) dom.pillThumb.src = avatarUrl;
}

/* ══════════════════════════════════════════════════════════════
   THEME
   ══════════════════════════════════════════════════════════════ */
function applyTheme(theme) {
    const t = theme === 'dark' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
    document.body.setAttribute('data-theme', t);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', t === 'dark' ? '#0a0f1c' : '#2563eb');
}
function initTheme() {
    const saved = localStorage.getItem(THEME_KEY);
    applyTheme(saved || 'light');
    window.addEventListener('storage', (e) => {
        if (e.key === THEME_KEY && e.newValue) applyTheme(e.newValue);
    });
    window.addEventListener('message', (e) => {
        if (e.data && e.data.type === 'themeChange' && e.data.theme) applyTheme(e.data.theme);
    });
    document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
            const latest = localStorage.getItem(THEME_KEY);
            if (latest) applyTheme(latest);
        }
    });
}

/* ══════════════════════════════════════════════════════════════
   DATE / DRIVE HELPERS
   ══════════════════════════════════════════════════════════════ */
function parseDateFlexible(v) {
    if (!v) return null;
    if (v instanceof Date && !isNaN(v)) return v;
    const s = v.toString().trim();
    let m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
    if (m) {
        let [, d, mo, y] = m;
        if (y.length === 2) y = '20' + y;
        const dt = new Date(+y, +mo - 1, +d);
        return isNaN(dt) ? null : dt;
    }
    m = s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
    if (m) {
        const dt = new Date(+m[1], +m[2] - 1, +m[3]);
        return isNaN(dt) ? null : dt;
    }
    const dt = new Date(s);
    return isNaN(dt) ? null : dt;
}
function fmtDate(v) {
    const d = parseDateFlexible(v);
    if (!d) return v == null ? '' : v.toString();
    const dd = String(d.getDate()).padStart(2, '0');
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    return `${dd}/${mm}/${d.getFullYear()}`;
}
function fmtMoney(v) {
    const n = parseFloat(v) || 0;
    return n.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function getFileId(url) {
    if (!url) return '';
    const m = url.toString().match(/\/d\/([-\w]{25,})|id=([-\w]{25,})/);
    if (m) return m[1] || m[2] || '';
    const bare = url.toString().match(/^([-\w]{25,})$/);
    return bare ? bare[1] : '';
}
const SUPPORTS_WEBP = (() => {
    try {
        const c = document.createElement('canvas');
        c.width = c.height = 1;
        return c.toDataURL('image/webp').indexOf('data:image/webp') === 0;
    } catch (e) { return false; }
})();
function getDriveThumb(url, size = 80) {
    const id = getFileId(url);
    if (!id) return '';
    const base = `https://lh3.googleusercontent.com/d/${id}=w${size}`;
    return SUPPORTS_WEBP ? base + '-rw' : base;
}

/* ══════════════════════════════════════════════════════════════
   NETWORK
   ══════════════════════════════════════════════════════════════ */
function sheetCacheKey(id, name) { return `${SHEET_KEY_PREFIX}${id}::${name}`; }
function readSheetCache(id, name, allowStale = false) {
    try {
        const raw = localStorage.getItem(sheetCacheKey(id, name));
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (!parsed || !Array.isArray(parsed.rows)) return null;
        if (allowStale || (Date.now() - (parsed.ts || 0)) < SHEET_CACHE_TTL) return parsed.rows;
    } catch (e) {}
    return null;
}
function writeSheetCache(id, name, rows) {
    try { localStorage.setItem(sheetCacheKey(id, name), JSON.stringify({ ts: Date.now(), rows })); } catch (e) {}
}
function clearSheetCache(id, name) {
    try { localStorage.removeItem(sheetCacheKey(id, name)); } catch (e) {}
}
async function fetchSheet(id, name, { bust = false, allowStale = false } = {}) {
    if (!bust) {
        const cached = readSheetCache(id, name, allowStale);
        if (cached) return cached;
    }
    const url = `${SCRIPT_URL}?spreadsheetId=${id}&sheetName=${encodeURIComponent(name)}&action=getData${bust ? '&_=' + Date.now() : ''}`;
    const resp = await fetch(url, { cache: 'no-store' });
    if (!resp.ok) throw new Error('Network error');
    const json = await resp.json();
    if (json.status !== 'success' || !Array.isArray(json.data)) throw new Error(json.message || 'Invalid response');
    writeSheetCache(id, name, json.data);
    return json.data;
}

/* ══════════════════════════════════════════════════════════════
   NAME RESOLUTION
   ══════════════════════════════════════════════════════════════ */
async function resolveProfile() {
    const emailKey = currentEmail;

    /* 1) Cache from StudentDashboard */
    try {
        const raw = localStorage.getItem(PROFILE_KEY_PREFIX + emailKey);
        if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && parsed.row) {
                const cachedName = pickByAliases(parsed.row, DASH_COLS.FULL_NAME);
                if (cachedName) {
                    const imgRaw = pickByAliases(parsed.row, DASH_COLS.IMAGE);
                    const avatar = imgRaw ? getDriveThumb(imgRaw, 80) : '';
                    updatePillLabel(cachedName, avatar);
                    return cachedName;
                }
            }
        }
    } catch (e) {}

    /* 2) Dashboard sheets */
    const tasks = DASHBOARD_SHEET_NAMES.map(async (sheetName) => {
        try {
            const rows = await fetchSheet(DASHBOARD_SPREADSHEET_ID, sheetName, { allowStale: true });
            const idx = rows.findIndex(r => normalizeEmail(pickByAliases(r, DASH_COLS.EMAIL)) === emailKey);
            if (idx !== -1) {
                const name = pickByAliases(rows[idx], DASH_COLS.FULL_NAME);
                if (name) {
                    const imgRaw = pickByAliases(rows[idx], DASH_COLS.IMAGE);
                    const avatar = imgRaw ? getDriveThumb(imgRaw, 80) : '';
                    return { sheet: sheetName, row: rows[idx], rowIndex: idx + 2, name, avatar };
                }
            }
        } catch (e) {}
        return null;
    });
    const results = await Promise.all(tasks);
    const found = results.find(r => r !== null);
    if (found) {
        try {
            localStorage.setItem(PROFILE_KEY_PREFIX + emailKey, JSON.stringify({
                ts: Date.now(), row: found.row, sheetName: found.sheet, rowIndex: found.rowIndex, fullName: found.name
            }));
        } catch (e) {}
        updatePillLabel(found.name, found.avatar);
        return found.name;
    }

    /* 3) Login sheet */
    try {
        const rows = await fetchSheet(LOGIN_SPREADSHEET_ID, LOGIN_SHEET_NAME, { allowStale: true });
        const idx = rows.findIndex(r => normalizeEmail(pickByAliases(r, DASH_COLS.EMAIL)) === emailKey);
        if (idx !== -1) {
            const name = pickByAliases(rows[idx], DASH_COLS.FULL_NAME);
            const imgRaw = pickByAliases(rows[idx], DASH_COLS.IMAGE);
            const avatar = imgRaw ? getDriveThumb(imgRaw, 80) : '';
            if (name) { updatePillLabel(name, avatar); return name; }
        }
    } catch (e) {}

    /* 4) Derive from email */
    const local = (emailKey || '').split('@')[0] || 'Student';
    const derived = local.replace(/[._-]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase()).trim() || 'Student';
    updatePillLabel(derived);
    return derived;
}

/* ══════════════════════════════════════════════════════════════
   LOAD ALL FEE RECORDS
   ══════════════════════════════════════════════════════════════ */
async function loadAllFeeRecords({ bust = false } = {}) {
    setRefreshIndicator(true);
    if (bust) {
        FEES_SHEET_NAMES.forEach(n => clearSheetCache(FEES_SPREADSHEET_ID, n));
    }
    try {
        const targetName = normalizeName(currentFullName);
        const collected = [];

        const tasks = FEES_SHEET_NAMES.map(async (sheetName) => {
            try {
                const rows = await fetchSheet(FEES_SPREADSHEET_ID, sheetName, { bust, allowStale: true });
                const out = [];
                for (let i = 0; i < rows.length; i++) {
                    const rowName = pickByAliases(rows[i], FEE_COLS.FULL_NAME);
                    if (namesMatch(rowName, targetName)) {
                        out.push({ sheetName, row: rows[i], rowIndex: i + 2 });
                    }
                }
                return out;
            } catch (e) {
                console.warn(`[Fees] "${sheetName}" failed:`, e.message);
                return [];
            }
        });

        const results = await Promise.all(tasks);
        for (const list of results) collected.push(...list);

        allFeeRecords = collected;

        console.log(`[Fees] Name: "${currentFullName}" · Found ${collected.length} fee record(s)`);
    } finally {
        setRefreshIndicator(false);
    }
}

/* ══════════════════════════════════════════════════════════════
   FILTER + SORT
   ══════════════════════════════════════════════════════════════ */
function computeStatus(row) {
    const total   = parseFloat(pickByAliases(row, FEE_COLS.TOTAL_FEES)) || 0;
    const paid    = parseFloat(pickByAliases(row, FEE_COLS.PAID_FEES))  || 0;
    const balance = parseFloat(pickByAliases(row, FEE_COLS.BALANCE_FEES));
    const bal = !isNaN(balance) ? balance : (total - paid);
    if (total > 0 && bal <= 0) return 'paid';
    if (paid > 0) return 'partial';
    return 'due';
}

function applyFilter() {
    const q = (dom.searchInput?.value || '').trim().toLowerCase();
    let rows = allFeeRecords.slice();

    if (activeFilter !== 'all') {
        rows = rows.filter(r => computeStatus(r.row) === activeFilter);
    }

    if (q) {
        rows = rows.filter(r => {
            const name   = pickByAliases(r.row, FEE_COLS.FULL_NAME).toLowerCase();
            const year   = String(pickByAliases(r.row, FEE_COLS.ACADEMIC_YEAR)).toLowerCase();
            const std    = r.sheetName.toLowerCase();
            const sr     = String(pickByAliases(r.row, FEE_COLS.SR_NO)).toLowerCase();
            return name.includes(q) || year.includes(q) || std.includes(q) || sr.includes(q);
        });
    }

    const sortVal = dom.sortSelect?.value || dom.mobileSortSelect?.value || 'name-asc';
    rows.sort((a, b) => {
        const an = pickByAliases(a.row, FEE_COLS.FULL_NAME) || '';
        const bn = pickByAliases(b.row, FEE_COLS.FULL_NAME) || '';
        const ay = String(pickByAliases(a.row, FEE_COLS.ACADEMIC_YEAR) || '');
        const by = String(pickByAliases(b.row, FEE_COLS.ACADEMIC_YEAR) || '');
        if (sortVal === 'name-asc')  return an.localeCompare(bn);
        if (sortVal === 'name-desc') return bn.localeCompare(an);
        if (sortVal === 'year-asc')  return ay.localeCompare(by);
        return by.localeCompare(ay);
    });

    filteredRecords = rows;
    renderTable();
    updateFilterMeta();
}

function updateFilterMeta() {
    const labelMap = {
        'all': 'All Records',
        'paid': 'Fully Paid',
        'partial': 'Partial',
        'due': 'Due'
    };
    const show = activeFilter !== 'all';
    if (dom.filterMeta) dom.filterMeta.style.display = show ? 'flex' : 'none';
    if (show) {
        if (dom.filterMetaText) dom.filterMetaText.textContent = labelMap[activeFilter] || activeFilter;
        if (dom.filterMetaCount) dom.filterMetaCount.textContent = `(${filteredRecords.length} record${filteredRecords.length === 1 ? '' : 's'})`;
    }
    if (dom.mobileFilterLabel) dom.mobileFilterLabel.textContent = labelMap[activeFilter] || 'All';
    document.querySelectorAll('.filter-chip').forEach(chip => {
        chip.classList.toggle('active', chip.dataset.filter === activeFilter);
    });
}

/* ══════════════════════════════════════════════════════════════
   TABLE
   ══════════════════════════════════════════════════════════════ */
function renderTable() {
    if (!dom.tableBody) return;
    if (!filteredRecords.length) {
        const isFiltered = activeFilter !== 'all' || (dom.searchInput?.value || '').trim();
        dom.tableBody.innerHTML = `
            <tr><td colspan="5">
                <div class="empty-container">
                    <i class="fas fa-receipt empty-icon"></i>
                    <div class="empty-title">${isFiltered ? 'No matching records' : 'No fee records found'}</div>
                    <div class="empty-subtitle">${isFiltered
                        ? 'Try adjusting or clearing the filter.'
                        : `No fee record found for "${escapeHtml(currentFullName || '')}". Please contact the academy office.`}</div>
                </div>
            </td></tr>`;
        return;
    }

    /* Stable _id per record for view-button lookup */
    filteredRecords.forEach((r, i) => { r._id = 'fee_' + i + '_' + (r.sheetName || ''); });

    dom.tableBody.innerHTML = filteredRecords.map((r, i) => {
        const name    = pickByAliases(r.row, FEE_COLS.FULL_NAME) || currentFullName || '—';
        const paid    = parseFloat(pickByAliases(r.row, FEE_COLS.PAID_FEES)) || 0;
        const total   = parseFloat(pickByAliases(r.row, FEE_COLS.TOTAL_FEES)) || 0;
        const balanceRaw = parseFloat(pickByAliases(r.row, FEE_COLS.BALANCE_FEES));
        const balance = !isNaN(balanceRaw) ? balanceRaw : (total - paid);
        const srNo    = pickByAliases(r.row, FEE_COLS.SR_NO) || (i + 1);

        return `
            <tr>
                <td><strong>${escapeHtml(srNo)}</strong></td>
                <td>${escapeHtml(name)}</td>
                <td style="font-weight: 700; color: var(--success);">₹${fmtMoney(paid)}</td>
                <td style="font-weight: 700; color: ${balance > 0 ? 'var(--danger)' : 'var(--success)'};">₹${fmtMoney(balance)}</td>
                <td>
                    <button class="view-action-btn" data-view-id="${escapeHtml(r._id)}">
                        <i class="fas fa-eye"></i> View
                    </button>
                </td>
            </tr>
        `;
    }).join('');

    dom.tableBody.querySelectorAll('[data-view-id]').forEach(btn => {
        btn.addEventListener('click', () => {
            const id = btn.dataset.viewId;
            const record = filteredRecords.find(x => x._id === id);
            if (record) showDetail(record);
        });
    });
}

/* ══════════════════════════════════════════════════════════════
   DETAIL VIEW (page 2)
   ══════════════════════════════════════════════════════════════ */
function showDetail(record) {
    const row = record.row;

    dom.detailName.textContent = pickByAliases(row, FEE_COLS.FULL_NAME) || currentFullName;
    dom.detailSrNo.textContent = pickByAliases(row, FEE_COLS.SR_NO) || '—';
    dom.detailAcademicYear.textContent = pickByAliases(row, FEE_COLS.ACADEMIC_YEAR) || '—';
    dom.detailStd.textContent = record.sheetName.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

    const total   = parseFloat(pickByAliases(row, FEE_COLS.TOTAL_FEES)) || 0;
    const paid    = parseFloat(pickByAliases(row, FEE_COLS.PAID_FEES))  || 0;
    const balance = parseFloat(pickByAliases(row, FEE_COLS.BALANCE_FEES));
    const bal = !isNaN(balance) ? balance : (total - paid);

    dom.p_totalFees.textContent   = fmtMoney(total);
    dom.p_paidFees.textContent    = fmtMoney(paid);
    dom.p_balanceFees.textContent = fmtMoney(bal);

    const container = dom.installmentsContainer;
    container.innerHTML = '';
    let visibleCount = 0;

    for (let i = 1; i <= MAX_INSTALLMENTS; i++) {
        const modeValue   = pickByAliases(row, INS_COLS.MODE(i));
        const amountValue = pickByAliases(row, INS_COLS.AMOUNT(i));
        if (!modeValue || !amountValue || parseFloat(amountValue) === 0) continue;

        visibleCount++;
        const dateValue  = pickByAliases(row, INS_COLS.DATE(i));
        const receiptNo  = pickByAliases(row, INS_COLS.RECEIPT(i)) || '—';
        const bankRef    = pickByAliases(row, INS_COLS.BANK_REF(i));
        const upiRef     = pickByAliases(row, INS_COLS.UPI_REF(i));
        const nextDue    = pickByAliases(row, INS_COLS.NEXT_DUE(i));

        let refString = "<span style='color: var(--text-muted);'>None</span>";
        if (bankRef) refString = `<span style="background: var(--table-header-bg); padding: 3px 10px; border-radius: 6px; font-family: monospace; font-size: 0.75rem;">${escapeHtml(bankRef)}</span>`;
        if (upiRef)  refString = `<span style="background: var(--table-header-bg); padding: 3px 10px; border-radius: 6px; font-family: monospace; font-size: 0.75rem;">${escapeHtml(upiRef)}</span>`;

        const card = document.createElement('div');
        card.className = 'installment-card';
        card.innerHTML = `
            <div class="installment-header">
                <span class="ins-number">Installment ${i}</span>
                <span class="ins-method">${escapeHtml(modeValue)}</span>
            </div>
            <div class="installment-details">
                <div class="ins-item">
                    <span class="ins-label">Transaction Date</span>
                    <span class="ins-value">${escapeHtml(fmtDate(dateValue) || '—')}</span>
                </div>
                <div class="ins-item">
                    <span class="ins-label">Receipt ID</span>
                    <span class="ins-value">${escapeHtml(receiptNo)}</span>
                </div>
                <div class="ins-item" style="grid-column: 1 / -1;">
                    <span class="ins-label">Next Scheduled Interval</span>
                    <span class="ins-value">${escapeHtml(fmtDate(nextDue) || '—')}</span>
                </div>
                <div class="ins-item" style="grid-column: 1 / -1;">
                    <span class="ins-label">Reference</span>
                    <span class="ins-value">${refString}</span>
                </div>
            </div>
            <div class="installment-amount">
                <span>Value Allocation</span>
                <span class="amount-value">₹${fmtMoney(amountValue)}</span>
            </div>
        `;
        container.appendChild(card);
    }

    if (visibleCount === 0) {
        container.innerHTML = `
            <div class="installment-card" style="grid-column:1/-1; text-align:center;">
                <div style="padding: 20px; color: var(--text-muted); font-weight: 600;">
                    <i class="fas fa-inbox" style="font-size: 1.6rem; display:block; margin-bottom:8px; opacity:0.6;"></i>
                    No installment payments have been recorded yet.
                </div>
            </div>`;
    }

    dom.page1.classList.remove('active-page');
    dom.page2.classList.add('active-page');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function backToList() {
    dom.page2.classList.remove('active-page');
    dom.page1.classList.add('active-page');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ══════════════════════════════════════════════════════════════
   REFRESH
   ══════════════════════════════════════════════════════════════ */
async function doRefresh() {
    if (refreshInFlight) return;
    refreshInFlight = true;

    [dom.refreshBtn, dom.mobileRefreshBtn].forEach(btn => {
        if (!btn) return;
        btn.disabled = true;
        btn.dataset.originalHtml = btn.innerHTML;
        btn.innerHTML = '<span class="spinner sm"></span> Refreshing…';
    });

    try {
        DASHBOARD_SHEET_NAMES.forEach(n => clearSheetCache(DASHBOARD_SPREADSHEET_ID, n));
        FEES_SHEET_NAMES.forEach(n => clearSheetCache(FEES_SPREADSHEET_ID, n));
        clearSheetCache(LOGIN_SPREADSHEET_ID, LOGIN_SHEET_NAME);

        currentFullName = await resolveProfile();
        await loadAllFeeRecords({ bust: true });
        applyFilter();

        if (allFeeRecords.length) {
            showToast(`✅ Refreshed — ${allFeeRecords.length} record${allFeeRecords.length === 1 ? '' : 's'}`, 'success', 2500);
        } else {
            showToast('✅ Refreshed — no records found', 'info', 2500);
        }
    } catch (err) {
        console.error('[Refresh]', err);
        showToast('❌ Refresh failed: ' + (err.message || 'Unknown error'), 'error', 4000);
    } finally {
        refreshInFlight = false;
        [dom.refreshBtn, dom.mobileRefreshBtn].forEach(btn => {
            if (!btn) return;
            btn.disabled = false;
            if (btn.dataset.originalHtml) btn.innerHTML = btn.dataset.originalHtml;
        });
    }
}

/* ══════════════════════════════════════════════════════════════
   EVENTS
   ══════════════════════════════════════════════════════════════ */
function bindEvents() {
    let searchTimer = null;
    dom.searchInput?.addEventListener('input', () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(applyFilter, 180);
    });
    dom.sortSelect?.addEventListener('change', applyFilter);
    dom.mobileSortSelect?.addEventListener('change', () => {
        if (dom.sortSelect) dom.sortSelect.value = dom.mobileSortSelect.value;
        applyFilter();
    });

    document.querySelectorAll('.filter-chip').forEach(chip => {
        chip.addEventListener('click', () => {
            activeFilter = chip.dataset.filter;
            closeMobileFilter();
            applyFilter();
        });
    });
    dom.clearFilterBtn?.addEventListener('click', () => {
        activeFilter = 'all';
        if (dom.searchInput) dom.searchInput.value = '';
        applyFilter();
    });

    dom.mobileFilterBtn?.addEventListener('click', openMobileFilter);
    dom.mobileFilterClose?.addEventListener('click', closeMobileFilter);
    dom.mobileFilterBackdrop?.addEventListener('click', closeMobileFilter);

    dom.backToListBtn?.addEventListener('click', backToList);

    dom.refreshBtn?.addEventListener('click', doRefresh);
    dom.mobileRefreshBtn?.addEventListener('click', doRefresh);

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeMobileFilter();
    });
}

function openMobileFilter() {
    dom.mobileFilterSheet.style.bottom = '0';
    dom.mobileFilterBackdrop.style.opacity = '1';
    dom.mobileFilterBackdrop.style.visibility = 'visible';
    document.body.style.overflow = 'hidden';
}
function closeMobileFilter() {
    dom.mobileFilterSheet.style.bottom = '-100%';
    dom.mobileFilterBackdrop.style.opacity = '0';
    dom.mobileFilterBackdrop.style.visibility = 'hidden';
    document.body.style.overflow = '';
}

/* ══════════════════════════════════════════════════════════════
   BOOT
   ══════════════════════════════════════════════════════════════ */
async function init() {
    cacheDom();
    initTheme();
    bindEvents();

    currentEmail = getLoggedInEmail();
    if (!currentEmail) {
        showToast('Please log in as a student first', 'error', 5000);
        dom.tableBody.innerHTML = `
            <tr><td colspan="5">
                <div class="error-container">
                    <i class="fas fa-user-lock error-icon"></i>
                    <div class="error-title">Not logged in</div>
                    <div class="empty-subtitle">You need to be logged in as a student to view your fee details.</div>
                    <div style="margin-top: 16px;">
                        <a href="../../Study Material/My Account/myaccount.html" class="btn btn-primary">
                            <i class="fas fa-sign-in-alt"></i> Go to Login
                        </a>
                    </div>
                </div>
            </td></tr>`;
        return;
    }

    try {
        currentFullName = await resolveProfile();
        console.log('[Boot] Name:', currentFullName);

        await loadAllFeeRecords();
        applyFilter();

        if (!allFeeRecords.length) {
            showToast(`No fee records found for "${currentFullName}"`, 'info', 4500);
        }
    } catch (err) {
        console.error('[StudentFees]', err);
        showToast('Failed to load fee records: ' + (err.message || 'Unknown error'), 'error', 5000);
        dom.tableBody.innerHTML = `
            <tr><td colspan="5">
                <div class="error-container">
                    <i class="fas fa-exclamation-triangle error-icon"></i>
                    <div class="error-title">Failed to load</div>
                    <div class="empty-subtitle">${escapeHtml(err.message || 'Something went wrong')}</div>
                    <div style="margin-top: 16px;">
                        <button class="btn btn-primary" onclick="location.reload()">
                            <i class="fas fa-rotate"></i> Retry
                        </button>
                    </div>
                </div>
            </td></tr>`;
    }
}

/* ══════════════════════════════════════════════════════════════
   REFRESH TRIGGERS
   ══════════════════════════════════════════════════════════════ */
document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    if (!currentEmail) return;
    const now = Date.now();
    if (now - lastFocusRefresh > 60 * 1000) {
        lastFocusRefresh = now;
        doRefresh();
    }
});
window.addEventListener('online', () => {
    if (currentEmail) doRefresh();
});
window.addEventListener('pageshow', (event) => {
    if (event.persisted && currentEmail) {
        lastFocusRefresh = Date.now();
        doRefresh();
    }
});

function scheduleInit() {
    if ('requestIdleCallback' in window) {
        requestIdleCallback(() => init(), { timeout: 1200 });
    } else {
        setTimeout(init, 0);
    }
}
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', scheduleInit, { once: true });
} else {
    scheduleInit();
}

})();
</script>
